<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>新社高中公假登記系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-subtle: #eff6ff;
      --danger: #ef4444;
      --danger-subtle: #fef2f2;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-subtle: #e2e8f0;
      --border-focus: #93c5fd;
      --surface-bg: #f8fafc;
      --card-bg: #ffffff;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
      min-height: 100vh;
      padding: 36px 16px 80px 16px;
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
    }
    .main-card {
      background: var(--card-bg);
      padding: 36px 32px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
    }
    .main-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
    }
    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      text-align: center;
      color: var(--text-main);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .section-box {
      background: var(--surface-bg);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .section-box:focus-within {
      border-color: var(--border-focus);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.08);
    }
    .time-badge {
      font-size: 13px;
      color: #0369a1;
      background: #e0f2fe;
      padding: 6px 14px;
      border-radius: 999px;
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      border: 1px solid #bae6fd;
    }
    .notice-box {
      background-color: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.8;
      color: #1e40af;
    }
    .notice-box strong { color: #1e3a8a; }
    .status-hint {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .student-card {
      background: #ffffff;
      border: 1.5px solid var(--border-subtle);
      border-left: 5px solid var(--primary);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      animation: cardAppear 0.25s ease-out;
    }
    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .student-card:hover {
      box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.08);
      border-color: #cbd5e1;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
      font-weight: 700;
      color: var(--primary);
      font-size: 15px;
    }
    .del-btn {
      background: var(--danger-subtle);
      color: var(--danger);
      border: none;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .del-btn:hover {
      background: #fee2e2;
      color: #dc2626;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1.2fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #475569;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      height: 44px;
      padding: 8px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: var(--radius-sm);
      font-size: 14px;
      background-color: #ffffff;
      color: var(--text-main);
      font-family: inherit;
      transition: all 0.15s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .periods-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #475569;
    }
    .checkbox-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: #f8fafc;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-subtle);
    }
    .checkbox-item {
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: #ffffff;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1.5px solid #cbd5e1;
      color: #334155;
      user-select: none;
      transition: all 0.15s ease;
    }
    .checkbox-item:hover {
      background: #eff6ff;
      border-color: #93c5fd;
    }
    .checkbox-item input {
      margin-right: 6px;
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
    }
    .checkbox-item:has(input:checked) {
      background: #eff6ff;
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }
    .btn-add {
      width: 100%;
      height: 48px;
      background: #ffffff;
      color: var(--primary);
      border: 2px dashed #93c5fd;
      border-radius: var(--radius-md);
      padding: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-add:hover {
      background: var(--primary-subtle);
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .btn-submit {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    #msg {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }
    #loading {
      text-align: center;
      padding: 50px 16px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      .main-card { padding: 24px 16px; }
      .form-grid { grid-template-columns: 1fr; gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-card">
      <h2>📋 新社高中公假登記系統</h2>
      
      <div id="loading">
        <div class="loading-spinner"></div>
        資料載入中...
      </div>

      <div id="appBody" style="display: none;">
        <div class="section-box">
          <label for="actSelect">📌 請選擇填寫的活動項目</label>
          <select id="actSelect" required>
            <option value="">-- 請選擇活動 --</option>
          </select>
          <div id="timeInfo" class="time-badge" style="display: none;"></div>
        </div>

        <div id="noticeBox" class="notice-box" style="display: none;"></div>

        <form id="leaveForm" style="display: none;">
          <div class="section-box">
            <label for="clubSelect">所屬社團 / 單位</label>
            <select id="clubSelect" required>
              <option value="">-- 請選擇社團 --</option>
            </select>
            <div id="clubStatus" class="status-hint"></div>
          </div>

          <div id="studentList"></div>

          <button type="button" class="btn-add" id="addStudentBtn">➕ 新增一位學生</button>
          <button type="submit" class="btn-submit" id="submitBtn">確認送出</button>
          <div id="msg"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxcZ3ArmfZTfA5qX7VON9dMhH_cwm8RU16ySNtmFWq1CzGjNkpdyJSEp4-kJuLNFW2Ecg/exec';

    let activeActivities = [];
    let currentAct = null;

    async function callApi(payload) {
      const url = new URL(API_URL);
      
      if (payload.action === 'getAllActivities' || payload.action === 'getClubData') {
        url.searchParams.append('data', JSON.stringify(payload));
        const res = await fetch(url.toString(), {
          method: 'GET',
          redirect: 'follow'
        });
        const text = await res.text();
        try {
          return JSON.parse(text);
        } catch (e) {
          throw new Error("回傳格式非 JSON，請確認 Apps Script 部署權限是否設為「所有人 (Anyone)」");
        }
      }

      const params = new URLSearchParams();
      params.append('data', JSON.stringify(payload));

      const res = await fetch(API_URL, {
        method: 'POST',
        body: params,
        redirect: 'follow'
      });
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error("回傳格式非 JSON，請確認 Apps Script 部署權限是否設為「所有人 (Anyone)」");
      }
    }

    function parseNoticeFormat(text) {
      if (!text) return '';
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<span style="color:#dc2626; font-weight:bold;">$1</span>')
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" style="color:#2563eb; text-decoration:underline;">$1</a>')
        .replace(/\n/g, '<br>');
    }

    function generateClassOptions(selectedClass) {
      let options = '<option value="">請選擇班級</option>';
      if (currentAct && currentAct.classes) {
        currentAct.classes.forEach(c => {
          const isSelected = c === String(selectedClass) ? 'selected' : '';
          options += `<option value="${c}" ${isSelected}>${c}</option>`;
        });
      }
      return options;
    }

    function generatePeriodCheckboxes(selectedPeriods = []) {
      let html = '';
      if (currentAct && currentAct.periods) {
        currentAct.periods.forEach(p => {
          const isChecked = selectedPeriods.includes(p) ? 'checked' : '';
          html += `
            <label class="checkbox-item">
              <input type="checkbox" value="${p}" class="cb-period" ${isChecked}> ${p}
            </label>
          `;
        });
      }
      return html;
    }

    function reindexCards() {
      const cards = document.querySelectorAll('.student-card');
      cards.forEach((card, idx) => {
        const titleSpan = card.querySelector('.card-index-title');
        if (titleSpan) {
          titleSpan.innerText = `編號：${idx + 1}`;
        }
      });
    }

    function addStudentCard(data = {}) {
      const list = document.getElementById('studentList');
      const div = document.createElement('div');
      div.className = 'student-card';
      
      div.innerHTML = `
        <div class="card-header">
          <span class="card-index-title">編號：1</span>
          <button type="button" class="del-btn" onclick="removeCard(this)">刪除</button>
        </div>
        <div class="form-grid">
          <div>
            <label>班級</label>
            <select class="inp-class" required>
              ${generateClassOptions(data.className || '')}
            </select>
          </div>
          <div>
            <label>座號</label>
            <input type="number" class="inp-seat" value="${data.seatNumber || ''}" placeholder="座號" min="1" max="60" required>
          </div>
          <div>
            <label>姓名</label>
            <input type="text" class="inp-name" value="${data.name || ''}" placeholder="請輸入姓名" required>
          </div>
        </div>
        <div>
          <div class="periods-title">請公假時段（可複選）</div>
          <div class="checkbox-wrap">
            ${generatePeriodCheckboxes(data.periods || [])}
          </div>
        </div>
      `;
      list.appendChild(div);
      reindexCards();
    }

    function removeCard(btn) {
      const card = btn.closest('.student-card');
      if (card) {
        card.remove();
        if (document.querySelectorAll('.student-card').length === 0) {
          addStudentCard();
        } else {
          reindexCards();
        }
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await callApi({ action: 'getAllActivities', onlyActive: true });
        document.getElementById('loading').style.display = 'none';
        document.getElementById('appBody').style.display = 'block';

        if (res.success) {
          activeActivities = res.activities;
          const actSelect = document.getElementById('actSelect');
          actSelect.innerHTML = '<option value="">-- 請選擇活動 --</option>';
          if (activeActivities.length === 0) {
            actSelect.innerHTML = '<option value="">目前暫無開放中的活動</option>';
            return;
          }
          activeActivities.forEach(act => {
            const opt = document.createElement('option');
            opt.value = act.name;
            opt.textContent = act.name;
            actSelect.appendChild(opt);
          });
        } else {
          alert('載入失敗：' + res.message);
        }
      } catch (err) {
        document.getElementById('loading').innerText = '試算表連線失敗：' + err.message;
      }
    });

    document.getElementById('actSelect').addEventListener('change', function() {
      const actName = this.value;
      const noticeBox = document.getElementById('noticeBox');
      const timeInfo = document.getElementById('timeInfo');
      const leaveForm = document.getElementById('leaveForm');
      const clubSelect = document.getElementById('clubSelect');
      const msgDiv = document.getElementById('msg');
      const statusDiv = document.getElementById('clubStatus');

      msgDiv.innerText = '';
      statusDiv.innerText = '';

      if (!actName) {
        noticeBox.style.display = 'none';
        timeInfo.style.display = 'none';
        leaveForm.style.display = 'none';
        currentAct = null;
        return;
      }

      currentAct = activeActivities.find(a => a.name === actName);
      if (!currentAct) return;

      let timeText = '🕒 填寫期限：';
      if (currentAct.startTime && currentAct.endTime) {
        timeText += `${currentAct.startTime} ~ ${currentAct.endTime}`;
      } else if (currentAct.endTime) {
        timeText += `即日起至 ${currentAct.endTime}`;
      } else {
        timeText += `進行中（無特定截止限制）`;
      }
      timeInfo.innerText = timeText;
      timeInfo.style.display = 'inline-block';

      if (currentAct.notice) {
        noticeBox.innerHTML = parseNoticeFormat(currentAct.notice);
        noticeBox.style.display = 'block';
      } else {
        noticeBox.style.display = 'none';
      }

      clubSelect.innerHTML = '<option value="">-- 請選擇社團 --</option>';
      currentAct.clubs.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        clubSelect.appendChild(opt);
      });

      document.getElementById('studentList').innerHTML = '';
      addStudentCard();
      leaveForm.style.display = 'block';
    });

    document.getElementById('clubSelect').addEventListener('change', async function() {
      const clubName = this.value;
      const statusDiv = document.getElementById('clubStatus');
      const msgDiv = document.getElementById('msg');
      msgDiv.innerText = '';

      if (!clubName || !currentAct) {
        statusDiv.innerText = '';
        document.getElementById('studentList').innerHTML = '';
        addStudentCard();
        return;
      }

      statusDiv.style.color = '#2563eb';
      statusDiv.innerText = `⏳ 查詢「${clubName}」資料中...`;

      try {
        const res = await callApi({
          action: 'getClubData',
          activityName: currentAct.name,
          clubName: clubName,
          periods: currentAct.periods
        });

        if (res.success) {
          document.getElementById('studentList').innerHTML = '';
          if (res.students && res.students.length > 0) {
            res.students.forEach(s => addStudentCard(s));
            statusDiv.style.color = '#10b981';
            statusDiv.innerText = `✅ 共 ${res.students.length} 位。`;
          } else {
            addStudentCard();
            statusDiv.style.color = '#64748b';
            statusDiv.innerText = `📝 目前尚無資料。`;
          }
        }
      } catch (err) {
        statusDiv.style.color = '#ef4444';
        statusDiv.innerText = '連線錯誤：' + err.message;
      }
    });

    document.getElementById('leaveForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const msgDiv = document.getElementById('msg');
      const statusDiv = document.getElementById('clubStatus');
      const clubName = document.getElementById('clubSelect').value;
      
      const studentCards = document.querySelectorAll('.student-card');
      const students = [];
      let missingPeriod = false;

      studentCards.forEach(card => {
        const checkedPeriods = [];
        card.querySelectorAll('.cb-period:checked').forEach(cb => {
          checkedPeriods.push(cb.value);
        });

        if (checkedPeriods.length === 0) missingPeriod = true;

        students.push({
          className: card.querySelector('.inp-class').value,
          seatNumber: card.querySelector('.inp-seat').value.trim(),
          name: card.querySelector('.inp-name').value.trim(),
          periods: checkedPeriods
        });
      });

      if (missingPeriod) {
        msgDiv.style.color = '#ef4444';
        msgDiv.innerText = '請確保每位學生至少勾選了一個公假時段！';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = '資料更新中...';
      msgDiv.innerText = '';

      try {
        const res = await callApi({
          action: 'updateBatchLeaveData',
          activityName: currentAct.name,
          club: clubName,
          students: students,
          periods: currentAct.periods
        });

        if (res.success) {
          msgDiv.style.color = '#10b981';
          msgDiv.innerText = `✅ 登記成功！共 ${res.count} 位。`;
          statusDiv.style.color = '#10b981';
          statusDiv.innerText = `✅ 共 ${res.count} 位。`;
        } else {
          msgDiv.style.color = '#ef4444';
          msgDiv.innerText = '❌ ' + res.message;
        }
      } catch (err) {
        msgDiv.style.color = '#ef4444';
        msgDiv.innerText = '連線錯誤：' + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '確認送出';
      }
    });

    document.getElementById('addStudentBtn').addEventListener('click', () => addStudentCard());
  </script>
</body>
</html>
