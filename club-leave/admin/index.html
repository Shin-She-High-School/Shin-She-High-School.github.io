<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>公假系統 - 多活動管理後台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 16px;
      color: #1e293b;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    h2 {
      margin-top: 0;
      color: #92400e;
      text-align: center;
    }
    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn-new {
      background: #d97706;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-new:hover { background: #b45309; }
    .activity-card {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .act-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .act-title {
      font-size: 16px;
      font-weight: bold;
      color: #78350f;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 6px;
    }
    .badge-open { background: #dcfce7; color: #166534; }
    .badge-closed { background: #fee2e2; color: #991b1b; }
    .badge-wait { background: #e0f2fe; color: #075985; }
    .card-btns {
      display: flex;
      gap: 6px;
    }
    .btn-action {
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      gap: 4px;
    }
    .btn-open-sheet { background: #dbeafe; color: #1d4ed8; }
    .btn-open-sheet:hover { background: #bfdbfe; }
    .btn-edit { background: #e2e8f0; color: #334155; }
    .btn-edit:hover { background: #cbd5e1; }
    .btn-del { background: #fee2e2; color: #991b1b; }
    .btn-del:hover { background: #fecaca; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 99;
    }
    .modal-content {
      background: white;
      border-radius: 12px;
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #475569; }
    input[type="text"], input[type="datetime-local"], textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    textarea { height: 140px; resize: vertical; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: #f1f5f9;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
    }
    .btn-tool {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-tool:hover { background: #e2e8f0; }
    .textarea-with-toolbar { border-radius: 0 0 6px 6px !important; }

    .btn-save {
      background: #d97706;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-cancel {
      background: #e2e8f0;
      color: #475569;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    @media (max-width: 600px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>⚙️ 公假登記系統 - 多活動管理後台</h2>

    <div class="top-actions">
      <span style="font-size: 14px; color: #64748b;">可直接點擊「開啟工作表」跳轉至試算表分頁、修改活動名稱或刪除活動。</span>
      <button class="btn-new" onclick="openEditor()">➕ 新增活動</button>
    </div>

    <div id="actList">載入中...</div>
  </div>

  <div id="editorModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-top:0; color:#92400e;">新增活動</h3>
      <input type="hidden" id="actOriginalName" value="">
      
      <div class="form-group">
        <label>
          活動名稱（同步對應試算表之工作表名稱）
          <span style="font-size:12px; color:#d97706; font-weight:normal;">✏️ 修改後將自動連動更新工作表名稱</span>
        </label>
        <input type="text" id="actName" placeholder="例如：115學年度社團招生公假" required>
      </div>

      <div class="form-group">
        <label style="display:flex; align-items:center; cursor:pointer;">
          <input type="checkbox" id="actIsEnabled" style="margin-right:8px; width:16px; height:16px;" checked>
          總開關（勾選啟用開放前台）
        </label>
      </div>

      <div class="grid-2 form-group">
        <div>
          <label>填寫開始時間（留空代表立即開放）</label>
          <input type="datetime-local" id="actStartTime">
        </div>
        <div>
          <label>填寫截止時間（留空代表不限時間）</label>
          <input type="datetime-local" id="actEndTime">
        </div>
      </div>

      <div class="form-group">
        <label>公告說明事項（選取文字後點按鈕套用格式）</label>
        <div class="toolbar">
          <button type="button" class="btn-tool" onclick="applyFormat('bold')"><b>B</b> 粗體</button>
          <button type="button" class="btn-tool" onclick="applyFormat('red')" style="color:#dc2626;">🔴 紅字警告</button>
          <button type="button" class="btn-tool" onclick="applyFormat('link')">🔗 插入超連結</button>
          <button type="button" class="btn-tool" onclick="applyFormat('bullet')">• 項目清單</button>
        </div>
        <textarea id="actNotice" class="textarea-with-toolbar" style="height:80px;" placeholder="填寫注意事項..."></textarea>
      </div>

      <div class="grid-3">
        <div class="form-group">
          <label>社團清單（一行一個）</label>
          <textarea id="actClubs" placeholder="學生會&#10;籃球訓練社&#10;熱音社"></textarea>
        </div>
        <div class="form-group">
          <label>班級清單（一行一個）</label>
          <textarea id="actClasses" placeholder="101&#10;102"></textarea>
        </div>
        <div class="form-group">
          <label>請假時段清單（一行一個）</label>
          <textarea id="actPeriods" placeholder="9/8午休&#10;9/9第五節"></textarea>
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
        <button type="button" class="btn-cancel" onclick="closeEditor()">取消</button>
        <button type="button" class="btn-save" id="saveActBtn" onclick="saveActData()">儲存活動與工作表</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxcZ3ArmfZTfA5qX7VON9dMhH_cwm8RU16ySNtmFWq1CzGjNkpdyJSEp4-kJuLNFW2Ecg/exec';

    let allActivities = [];

    async function callApi(payload) {
      const params = new URLSearchParams();
      params.append('data', JSON.stringify(payload));

      const res = await fetch(API_URL, {
        method: 'POST',
        body: params
      });
      return await res.json();
    }

    function applyFormat(type) {
      const textarea = document.getElementById('actNotice');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selectedText = textarea.value.substring(start, end);
      let replacement = '';

      switch (type) {
        case 'bold':
          replacement = `**${selectedText || '粗體文字'}**`;
          break;
        case 'red':
          replacement = `*${selectedText || '警告文字'}*`;
          break;
        case 'link':
          const url = prompt('請輸入超連結網址：', 'https://');
          if (url) replacement = `[${selectedText || '連結文字'}](${url})`;
          else return;
          break;
        case 'bullet':
          replacement = `• ${selectedText || '清單項目'}`;
          break;
      }
      textarea.setRangeText(replacement, start, end, 'select');
      textarea.focus();
    }

    function formatToInputDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function formatFromInputDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    async function loadList() {
      document.getElementById('actList').innerHTML = '載入活動中...';
      try {
        const res = await callApi({ action: 'getAllActivities', onlyActive: false });
        if (res.success) {
          allActivities = res.activities;
          renderList();
        } else {
          document.getElementById('actList').innerText = '載入失敗：' + res.message;
        }
      } catch (err) {
        document.getElementById('actList').innerText = '無法連線至 API：' + err.message;
      }
    }

    function renderList() {
      const container = document.getElementById('actList');
      if (allActivities.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">目前尚無任何活動，請點擊上方按鈕新增！</div>';
        return;
      }

      let html = '';
      allActivities.forEach((act, idx) => {
        let badgeClass = 'badge-closed';
        if (act.statusText === '開放中') badgeClass = 'badge-open';
        else if (act.statusText === '尚未開始') badgeClass = 'badge-wait';

        const timeStr = (act.startTime || act.endTime) 
          ? `🕒 期限：${act.startTime || '即日起'} 至 ${act.endTime || '無限期'}`
          : '🕒 期限：無限期';

        html += `
          <div class="activity-card">
            <div class="act-header">
              <div>
                <span class="act-title">${act.name}</span>
                <span class="badge ${badgeClass}">${act.statusText}</span>
              </div>
              <div class="card-btns">
                <a class="btn-action btn-open-sheet" href="${act.sheetUrl || '#'}" target="_blank">📊 開啟工作表</a>
                <button class="btn-action btn-edit" onclick="editAct(${idx})">✏️ 編輯 / 改名</button>
                <button class="btn-action btn-del" onclick="deleteAct('${encodeURIComponent(act.name)}')">🗑️ 刪除</button>
              </div>
            </div>
            <div style="font-size: 13px; color: #64748b; line-height: 1.6;">
              <div>${timeStr}</div>
              <div><strong>時段數：</strong>${act.periods.length} 個 | <strong>社團數：</strong>${act.clubs.length} 個 | <strong>班級數：</strong>${act.classes.length} 班</div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function openEditor() {
      document.getElementById('modalTitle').innerText = '新增活動';
      document.getElementById('actOriginalName').value = '';
      document.getElementById('actName').value = '';
      document.getElementById('actIsEnabled').checked = true;
      document.getElementById('actStartTime').value = '';
      document.getElementById('actEndTime').value = '';
      document.getElementById('actNotice').value = '';
      document.getElementById('actClubs').value = '';
      document.getElementById('actClasses').value = '';
      document.getElementById('actPeriods').value = '';
      document.getElementById('editorModal').style.display = 'flex';
    }

    function editAct(idx) {
      const act = allActivities[idx];
      document.getElementById('modalTitle').innerText = '編輯活動與工作表設定';
      document.getElementById('actOriginalName').value = act.name;
      document.getElementById('actName').value = act.name;
      document.getElementById('actIsEnabled').checked = act.isEnabled;
      document.getElementById('actStartTime').value = formatToInputDate(act.startTime);
      document.getElementById('actEndTime').value = formatToInputDate(act.endTime);
      document.getElementById('actNotice').value = act.notice;
      document.getElementById('actClubs').value = act.clubs.join('\n');
      document.getElementById('actClasses').value = act.classes.join('\n');
      document.getElementById('actPeriods').value = act.periods.join('\n');
      document.getElementById('editorModal').style.display = 'flex';
    }

    function closeEditor() {
      document.getElementById('editorModal').style.display = 'none';
    }

    async function saveActData() {
      const actName = document.getElementById('actName').value.trim();
      const oldName = document.getElementById('actOriginalName').value.trim();

      if (!actName) {
        alert('活動名稱不能為空！');
        return;
      }

      if (oldName && oldName !== actName) {
        const confirmRename = confirm(`確定要將活動「${oldName}」更名為「${actName}」嗎？\n這將同步更新 Google 試算表中對應的工作表分頁名稱。`);
        if (!confirmRename) return;
      }

      const saveBtn = document.getElementById('saveActBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = '儲存與同步工作表中...';

      const data = {
        originalName: oldName,
        name: actName,
        isEnabled: document.getElementById('actIsEnabled').checked,
        startTime: formatFromInputDate(document.getElementById('actStartTime').value),
        endTime: formatFromInputDate(document.getElementById('actEndTime').value),
        notice: document.getElementById('actNotice').value.trim(),
        clubs: document.getElementById('actClubs').value.split('\n').map(s => s.trim()).filter(Boolean),
        classes: document.getElementById('actClasses').value.split('\n').map(s => s.trim()).filter(Boolean),
        periods: document.getElementById('actPeriods').value.split('\n').map(s => s.trim()).filter(Boolean)
      };

      try {
        const res = await callApi({ action: 'saveActivity', activity: data });
        if (res.success) {
          closeEditor();
          loadList();
        } else {
          alert('儲存失敗：' + res.message);
        }
      } catch (err) {
        alert('連線失敗：' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = '儲存活動與工作表';
      }
    }

    async function deleteAct(encodedActName) {
      const actName = decodeURIComponent(encodedActName);
      const confirm1 = confirm(`確定要刪除活動「${actName}」嗎？`);
      if (!confirm1) return;

      const deleteSheet = confirm(`是否同時刪除 Google 試算表內名稱為「${actName}」的工作表分頁與既有紀錄？\n\n【確定】：連同分頁一併刪除。\n【取消】：僅從系統中移除活動，保留試算表分頁。`);

      try {
        const res = await callApi({
          action: 'deleteActivity',
          activityName: actName,
          deleteDataSheet: deleteSheet
        });

        if (res.success) {
          alert('活動已成功刪除！');
          loadList();
        } else {
          alert('刪除失敗：' + res.message);
        }
      } catch (err) {
        alert('連線失敗：' + err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', loadList);
  </script>
</body>
</html>
