<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>新社高中公假系統-管理後台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --amber-main: #d97706;
      --amber-hover: #b45309;
      --amber-subtle: #fffbeb;
      --amber-border: #fde68a;
      --slate-main: #0f172a;
      --slate-muted: #64748b;
      --border-subtle: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      min-height: 100vh;
      margin: 0;
      padding: 36px 16px 80px 16px;
      color: var(--slate-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      background: #ffffff;
      padding: 36px 32px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
    }
    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #f59e0b, #d97706);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #92400e;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f1f5f9;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn-new {
      background: linear-gradient(135deg, var(--amber-main) 0%, var(--amber-hover) 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.25);
      transition: all 0.2s ease;
    }
    .btn-new:hover {
      background: linear-gradient(135deg, var(--amber-hover) 0%, #92400e 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(217, 119, 6, 0.35);
    }
    .activity-card {
      background: #ffffff;
      border: 1.5px solid var(--amber-border);
      border-left: 5px solid var(--amber-main);
      border-radius: var(--radius-md);
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .activity-card:hover {
      box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.08);
      transform: translateY(-1px);
    }
    .act-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .act-title {
      font-size: 17px;
      font-weight: 800;
      color: #78350f;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 8px;
    }
    .badge-open { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .badge-closed { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .badge-wait { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .card-btns {
      display: flex;
      gap: 8px;
    }
    .btn-action {
      border: none;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .btn-open-sheet {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .btn-open-sheet:hover { background: #dbeafe; }
    .btn-edit {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-edit:hover { background: #f1f5f9; }
    .btn-del {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .btn-del:hover { background: #fee2e2; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 999;
      animation: modalFade 0.2s ease-out;
    }
    @keyframes modalFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-content {
      background: white;
      border-radius: var(--radius-lg);
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #475569;
    }
    input[type="text"], input[type="datetime-local"], textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--slate-main);
      font-family: inherit;
      transition: all 0.15s ease;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--amber-main);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    textarea { height: 130px; resize: vertical; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: #f8fafc;
      padding: 8px 10px;
      border: 1.5px solid #cbd5e1;
      border-bottom: none;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    }
    .btn-tool {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      color: #334155;
      transition: background 0.15s ease;
    }
    .btn-tool:hover { background: #e2e8f0; }
    .textarea-with-toolbar { border-radius: 0 0 var(--radius-sm) var(--radius-sm) !important; }

    .btn-save {
      background: linear-gradient(135deg, var(--amber-main) 0%, var(--amber-hover) 100%);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-save:hover {
      background: linear-gradient(135deg, var(--amber-hover) 0%, #92400e 100%);
    }
    .btn-cancel {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-cancel:hover { background: #e2e8f0; }
    @media (max-width: 600px) {
      .container { padding: 24px 16px; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>⚙️ 新社高中公假登記系統-管理後台</h2>

    <div class="top-actions">
      <span style="font-size: 14px; color: #64748b;">點擊「開啟工作表」跳轉至工作表頁面。</span>
      <button class="btn-new" onclick="openEditor()">➕ 新增活動</button>
    </div>

    <div id="actList" style="text-align:center; padding:36px; color:#64748b; font-weight:600;">資料讀取中...</div>
  </div>

  <div id="editorModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-top:0; color:#92400e; font-size:18px; font-weight:800;">新增</h3>
      <input type="hidden" id="actOriginalName" value="">
      
      <div class="form-group" style="margin-top:16px;">
        <label>
          活動名稱
          <span style="font-size:12px; color:#d97706; font-weight:normal;">✏️ 同步修改工作表名稱</span>
        </label>
        <input type="text" id="actName" placeholder="例如：115學年度社團招生公假" required>
      </div>

      <div class="form-group">
        <label style="display:flex; align-items:center; cursor:pointer; font-weight:600;">
          <input type="checkbox" id="actIsEnabled" style="margin-right:8px; width:16px; height:16px; accent-color:#d97706;" checked>
          活動總開關
        </label>
      </div>

      <div class="grid-2 form-group">
        <div>
          <label>填寫開始時間（留空代表立即開放）</label>
          <input type="datetime-local" id="actStartTime">
        </div>
        <div>
          <label>填寫截止時間（留空代表不限時間）</label>
          <input type="datetime-local" id="actEndTime">
        </div>
      </div>

      <div class="form-group">
        <label>公告說明事項（選取文字後點按鈕套用格式）</label>
        <div class="toolbar">
          <button type="button" class="btn-tool" onclick="applyFormat('bold')"><b>B</b> 粗體</button>
          <button type="button" class="btn-tool" onclick="applyFormat('red')" style="color:#dc2626;">🔴 紅字警告</button>
          <button type="button" class="btn-tool" onclick="applyFormat('link')">🔗 插入超連結</button>
          <button type="button" class="btn-tool" onclick="applyFormat('bullet')">• 項目清單</button>
        </div>
        <textarea id="actNotice" class="textarea-with-toolbar" style="height:80px;" placeholder="填寫注意事項..."></textarea>
      </div>

      <div class="grid-3">
        <div class="form-group">
          <label>社團清單（一行一個）</label>
          <textarea id="actClubs" placeholder="學生會&#10;籃球訓練社&#10;熱音社"></textarea>
        </div>
        <div class="form-group">
          <label>班級清單（一行一個）</label>
          <textarea id="actClasses" placeholder="101&#10;102"></textarea>
        </div>
        <div class="form-group">
          <label>公假時段清單（一行一個）</label>
          <textarea id="actPeriods" placeholder="9/8午休&#10;9/9第五節"></textarea>
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid #f1f5f9;">
        <button type="button" class="btn-cancel" onclick="closeEditor()">取消</button>
        <button type="button" class="btn-save" id="saveActBtn" onclick="saveActData()">儲存</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxcZ3ArmfZTfA5qX7VON9dMhH_cwm8RU16ySNtmFWq1CzGjNkpdyJSEp4-kJuLNFW2Ecg/exec';

    let allActivities = [];

    async function callApi(payload) {
      const url = new URL(API_URL);
      
      if (payload.action === 'getAllActivities' || payload.action === 'getClubData') {
        url.searchParams.append('data', JSON.stringify(payload));
        const res = await fetch(url.toString(), {
          method: 'GET',
          redirect: 'follow'
        });
        const text = await res.text();
        try {
          return JSON.parse(text);
        } catch (e) {
          throw new Error("回傳格式非 JSON，請確認 Apps Script 部署權限是否設為「所有人 (Anyone)」");
        }
      }

      const params = new URLSearchParams();
      params.append('data', JSON.stringify(payload));

      const res = await fetch(API_URL, {
        method: 'POST',
        body: params,
        redirect: 'follow'
      });
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error("回傳格式非 JSON，請確認 Apps Script 部署權限是否設為「所有人 (Anyone)」");
      }
    }

    function applyFormat(type) {
      const textarea = document.getElementById('actNotice');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selectedText = textarea.value.substring(start, end);
      let replacement = '';

      switch (type) {
        case 'bold':
          replacement = `**${selectedText || '粗體文字'}**`;
          break;
        case 'red':
          replacement = `*${selectedText || '警告文字'}*`;
          break;
        case 'link':
          const url = prompt('請輸入超連結網址：', 'https://');
          if (url) replacement = `[${selectedText || '連結文字'}](${url})`;
          else return;
          break;
        case 'bullet':
          replacement = `• ${selectedText || '清單項目'}`;
          break;
      }
      textarea.setRangeText(replacement, start, end, 'select');
      textarea.focus();
    }

    function formatToInputDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function formatFromInputDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    async function loadList() {
      document.getElementById('actList').innerHTML = '資料讀取中...';
      try {
        const res = await callApi({ action: 'getAllActivities', onlyActive: false });
        if (res.success) {
          allActivities = res.activities;
          renderList();
        } else {
          document.getElementById('actList').innerText = '載入失敗：' + res.message;
        }
      } catch (err) {
        document.getElementById('actList').innerText = '無法連線至試算表：' + err.message;
      }
    }

    function renderList() {
      const container = document.getElementById('actList');
      if (allActivities.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">目前尚無任何活動，請點擊上方按鈕新增！</div>';
        return;
      }

      let html = '';
      allActivities.forEach((act, idx) => {
        let badgeClass = 'badge-closed';
        if (act.statusText === '開放中') badgeClass = 'badge-open';
        else if (act.statusText === '尚未開始') badgeClass = 'badge-wait';

        const timeStr = (act.startTime || act.endTime) 
          ? `🕒 期限：${act.startTime || '即日起'} 至 ${act.endTime || '無限期'}`
          : '🕒 期限：無限期';

        html += `
          <div class="activity-card">
            <div class="act-header">
              <div>
                <span class="act-title">${act.name}</span>
                <span class="badge ${badgeClass}">${act.statusText}</span>
              </div>
              <div class="card-btns">
                <a class="btn-action btn-open-sheet" href="${act.sheetUrl || '#'}" target="_blank">📊 開啟工作表</a>
                <button class="btn-action btn-edit" onclick="editAct(${idx})">✏️ 編輯</button>
                <button class="btn-action btn-del" onclick="deleteAct('${encodeURIComponent(act.name)}')">🗑️ 刪除</button>
              </div>
            </div>
            <div style="font-size: 13px; color: #64748b; line-height: 1.6;">
              <div>${timeStr}</div>
              <div><strong>時段數：</strong>${act.periods.length} 個 | <strong>社團數：</strong>${act.clubs.length} 個 | <strong>班級數：</strong>${act.classes.length} 班</div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function openEditor() {
      document.getElementById('modalTitle').innerText = '新增';
      document.getElementById('actOriginalName').value = '';
      document.getElementById('actName').value = '';
      document.getElementById('actIsEnabled').checked = true;
      document.getElementById('actStartTime').value = '';
      document.getElementById('actEndTime').value = '';
      document.getElementById('actNotice').value = '';
      document.getElementById('actClubs').value = '';
      document.getElementById('actClasses').value = '';
      document.getElementById('actPeriods').value = '';
      document.getElementById('editorModal').style.display = 'flex';
    }

    function editAct(idx) {
      const act = allActivities[idx];
      document.getElementById('modalTitle').innerText = '編輯';
      document.getElementById('actOriginalName').value = act.name;
      document.getElementById('actName').value = act.name;
      document.getElementById('actIsEnabled').checked = act.isEnabled;
      document.getElementById('actStartTime').value = formatToInputDate(act.startTime);
      document.getElementById('actEndTime').value = formatToInputDate(act.endTime);
      document.getElementById('actNotice').value = act.notice;
      document.getElementById('actClubs').value = act.clubs.join('\n');
      document.getElementById('actClasses').value = act.classes.join('\n');
      document.getElementById('actPeriods').value = act.periods.join('\n');
      document.getElementById('editorModal').style.display = 'flex';
    }

    function closeEditor() {
      document.getElementById('editorModal').style.display = 'none';
    }

    async function saveActData() {
      const actName = document.getElementById('actName').value.trim();
      const oldName = document.getElementById('actOriginalName').value.trim();

      if (!actName) {
        alert('活動名稱不能為空！');
        return;
      }

      if (oldName && oldName !== actName) {
        const confirmRename = confirm(`確定要將活動「${oldName}」更名為「${actName}」嗎？\n這將同步更新工作表名稱。`);
        if (!confirmRename) return;
      }

      const saveBtn = document.getElementById('saveActBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = '儲存中...';

      const data = {
        originalName: oldName,
        name: actName,
        isEnabled: document.getElementById('actIsEnabled').checked,
        startTime: formatFromInputDate(document.getElementById('actStartTime').value),
        endTime: formatFromInputDate(document.getElementById('actEndTime').value),
        notice: document.getElementById('actNotice').value.trim(),
        clubs: document.getElementById('actClubs').value.split('\n').map(s => s.trim()).filter(Boolean),
        classes: document.getElementById('actClasses').value.split('\n').map(s => s.trim()).filter(Boolean),
        periods: document.getElementById('actPeriods').value.split('\n').map(s => s.trim()).filter(Boolean)
      };

      try {
        const res = await callApi({ action: 'saveActivity', activity: data });
        if (res.success) {
          closeEditor();
          loadList();
        } else {
          alert('儲存失敗：' + res.message);
        }
      } catch (err) {
        alert('連線失敗：' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = '儲存成功';
      }
    }

    async function deleteAct(encodedActName) {
      const actName = decodeURIComponent(encodedActName);
      const confirm1 = confirm(`確定要刪除活動「${actName}」嗎？`);
      if (!confirm1) return;

      const deleteSheet = confirm(`是否刪除試算表為「${actName}」的紀錄？\n\n【確定】：一併刪除。\n【取消】：僅從系統中移除活動，保留試算表分頁。`);

      try {
        const res = await callApi({
          action: 'deleteActivity',
          activityName: actName,
          deleteDataSheet: deleteSheet
        });

        if (res.success) {
          alert('刪除成功！');
          loadList();
        } else {
          alert('刪除失敗：' + res.message);
        }
      } catch (err) {
        alert('連線失敗：' + err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', loadList);
  </script>
</body>
</html>
