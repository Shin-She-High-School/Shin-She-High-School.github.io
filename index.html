<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新社高中校園系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .header {
            background: linear-gradient(135deg, #052e16 0%, #065f46 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
        .header p {
            margin: 8px 0 0 0;
            font-size: 0.85rem;
            opacity: 0.85;
            font-weight: 500;
        }
        .system-list {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .system-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            text-decoration: none;
            color: #1e293b;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .system-card:hover {
            border-color: #059669;
            background-color: #f0fdf4;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.08);
            color: #065f46;
        }
        .system-card span {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .system-card .icon {
            font-size: 1.2rem;
        }
        .system-card .arrow {
            color: #94a3b8;
            font-size: 0.9rem;
            transition: transform 0.2s ease;
        }
        .system-card:hover .arrow {
            color: #059669;
            transform: translateX(3px);
        }
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>新社高中校園系統</h1>
        </div>
        <div class="system-list">
            <a href="https://shin-she-high-school.github.io/club-leave/" target="_blank" class="system-card">
                <span><span class="icon">📋</span> 社團請假系統</span>
                <span class="arrow">➔</span>
            </a>
            <a href="https://shin-she-high-school.github.io/club-leave/admin/" target="_blank" class="system-card">
                <span><span class="icon">⚙️</span> 社團請假系統管理後台</span>
                <span class="arrow">➔</span>
            </a>
            <a href="https://shin-she-high-school.github.io/freshman-camp/LandQuestRunTrack/" target="_blank" class="system-card">
                <span><span class="icon">⛺</span> 新生卓越成長營大地遊戲系統</span>
                <span class="arrow">➔</span>
            </a>
            <a href="https://shin-she-high-school.github.io/freshman-camp/upload/" target="_blank" class="system-card">
                <span><span class="icon">📸</span> 新生卓越成長營照片上傳系統</span>
                <span class="arrow">➔</span>
            </a>
            <a href="https://shin-she-high-school.github.io/graduation-check/" target="_blank" class="system-card">
                <span><span class="icon">🎓</span> 畢業自我檢核系統</span>
                <span class="arrow">➔</span>
            </a>
            <a href="https://shin-she-high-school.github.io/merit-flow/" target="_blank" class="system-card">
                <span><span class="icon">⚖️</span> 獎懲系統</span>
                <span class="arrow">➔</span>
            </a>
        </div>
        <div class="footer">
            &copy; Shin-She High School. All rights reserved.
        </div>
    </div>

</body>
</html>
