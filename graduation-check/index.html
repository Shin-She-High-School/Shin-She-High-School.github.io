<!-- 獨立頁面：系統公告管理 (管理員專用) -->
<div id="pageAnnounceMgmtView" class="hidden pb-12">
    <!-- 頂部導覽 -->
    <div class="flex items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-200 flex-wrap">
        <div class="flex items-center gap-3">
            <button type="button" class="btn-table-action bg-slate-700 text-white rounded-lg hover:bg-slate-800 transition" onclick="closeIndependentPage()" title="返回上一頁">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </button>
            <div>
                <h2 class="text-xl sm:text-2xl font-black text-slate-900 flex items-center gap-2">
                    <span>📢 系統公告發布與管理</span>
                </h2>
                <p class="text-xs text-slate-500 font-bold mt-0.5">即時發布校園檢核通知、維護公告與重要資訊，支援頂部跑馬燈連動與預約排程</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button type="button" class="px-4 py-2 text-xs font-black rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 transition" onclick="closeIndependentPage()">
                返回控制台
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <!-- 左側/上方：公告編輯/發布表單卡片 -->
        <div class="lg:col-span-5 xl:col-span-4 sticky top-4">
            <div id="announceFormCard" class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm transition-all duration-300">
                <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
                    <h3 class="text-base font-black text-slate-800 flex items-center gap-2">
                        <span id="announceFormIcon">✨</span>
                        <span id="announceFormTitle">發布新公告</span>
                    </h3>
                    <button type="button" id="cancelAnnounceEditBtn" style="display:none;" onclick="cancelAnnounceEdit()" class="text-xs text-rose-500 hover:text-rose-700 font-extrabold transition">
                        ✕ 取消編輯
                    </button>
                </div>

                <input type="hidden" id="editingAnnounceId" value="">

                <div class="space-y-4">
                    <div class="input-group mb-0">
                        <label class="text-xs font-black text-slate-700 mb-1">公告標題 <span class="text-rose-500">*</span></label>
                        <input type="text" id="newAnnounceTitle" class="w-full text-xs font-bold" placeholder="例如：113學年度第一學期學分檢核開放通知" maxlength="80">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="input-group mb-0">
                            <label class="text-xs font-black text-slate-700 mb-1">分類標籤</label>
                            <select id="newAnnounceCategory" class="w-full text-xs font-bold bg-white">
                                <option value="大會公告">🎓 大會公告</option>
                                <option value="系統維護">🛠️ 系統維護</option>
                                <option value="教務通知">📋 教務通知</option>
                                <option value="重要提醒">⚠️ 重要提醒</option>
                            </select>
                        </div>
                        <div class="input-group mb-0">
                            <label class="text-xs font-black text-slate-700 mb-1">發布時間 (選填)</label>
                            <input type="datetime-local" id="newAnnouncePublishedAt" class="w-full text-xs font-bold">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="input-group mb-0">
                            <label class="text-xs font-black text-slate-700 mb-1">展示開始時間</label>
                            <input type="datetime-local" id="newAnnounceStartAt" class="w-full text-xs font-bold">
                        </div>
                        <div class="input-group mb-0">
                            <label class="text-xs font-black text-slate-700 mb-1">展示結束時間</label>
                            <input type="datetime-local" id="newAnnounceEndAt" class="w-full text-xs font-bold">
                        </div>
                    </div>

                    <div class="input-group mb-0">
                        <label class="text-xs font-black text-slate-700 mb-1">公告詳細內容 <span class="text-rose-500">*</span></label>
                        <textarea id="newAnnounceContent" rows="4" class="w-full text-xs font-semibold leading-relaxed" placeholder="請輸入詳細公告說明內容..."></textarea>
                    </div>

                    <!-- 選項勾選組 -->
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                        <label class="flex items-center gap-2 cursor-pointer text-xs font-extrabold text-slate-700">
                            <input type="checkbox" id="newAnnounceMarquee" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4" checked>
                            <span>📢 同步展示於首頁跑馬燈</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-xs font-extrabold text-slate-700">
                            <input type="checkbox" id="newAnnounceActive" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4" checked>
                            <span>● 立即設為公開發布狀態</span>
                        </label>
                    </div>

                    <button type="button" id="submitAnnounceBtn" onclick="submitNewAnnouncement()" class="w-full py-3 rounded-xl font-extrabold text-white text-sm bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 shadow-md transition-all">
                        確認發布公告
                    </button>
                </div>
            </div>
        </div>

        <!-- 右側/下方：既有公告管理列表 -->
        <div class="lg:col-span-7 xl:col-span-8 space-y-4">
            <!-- 列表工具列 (搜尋 + 狀態篩選 + 計數) -->
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex items-center justify-between gap-3 flex-wrap">
                <div class="flex items-center gap-2 flex-1 min-w-[200px]">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs pl-1"></i>
                    <input type="text" id="announceSearchInput" oninput="renderAdminAnnounceList()" placeholder="搜尋標題或內容關鍵字..." class="w-full text-xs font-bold border-none outline-none focus:ring-0 p-1">
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <select id="announceStatusFilter" onchange="renderAdminAnnounceList()" class="sort-select text-xs font-bold py-1.5 px-3 bg-slate-50 border border-slate-200 rounded-lg">
                        <option value="all">所有狀態</option>
                        <option value="active">● 公開中</option>
                        <option value="scheduled">⏳ 預約中 / 未開始</option>
                        <option value="expired">⌛ 已過期</option>
                        <option value="inactive">○ 已下架</option>
                    </select>
                    <span id="announceCountText" class="text-xs font-black text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg">共 0 筆紀錄</span>
                </div>
            </div>

            <!-- 公告卡片容器 -->
            <div id="adminAnnounceList" class="space-y-3">
                <!-- 動態注入公告列表項目 -->
            </div>
        </div>
    </div>
</div>
