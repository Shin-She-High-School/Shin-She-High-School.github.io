<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>直屬夥伴查詢系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col justify-between font-sans">

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl text-white font-extrabold text-sm shadow-xl hidden transition-all duration-300"></div>

    <header class="bg-[#0f172a] text-white py-4 px-4 shadow-md">
        <div class="max-w-xl mx-auto flex items-center justify-center gap-2.5">
            <span class="text-2xl">🤝</span>
            <span class="text-lg font-black tracking-wide">校園直屬夥伴查詢</span>
        </div>
    </header>

    <main class="flex-1 max-w-xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">
        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
            <div class="text-center space-y-1">
                <h2 class="text-2xl font-black text-slate-900">🔍 查詢我的直屬</h2>
                <p class="text-xs text-slate-400 font-bold">高一、高二同學輸入學號即可查詢對應之直屬夥伴</p>
            </div>

            <form onsubmit="handleQueryStudent(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-black text-slate-700 mb-1.5">學生學號</label>
                    <input type="text" id="queryStudentNo" required placeholder="請輸入學號 (如: 41001 或 31001)" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <button type="submit" id="btnQuery" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl text-sm transition shadow-md shadow-blue-600/30">
                    立即查詢
                </button>
            </form>

            <div id="queryResultArea" class="hidden pt-5 border-t border-slate-100 space-y-4">
                <div class="p-4 rounded-2xl bg-blue-50/70 border border-blue-200 space-y-1 text-xs">
                    <span class="text-blue-600 font-black" id="querySelfRoleTag">查詢本人</span>
                    <div class="text-lg font-black text-slate-900" id="querySelfName">-</div>
                    <div class="text-slate-500 font-bold" id="querySelfInfo">-</div>
                </div>

                <div class="text-center text-xl font-black text-blue-600 my-1">↕ 直屬配對 ↕</div>

                <div class="p-4 rounded-2xl bg-emerald-50/70 border border-emerald-200 space-y-1 text-xs">
                    <span class="text-emerald-700 font-black" id="queryTargetRoleTag">直屬學長姐 / 學弟妹</span>
                    <div class="text-lg font-black text-slate-900" id="queryTargetName">-</div>
                    <div class="text-slate-500 font-bold" id="queryTargetInfo">-</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-400 font-semibold border-t border-slate-200/60">
        © 校園抽直屬系統 ． 學生查詢服務
    </footer>

    <script>
        const SUPABASE_URL = "https://qpqtiavufscdfwhabnod.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ehTz6hW_jpdiO7Ht3Xq-yw_UoRl7F6M";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.innerText = msg;
            t.className = `fixed top-5 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl text-white font-extrabold text-sm shadow-xl transition-all duration-300 ${isError ? 'bg-rose-500' : 'bg-emerald-600'}`;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2600);
        }

        async function handleQueryStudent(e) {
            e.preventDefault();
            const sid = document.getElementById('queryStudentNo').value.trim();
            if (!sid) return;

            const btn = document.getElementById('btnQuery');
            btn.disabled = true;
            btn.innerText = "查詢中...";

            try {
                const { data: selfStudent, error: selfErr } = await client
                    .from('students')
                    .select('*')
                    .eq('student_no', sid)
                    .maybeSingle();

                if (selfErr || !selfStudent) {
                    showToast("查無此學號之學生資料，請確認輸入是否正確！", true);
                    return;
                }

                const resArea = document.getElementById('queryResultArea');
                resArea.classList.remove('hidden');

                const isG1 = selfStudent.grade === 'G1';
                document.getElementById('querySelfRoleTag').innerText = isG1 ? "查詢本人 (高一學弟妹)" : "查詢本人 (高二學長姐)";
                document.getElementById('querySelfName').innerText = selfStudent.name;
                document.getElementById('querySelfInfo').innerText = `${selfStudent.class_name} 班 ｜ 座號 ${selfStudent.seat_no || '-'} ｜ 學號 ${selfStudent.student_no}`;

                const queryColumn = isG1 ? 'g1_student_no' : 'g2_student_no';
                const { data: pairData, error: pairErr } = await client
                    .from('pairings')
                    .select('*')
                    .eq(queryColumn, sid)
                    .maybeSingle();

                if (pairErr || !pairData) {
                    document.getElementById('queryTargetRoleTag').innerText = isG1 ? "直屬學長姐" : "直屬學弟妹";
                    document.getElementById('queryTargetName').innerText = "尚未完成配對";
                    document.getElementById('queryTargetInfo').innerText = "請靜候學校完成抽籤程序。";
                    return;
                }

                const targetSid = isG1 ? pairData.g2_student_no : pairData.g1_student_no;
                const { data: targetStudent } = await client
                    .from('students')
                    .select('*')
                    .eq('student_no', targetSid)
                    .maybeSingle();

                document.getElementById('queryTargetRoleTag').innerText = isG1 ? "直屬學長姐 (高二)" : "直屬學弟妹 (高一)";
                if (targetStudent) {
                    document.getElementById('queryTargetName').innerText = targetStudent.name;
                    document.getElementById('queryTargetInfo').innerText = `${targetStudent.class_name} 班 ｜ 座號 ${targetStudent.seat_no || '-'} ｜ 學號 ${targetStudent.student_no} ｜ 性別: ${targetStudent.gender || '未註記'}`;
                } else {
                    document.getElementById('queryTargetName').innerText = "已配對";
                    document.getElementById('queryTargetInfo').innerText = `學號: ${targetSid}`;
                }

            } catch (err) {
                showToast("查詢失敗：" + err.message, true);
            } finally {
                btn.disabled = false;
                btn.innerText = "立即查詢";
            }
        }
    </script>
</body>
</html>
