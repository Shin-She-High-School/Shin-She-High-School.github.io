<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>直屬一對一聊天室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-900 text-white p-3.5 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2 font-black text-sm sm:text-base">
            <span>💬</span> 直屬一對一聊天室
        </div>
        <button id="btnLogout" onclick="logout()" class="hidden text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg font-bold text-slate-300">
            登出
        </button>
    </header>

    <main class="flex-1 max-w-xl w-full mx-auto p-3 sm:p-4 flex flex-col justify-center">

        <div id="loginCard" class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4 text-center">
            <div class="space-y-1">
                <h2 class="text-lg font-black text-slate-800">登入專屬聊天室</h2>
                <p id="stepDescription" class="text-xs text-slate-400 font-bold">第 1 步：請輸入您的學號</p>
            </div>

            <form onsubmit="handleAuthSubmit(event)" class="space-y-3">
                <div id="step1Box">
                    <input type="text" id="inputStudentNo" required placeholder="請輸入學號 (如: 410001)" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-center outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div id="step2Box" class="hidden space-y-2">
                    <div class="text-left text-xs text-slate-500 font-bold flex justify-between items-center px-1">
                        <span>學號：<span id="displayVerifiedSid" class="font-mono text-blue-600"></span></span>
                        <button type="button" onclick="resetToStep1()" class="text-[11px] text-slate-400 hover:text-slate-600 underline">更換學號</button>
                    </div>
                    <input type="text" id="inputFullName" placeholder="請輸入姓名全名 (如: 陳大明)" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-center outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button type="submit" id="btnAuthSubmit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl text-sm transition">
                    下一步：驗證學號
                </button>
            </form>

            <div id="loginError" class="text-rose-500 text-xs font-bold hidden"></div>
        </div>

        <div id="chatCard" class="hidden bg-white rounded-3xl border border-slate-200 shadow-sm flex flex-col h-[78vh] overflow-hidden">
            
            <div id="targetTabsContainer" class="hidden bg-slate-50 border-b border-slate-100 p-2 flex gap-1.5 overflow-x-auto custom-scrollbar"></div>

            <div class="px-4 py-2.5 border-b border-slate-100 flex items-center justify-between bg-white">
                <div>
                    <div id="currentChatTargetName" class="font-black text-sm text-slate-800">-</div>
                    <div id="currentChatTargetInfo" class="text-[10px] text-slate-400 font-bold">-</div>
                </div>
                <span class="text-[10px] bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full font-bold">一對一獨立房間</span>
            </div>

            <div id="messageList" class="flex-1 p-3.5 overflow-y-auto space-y-2.5 custom-scrollbar bg-slate-50/50"></div>

            <form onsubmit="handleSendMessage(event)" class="p-2.5 bg-white border-t border-slate-100 flex gap-2">
                <input type="text" id="inputMessage" placeholder="輸入訊息..." class="flex-1 px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-black shrink-0 transition">送出</button>
            </form>

        </div>

    </main>

    <footer class="py-2.5 text-center text-xs text-slate-400 font-semibold border-t border-slate-200">
        © 臺中市立新社高級中學 ＆ 開發團隊 版權所有
    </footer>

    <script>
        const SUPABASE_URL = "https://qpqtiavufscdfwhabnod.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ehTz6hW_jpdiO7Ht3Xq-yw_UoRl7F6M";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentAuthStep = 1;
        let verifiedStudent = null;
        let currentUser = null;
        let pairingRooms = [];
        let activePairing = null;
        let realtimeChannel = null;

        function maskName(name) {
            const str = String(name || '').trim();
            if (!str) return '-';
            if (str.length === 1) return str;
            if (str.length === 2) return str[0] + '○';
            if (str.length === 3) return str[0] + '○' + str[2];
            return str[0] + '○'.repeat(str.length - 2) + str[str.length - 1];
        }

        function escapeHtml(text) {
            return String(text || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function showError(msg) {
            const errBox = document.getElementById('loginError');
            errBox.innerText = msg;
            errBox.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('loginError').classList.add('hidden');
        }

        function resetToStep1() {
            currentAuthStep = 1;
            verifiedStudent = null;
            document.getElementById('step1Box').classList.remove('hidden');
            document.getElementById('step2Box').classList.add('hidden');
            document.getElementById('inputStudentNo').disabled = false;
            document.getElementById('inputFullName').value = '';
            document.getElementById('stepDescription').innerText = "第 1 步：請輸入您的學號";
            document.getElementById('btnAuthSubmit').innerText = "下一步：驗證學號";
            hideError();
            document.getElementById('inputStudentNo').focus();
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            hideError();

            if (currentAuthStep === 1) {
                const sid = document.getElementById('inputStudentNo').value.trim();
                if (!sid) return;

                const btn = document.getElementById('btnAuthSubmit');
                btn.disabled = true;
                btn.innerText = "驗證學號中...";

                try {
                    const { data: student, error } = await client.from('students').select('*').eq('student_no', sid).maybeSingle();
                    if (error || !student) {
                        throw new Error("查無此學號，請確認是否輸入正確！");
                    }

                    const isG1 = student.grade === 'G1';
                    const col = isG1 ? 'g1_student_no' : 'g2_student_no';
                    const { data: pairs, error: pairErr } = await client.from('pairings').select('id').eq(col, sid);

                    if (pairErr || !pairs || pairs.length === 0) {
                        throw new Error("此學號目前尚未建立直屬配對，無法使用聊天室！");
                    }

                    verifiedStudent = student;
                    currentAuthStep = 2;

                    document.getElementById('step1Box').classList.add('hidden');
                    document.getElementById('displayVerifiedSid').innerText = sid;
                    document.getElementById('step2Box').classList.remove('hidden');
                    document.getElementById('stepDescription').innerText = "第 2 步：請輸入您的中文全名以確認身分";
                    btn.innerText = "確認進入聊天室";
                    document.getElementById('inputFullName').focus();

                } catch (err) {
                    showError(err.message);
                } finally {
                    btn.disabled = false;
                    if (currentAuthStep === 1) btn.innerText = "下一步：驗證學號";
                }

            } else if (currentAuthStep === 2) {
                const nameInput = document.getElementById('inputFullName').value.trim();
                if (!nameInput) return;

                if (nameInput !== verifiedStudent.name) {
                    showError("姓名不符！請輸入正確的本名全名。");
                    document.getElementById('inputFullName').value = '';
                    document.getElementById('inputFullName').focus();
                    return;
                }

                currentUser = verifiedStudent;
                await loadChatRooms();
            }
        }

        async function loadChatRooms() {
            try {
                const isG1 = currentUser.grade === 'G1';
                const col = isG1 ? 'g1_student_no' : 'g2_student_no';
                const { data: pairs, error: pairErr } = await client.from('pairings').select('*').eq(col, currentUser.student_no);

                if (pairErr || !pairs || pairs.length === 0) {
                    throw new Error("無可用配對房間！");
                }

                const targetSids = pairs.map(p => isG1 ? p.g2_student_no : p.g1_student_no);
                const { data: targets } = await client.from('students').select('*').in('student_no', targetSids);
                const targetMap = {};
                (targets || []).forEach(t => { targetMap[t.student_no] = t; });

                pairingRooms = pairs.map(p => ({
                    pairingId: p.id,
                    targetStudent: targetMap[isG1 ? p.g2_student_no : p.g1_student_no] || { name: '未知', class_name: '-' }
                }));

                document.getElementById('loginCard').classList.add('hidden');
                document.getElementById('chatCard').classList.remove('hidden');
                document.getElementById('btnLogout').classList.remove('hidden');

                renderTabs();
                switchRoom(0);

            } catch (err) {
                showError("載入聊天室失敗：" + err.message);
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('targetTabsContainer');
            if (pairingRooms.length <= 1) {
                tabsContainer.classList.add('hidden');
                return;
            }
            tabsContainer.classList.remove('hidden');
            tabsContainer.innerHTML = '';

            pairingRooms.forEach((room, idx) => {
                const btn = document.createElement('button');
                btn.id = `tab-btn-${idx}`;
                btn.className = `px-3 py-1.5 rounded-xl text-xs font-black shrink-0 transition ${idx === 0 ? 'bg-blue-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`;
                btn.innerText = `直屬：${maskName(room.targetStudent.name)}`;
                btn.onclick = () => switchRoom(idx);
                tabsContainer.appendChild(btn);
            });
        }

        async function switchRoom(index) {
            activePairing = pairingRooms[index];

            if (pairingRooms.length > 1) {
                pairingRooms.forEach((_, idx) => {
                    const btn = document.getElementById(`tab-btn-${idx}`);
                    if (btn) btn.className = `px-3 py-1.5 rounded-xl text-xs font-black shrink-0 transition ${idx === index ? 'bg-blue-600 text-white shadow' : 'bg-white text-slate-600 border border-slate-200'}`;
                });
            }

            document.getElementById('currentChatTargetName').innerText = maskName(activePairing.targetStudent.name);
            document.getElementById('currentChatTargetInfo').innerText = `${activePairing.targetStudent.class_name || ''} 班 ｜ 直屬專屬房間`;

            if (realtimeChannel) {
                client.removeChannel(realtimeChannel);
            }

            const listEl = document.getElementById('messageList');
            listEl.innerHTML = '<div class="text-center text-xs text-slate-400 py-4 font-bold">載入訊息中...</div>';

            const { data: messages } = await client
                .from('direct_chat_messages')
                .select('*')
                .eq('pairing_id', activePairing.pairingId)
                .order('created_at', { ascending: true });

            listEl.innerHTML = '';
            (messages || []).forEach(appendMessage);

            realtimeChannel = client
                .channel(`room:${activePairing.pairingId}`)
                .on(
                    'postgres_changes',
                    {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'direct_chat_messages',
                        filter: `pairing_id=eq.${activePairing.pairingId}`
                    },
                    payload => {
                        appendMessage(payload.new);
                    }
                )
                .subscribe();
        }

        function appendMessage(msg) {
            const listEl = document.getElementById('messageList');
            const isMe = msg.sender_id === currentUser.student_no;
            const item = document.createElement('div');
            item.className = `flex ${isMe ? 'justify-end' : 'justify-start'} w-full`;
            item.innerHTML = `
                <div class="max-w-[75%] px-3.5 py-2 rounded-2xl text-xs font-bold leading-relaxed break-all ${
                    isMe ? 'bg-blue-600 text-white rounded-br-xs' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-xs'
                }">
                    ${escapeHtml(msg.content)}
                </div>
            `;
            listEl.appendChild(item);
            listEl.scrollTop = listEl.scrollHeight;
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('inputMessage');
            const text = input.value.trim();
            if (!text || !activePairing) return;

            input.value = '';
            await client.from('direct_chat_messages').insert([{
                pairing_id: activePairing.pairingId,
                sender_id: currentUser.student_no,
                content: text
            }]);
        }

        function logout() {
            if (realtimeChannel) client.removeChannel(realtimeChannel);
            currentUser = null;
            verifiedStudent = null;
            pairingRooms = [];
            activePairing = null;
            currentAuthStep = 1;

            document.getElementById('inputStudentNo').value = '';
            document.getElementById('inputFullName').value = '';
            document.getElementById('chatCard').classList.add('hidden');
            document.getElementById('btnLogout').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
            resetToStep1();
        }
    </script>
</body>
</html>
