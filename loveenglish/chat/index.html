<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>直屬聊天室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .chat-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.4);
            border-radius: 9999px;
        }
        .bubble-me {
            border-radius: 18px 18px 4px 18px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
        }
        .bubble-other {
            border-radius: 18px 18px 18px 4px;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-[#f0f2f5] text-slate-900 min-h-screen flex items-center justify-center sm:p-4">

    <div class="w-full max-w-md bg-white sm:rounded-3xl shadow-xl h-[100dvh] sm:h-[840px] flex flex-col overflow-hidden relative border border-slate-200/80">

        <div id="loginSection" class="flex-1 flex flex-col justify-center px-6 py-8 bg-slate-50">
            <div class="bg-white p-7 rounded-2xl border border-slate-200 shadow-sm space-y-5">
                <div class="text-center space-y-1">
                    <div class="w-14 h-14 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 font-bold">
                        💬
                    </div>
                    <h2 class="text-xl font-black text-slate-800">登入直屬聊天室</h2>
                    <p id="stepDescription" class="text-xs text-slate-400 font-bold">第 1 步：請輸入您的學號</p>
                </div>

                <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                    <div id="step1Box">
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">學號</label>
                        <input type="text" id="inputStudentNo" required placeholder="例如: 410001" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 transition text-center tracking-wide">
                    </div>

                    <div id="step2Box" class="hidden space-y-2">
                        <div class="flex justify-between items-center text-xs font-bold text-slate-500 px-1">
                            <span>驗證學號：<strong id="displayVerifiedSid" class="text-emerald-700 font-mono"></strong></span>
                            <button type="button" onclick="resetToStep1()" class="text-slate-400 hover:text-slate-600 underline">切換學號</button>
                        </div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">姓名全名</label>
                        <input type="text" id="inputFullName" placeholder="例如: 陳大明" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 transition text-center">
                    </div>

                    <button type="submit" id="btnAuthSubmit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold rounded-xl text-sm transition shadow-md shadow-emerald-600/20">
                        下一步：驗證學號
                    </button>
                </form>

                <div id="loginError" class="text-rose-500 text-xs font-bold text-center bg-rose-50 py-2 rounded-lg border border-rose-200 hidden"></div>
            </div>
        </div>

        <div id="chatSection" class="hidden flex-1 flex flex-col h-full bg-[#efeae2] relative overflow-hidden">
            
            <header class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between shadow-sm z-10 shrink-0">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <div id="headerAvatar" class="w-10 h-10 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-sm shadow-inner uppercase">
                            -
                        </div>
                        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-400 border-2 border-slate-900 rounded-full"></span>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h3 id="currentChatTargetName" class="font-bold text-sm text-slate-100">-</h3>
                            <span id="targetRoleBadge" class="text-[10px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded font-medium">直屬</span>
                        </div>
                        <p id="currentChatTargetInfo" class="text-[11px] text-slate-400 font-medium leading-none">-</p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="logout()" title="登出" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-full transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                </div>
            </header>

            <div id="targetTabsContainer" class="hidden bg-slate-800/95 border-b border-slate-700/50 px-3 py-1.5 flex gap-2 overflow-x-auto chat-scroll shrink-0"></div>

            <main id="messageList" class="flex-1 overflow-y-auto p-4 space-y-3.5 chat-scroll bg-[#f4ede4] bg-opacity-70"></main>

            <footer class="bg-white p-2.5 border-t border-slate-200/80 shrink-0">
                <form onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
                    <div class="flex-1 bg-slate-100 rounded-full px-4 py-2 border border-slate-200/80 focus-within:border-emerald-500 focus-within:bg-white transition flex items-center">
                        <input type="text" id="inputMessage" placeholder="輸入訊息..." autocomplete="off" class="w-full bg-transparent text-sm text-slate-800 outline-none placeholder:text-slate-400 font-normal">
                    </div>
                    <button type="submit" id="btnSend" class="w-10 h-10 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full flex items-center justify-center transition shrink-0 shadow-sm disabled:opacity-50">
                        <svg class="w-4 h-4 translate-x-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                    </button>
                </form>
            </footer>

        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://qpqtiavufscdfwhabnod.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ehTz6hW_jpdiO7Ht3Xq-yw_UoRl7F6M";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentAuthStep = 1;
        let verifiedStudent = null;
        let currentUser = null;
        let pairingRooms = [];
        let activePairing = null;
        let realtimeChannel = null;

        function maskName(name) {
            const str = String(name || '').trim();
            if (!str) return '-';
            if (str.length === 1) return str;
            if (str.length === 2) return str[0] + '○';
            if (str.length === 3) return str[0] + '○' + str[2];
            return str[0] + '○'.repeat(str.length - 2) + str[str.length - 1];
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function escapeHtml(text) {
            return String(text || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function showError(msg) {
            const errBox = document.getElementById('loginError');
            errBox.innerText = msg;
            errBox.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('loginError').classList.add('hidden');
        }

        function resetToStep1() {
            currentAuthStep = 1;
            verifiedStudent = null;
            document.getElementById('step1Box').classList.remove('hidden');
            document.getElementById('step2Box').classList.add('hidden');
            document.getElementById('inputStudentNo').disabled = false;
            document.getElementById('inputFullName').value = '';
            document.getElementById('stepDescription').innerText = "第 1 步：請輸入您的學號";
            document.getElementById('btnAuthSubmit').innerText = "下一步：驗證學號";
            hideError();
            document.getElementById('inputStudentNo').focus();
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            hideError();

            if (currentAuthStep === 1) {
                const sid = document.getElementById('inputStudentNo').value.trim();
                if (!sid) return;

                const btn = document.getElementById('btnAuthSubmit');
                btn.disabled = true;
                btn.innerText = "驗證中...";

                try {
                    const { data: student, error } = await client.from('students').select('*').eq('student_no', sid).maybeSingle();
                    if (error || !student) {
                        throw new Error("查無此學號，請確認是否輸入正確！");
                    }

                    const isG1 = student.grade === 'G1';
                    const col = isG1 ? 'g1_student_no' : 'g2_student_no';
                    const { data: pairs, error: pairErr } = await client.from('pairings').select('id').eq(col, sid);

                    if (pairErr || !pairs || pairs.length === 0) {
                        throw new Error("此學號目前尚未建立直屬配對！");
                    }

                    verifiedStudent = student;
                    currentAuthStep = 2;

                    document.getElementById('step1Box').classList.add('hidden');
                    document.getElementById('displayVerifiedSid').innerText = sid;
                    document.getElementById('step2Box').classList.remove('hidden');
                    document.getElementById('stepDescription').innerText = "第 2 步：請輸入姓名全名以確認身分";
                    btn.innerText = "確認進入聊天室";
                    document.getElementById('inputFullName').focus();

                } catch (err) {
                    showError(err.message);
                } finally {
                    btn.disabled = false;
                    if (currentAuthStep === 1) btn.innerText = "下一步：驗證學號";
                }

            } else if (currentAuthStep === 2) {
                const nameInput = document.getElementById('inputFullName').value.trim();
                if (!nameInput) return;

                if (nameInput !== verifiedStudent.name) {
                    showError("姓名不符！請輸入正確的本名全名。");
                    document.getElementById('inputFullName').value = '';
                    document.getElementById('inputFullName').focus();
                    return;
                }

                currentUser = verifiedStudent;
                await loadChatRooms();
            }
        }

        async function loadChatRooms() {
            try {
                const isG1 = currentUser.grade === 'G1';
                const col = isG1 ? 'g1_student_no' : 'g2_student_no';
                const { data: pairs, error: pairErr } = await client.from('pairings').select('*').eq(col, currentUser.student_no);

                if (pairErr || !pairs || pairs.length === 0) {
                    throw new Error("無可用配對房間！");
                }

                const targetSids = pairs.map(p => isG1 ? p.g2_student_no : p.g1_student_no);
                const { data: targets } = await client.from('students').select('*').in('student_no', targetSids);
                const targetMap = {};
                (targets || []).forEach(t => { targetMap[t.student_no] = t; });

                pairingRooms = pairs.map(p => ({
                    pairingId: p.id,
                    targetStudent: targetMap[isG1 ? p.g2_student_no : p.g1_student_no] || { name: '未知', class_name: '-', grade: isG1 ? 'G2' : 'G1' }
                }));

                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('chatSection').classList.remove('hidden');

                renderTabs();
                switchRoom(0);

            } catch (err) {
                showError("載入失敗：" + err.message);
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('targetTabsContainer');
            if (pairingRooms.length <= 1) {
                tabsContainer.classList.add('hidden');
                return;
            }
            tabsContainer.classList.remove('hidden');
            tabsContainer.innerHTML = '';

            pairingRooms.forEach((room, idx) => {
                const btn = document.createElement('button');
                btn.id = `tab-btn-${idx}`;
                btn.className = `px-3 py-1 rounded-full text-xs font-bold shrink-0 transition ${idx === 0 ? 'bg-emerald-500 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`;
                btn.innerText = maskName(room.targetStudent.name);
                btn.onclick = () => switchRoom(idx);
                tabsContainer.appendChild(btn);
            });
        }

        async function switchRoom(index) {
            activePairing = pairingRooms[index];

            if (pairingRooms.length > 1) {
                pairingRooms.forEach((_, idx) => {
                    const btn = document.getElementById(`tab-btn-${idx}`);
                    if (btn) btn.className = `px-3 py-1 rounded-full text-xs font-bold shrink-0 transition ${idx === index ? 'bg-emerald-500 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`;
                });
            }

            const targetNameMasked = maskName(activePairing.targetStudent.name);
            document.getElementById('currentChatTargetName').innerText = targetNameMasked;
            document.getElementById('headerAvatar').innerText = targetNameMasked.charAt(0);
            
            const isG1 = currentUser.grade === 'G1';
            document.getElementById('targetRoleBadge').innerText = isG1 ? '學長姐' : '學弟妹';
            document.getElementById('currentChatTargetInfo').innerText = `${activePairing.targetStudent.class_name || ''} 班 ｜ 直屬專屬房間`;

            if (realtimeChannel) {
                client.removeChannel(realtimeChannel);
            }

            const listEl = document.getElementById('messageList');
            listEl.innerHTML = '<div class="text-center text-xs text-slate-400 py-6">正在同步訊息紀錄...</div>';

            const { data: messages } = await client
                .from('direct_chat_messages')
                .select('*')
                .eq('pairing_id', activePairing.pairingId)
                .order('created_at', { ascending: true });

            listEl.innerHTML = '';
            (messages || []).forEach(appendMessage);
            scrollToBottom();

            realtimeChannel = client
                .channel(`room:${activePairing.pairingId}`)
                .on(
                    'postgres_changes',
                    {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'direct_chat_messages',
                        filter: `pairing_id=eq.${activePairing.pairingId}`
                    },
                    payload => {
                        appendMessage(payload.new);
                        scrollToBottom();
                    }
                )
                .subscribe();
        }

        function appendMessage(msg) {
            const listEl = document.getElementById('messageList');
            const isMe = msg.sender_id === currentUser.student_no;
            const item = document.createElement('div');
            item.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} w-full`;

            const timeStr = formatTime(msg.created_at);

            item.innerHTML = `
                <div class="flex items-end gap-1.5 max-w-[80%] ${isMe ? 'flex-row-reverse' : 'flex-row'}">
                    <div class="px-3.5 py-2 text-[13.5px] leading-relaxed break-all ${isMe ? 'bubble-me text-white' : 'bubble-other text-slate-800'}">
                        ${escapeHtml(msg.content)}
                    </div>
                    <span class="text-[10px] text-slate-400 font-medium shrink-0 mb-0.5 select-none">${timeStr}</span>
                </div>
            `;
            listEl.appendChild(item);
        }

        function scrollToBottom() {
            const listEl = document.getElementById('messageList');
            listEl.scrollTop = listEl.scrollHeight;
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('inputMessage');
            const text = input.value.trim();
            if (!text || !activePairing) return;

            input.value = '';
            await client.from('direct_chat_messages').insert([{
                pairing_id: activePairing.pairingId,
                sender_id: currentUser.student_no,
                content: text
            }]);
        }

        function logout() {
            if (realtimeChannel) client.removeChannel(realtimeChannel);
            currentUser = null;
            verifiedStudent = null;
            pairingRooms = [];
            activePairing = null;
            currentAuthStep = 1;

            document.getElementById('inputStudentNo').value = '';
            document.getElementById('inputFullName').value = '';
            document.getElementById('chatSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            resetToStep1();
        }
    </script>
</body>
</html>
