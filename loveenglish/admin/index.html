    <script>
        const SUPABASE_URL = "https://qpqtiavufscdfwhabnod.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ehTz6hW_jpdiO7Ht3Xq-yw_UoRl7F6M";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let clientIpPromise;

        let allStudents = [];
        let allPairings = [];
        let allLogs = [];
        let currentFilteredPairings = [];
        let currentFilteredUnpaired = [];

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.innerText = msg;
            t.className = `fixed top-5 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl text-white font-extrabold text-sm shadow-xl transition-all duration-300 ${isError ? 'bg-rose-500' : 'bg-emerald-600'}`;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2600);
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        async function getClientIp() {
            if (!clientIpPromise) {
                clientIpPromise = (async () => {
                    const services = [
                        { url: 'https://api.ipify.org?format=json', json: true },
                        { url: 'https://api64.ipify.org?format=json', json: true },
                        { url: 'https://ifconfig.co/json', json: true },
                        { url: 'https://ipapi.co/json/', json: true },
                        { url: 'https://ipwho.is/', json: true },
                        { url: 'https://api.myip.com/', json: true },
                        { url: 'https://ipinfo.io/json', json: true },
                        { url: 'https://icanhazip.com/', json: false },
                        { url: 'https://checkip.amazonaws.com/', json: false },
                        { url: 'https://ifconfig.me/ip', json: false },
                        { url: 'https://ident.me/', json: false },
                        { url: 'https://www.cloudflare.com/cdn-cgi/trace', json: false, trace: true }
                    ];
                    while (true) {
                        for (const service of services) {
                            const controller = new AbortController();
                            const timeout = setTimeout(() => controller.abort(), 3000);
                            try {
                                const response = await fetch(service.url, {
                                    headers: { Accept: 'application/json' },
                                    cache: 'no-store',
                                    signal: controller.signal
                                });
                                if (!response.ok) continue;
                                const body = service.json ? await response.json() : await response.text();
                                const value = service.trace
                                    ? String(body).match(/(?:^|\n)ip=([^\r\n]+)/)?.[1]
                                    : (service.json ? (body.ip || body.ipAddress) : String(body).trim());
                                if (value && /^(?:\d{1,3}\.){3}\d{1,3}$|^[0-9a-f:]+$/i.test(String(value))) {
                                    return String(value);
                                }
                            } catch (error) {
                                console.warn('IP service unavailable:', service, error);
                            } finally {
                                clearTimeout(timeout);
                            }
                        }
                        await new Promise(resolve => setTimeout(resolve, 1000));
                    }
                })();
            }
            return clientIpPromise;
        }

        async function logAudit(actionType, details = {}) {
            try {
                const ipAddress = await getClientIp();
                const { error } = await client.from('audit_logs').insert([{
                    action_type: actionType,
                    details,
                    ip_address: ipAddress
                }]);
                if (error) throw error;
            } catch (error) {
                console.error('Audit log failed:', error);
            }
        }

        function setAdminRoute(r) {
            window.location.hash = `#${r}`;
        }

        function handleAdminHashRouting() {
            const rawHash = (window.location.hash || '').replace('#', '').replace('/', '');
            let current = 'students';
            if (['students', 'paired', 'unpaired', 'audit'].includes(rawHash)) {
                current = rawHash;
            }

            document.querySelectorAll('.admin-panel').forEach(p => p.classList.add('hidden'));
            ['students', 'paired', 'unpaired', 'audit'].forEach(k => {
                const btn = document.getElementById(`tabBtn_${k}`);
                if (btn) btn.className = "px-3.5 py-1.5 rounded-xl bg-slate-800 text-slate-300 hover:text-white transition";
            });

            document.getElementById(`panel_${current}`)?.classList.remove('hidden');
            const activeBtn = document.getElementById(`tabBtn_${current}`);
            if (activeBtn) activeBtn.className = "px-3.5 py-1.5 rounded-xl bg-blue-600 text-white shadow transition";

            if (current === 'students') renderStudentsAdminTable();
            if (current === 'paired') renderPairingsTable();
            if (current === 'unpaired') renderUnpairedTable();
            if (current === 'audit') loadAuditLogs();
        }

        async function loadAdminData() {
            try {
                const { data: stData } = await client.from('students').select('*');
                allStudents = stData || [];

                const { data: pairData } = await client.from('pairings').select('*').order('paired_at', { ascending: false });
                allPairings = pairData || [];

                handleAdminHashRouting();
            } catch (err) {
                showToast("載入資料失敗：" + err.message, true);
            }
        }

        function renderStudentsAdminTable() {
            const tbody = document.getElementById('studentsAdminTableBody');
            const gradeFilter = document.getElementById('filterStudentGradeAdmin')?.value || 'ALL';
            if (!tbody) return;

            let list = allStudents;
            if (gradeFilter !== 'ALL') list = list.filter(s => s.grade === gradeFilter);

            list.sort((a, b) => {
                const classCompare = String(a.class_name || '').localeCompare(String(b.class_name || ''), undefined, { numeric: true });
                if (classCompare !== 0) return classCompare;
                const seatA = parseInt(a.seat_no, 10) || 0;
                const seatB = parseInt(b.seat_no, 10) || 0;
                return seatA - seatB;
            });

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">目前尚無學生資料。</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(s => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3 font-bold">${escapeHtml(s.class_name)} 班</td>
                    <td class="p-3 font-mono text-slate-800">${s.seat_no ? `${escapeHtml(s.seat_no)}號` : '-'}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-black ${s.grade === 'G1' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}">${s.grade === 'G1' ? '高一' : '高二'}</span></td>
                    <td class="p-3 font-black text-slate-900">${escapeHtml(s.name)}</td>
                    <td class="p-3 font-mono text-slate-500">${escapeHtml(s.student_no)}</td>
                    <td class="p-3">${escapeHtml(s.gender || '-')}</td>
                    <td class="p-3 text-center">
                        <button type="button" data-student-no="${escapeHtml(s.student_no)}" data-student-name="${escapeHtml(s.name)}" class="delete-student-button px-2 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded text-xs font-bold transition">刪除</button>
                    </td>
                </tr>
            `).join('');
            tbody.onclick = event => {
                const button = event.target.closest('.delete-student-button');
                if (button) deleteSingleStudent(button.dataset.studentNo, button.dataset.studentName);
            };
        }

        async function deleteSingleStudent(studentNo, name) {
            if (!confirm(`確定要刪除學生【${name} (${studentNo})】嗎？`)) return;
            try {
                const { error } = await client.from('students').delete().eq('student_no', studentNo);
                if (error) throw error;
                showToast(`已刪除 ${name}！`);
                await logAudit("刪除學生", { student_no: studentNo, name });
                await loadAdminData();
            } catch (e) {
                showToast("刪除失敗：" + e.message, true);
            }
        }

        async function importStudents(targetGrade) {
            const inputId = targetGrade === 'G1' ? 'fileInputG1' : 'fileInputG2';
            const btnId = targetGrade === 'G1' ? 'btnImportG1' : 'btnImportG2';
            const fileInput = document.getElementById(inputId);
            const btn = document.getElementById(btnId);

            if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
                showToast("請先選擇要匯入的檔案！", true);
                return;
            }

            btn.disabled = true;
            btn.innerText = "上傳中...";

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet);

                    const payload = rows.map(r => {
                        const student_no = String(r['學號'] || r['student_no'] || '').trim();
                        const class_name = String(r['班級'] || r['class_name'] || '').trim();
                        const seat_no = parseInt(r['座號'] || r['seat_no'] || 0, 10) || null;
                        const name = String(r['姓名'] || r['name'] || '').trim();
                        const gender = String(r['性別'] || r['gender'] || '').trim();

                        return {
                            student_no,
                            grade: targetGrade,
                            class_name,
                            seat_no,
                            name,
                            gender
                        };
                    }).filter(s => s.student_no && s.name && s.class_name);

                    if (payload.length === 0) {
                        throw new Error("檔案中找不到包含「學號」、「班級」、「姓名」的有效資料！");
                    }

                    const chunkSize = 300;
                    for (let i = 0; i < payload.length; i += chunkSize) {
                        const chunk = payload.slice(i, i + chunkSize);
                        const { error } = await client.from('students').upsert(chunk, { onConflict: 'student_no' });
                        if (error) throw error;
                    }

                    showToast(`✅ 成功匯入 ${payload.length} 筆${targetGrade === 'G1' ? '高一' : '高二'}名單！`);
                    await logAudit(`匯入${targetGrade === 'G1' ? '高一' : '高二'}名單`, { count: payload.length });
                    fileInput.value = '';
                    await loadAdminData();
                } catch (err) {
                    showToast("匯入失敗：" + err.message, true);
                } finally {
                    btn.disabled = false;
                    btn.innerText = targetGrade === 'G1' ? "確認解析並匯入高一" : "確認解析並匯入高二";
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function clearAllStudents() {
            if (!confirm("⚠ 確定要清空所有學生名單與配對紀錄嗎？此動作無法復原！")) return;
            try {
                const { error: pairingsError } = await client.from('pairings').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                if (pairingsError) throw pairingsError;
                const { error: studentsError } = await client.from('students').delete().neq('student_no', '___');
                if (studentsError) throw studentsError;
                showToast("已清空學生資料庫！");
                await logAudit("清空學生資料庫", { status: "全數清除" });
                await loadAdminData();
            } catch (err) {
                showToast("清除失敗：" + err.message, true);
            }
        }

        async function resetAllPairings() {
            if (!confirm("確定要重置所有現存的抽籤配對記錄嗎？")) return;
            try {
                const { error } = await client.from('pairings').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                if (error) throw error;
                showToast("已重置所有直屬配對記錄！");
                await logAudit("重置直屬配對", { status: "全體重置" });
                await loadAdminData();
            } catch (err) {
                showToast("重置失敗：" + err.message, true);
            }
        }

        function renderPairingsTable() {
            const tbody = document.getElementById('pairingsTableBody');
            const countBadge = document.getElementById('pairedCountBadge');
            const classFilter = document.getElementById('filterPairingClass')?.value || 'ALL';
            if (!tbody) return;

            const studentMap = {};
            allStudents.forEach(s => { studentMap[s.student_no] = s; });

            const g1Counts = {};
            allPairings.forEach(p => {
                g1Counts[p.g1_student_no] = (g1Counts[p.g1_student_no] || 0) + 1;
            });

            currentFilteredPairings = allPairings.filter(p => {
                const g1 = studentMap[p.g1_student_no] || {};
                const g2 = studentMap[p.g2_student_no] || {};
                if (classFilter !== 'ALL' &&
                    !String(g1.class_name || '').includes(classFilter) &&
                    !String(g2.class_name || '').includes(classFilter)) return false;
                return true;
            });

            currentFilteredPairings.sort((a, b) => {
                const g1A = studentMap[a.g1_student_no] || { class_name: '', seat_no: 0 };
                const g1B = studentMap[b.g1_student_no] || { class_name: '', seat_no: 0 };
                const g2A = studentMap[a.g2_student_no] || { class_name: '', seat_no: 0 };
                const g2B = studentMap[b.g2_student_no] || { class_name: '', seat_no: 0 };

                const selectedA = classFilter !== 'ALL' && String(g1A.class_name || '').includes(classFilter) ? g1A : g2A;
                const selectedB = classFilter !== 'ALL' && String(g1B.class_name || '').includes(classFilter) ? g1B : g2B;
                const classA = classFilter === 'ALL' ? g1A.class_name : selectedA.class_name;
                const classB = classFilter === 'ALL' ? g1B.class_name : selectedB.class_name;
                const classCompare = String(classA || '').localeCompare(String(classB || ''), undefined, { numeric: true });
                if (classCompare !== 0) return classCompare;
                const sortSeatA = parseInt((classFilter === 'ALL' ? g1A : selectedA).seat_no, 10) || 0;
                const sortSeatB = parseInt((classFilter === 'ALL' ? g1B : selectedB).seat_no, 10) || 0;
                return sortSeatA - sortSeatB;
            });

            if (countBadge) countBadge.innerText = `共 ${currentFilteredPairings.length} 組`;

            if (currentFilteredPairings.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="p-6 text-center text-slate-400">目前無符合條件之配對記錄。</td></tr>`;
                return;
            }

            tbody.innerHTML = currentFilteredPairings.map(p => {
                const g1 = studentMap[p.g1_student_no] || { name: '未知', class_name: '-', seat_no: '-' };
                const g2 = studentMap[p.g2_student_no] || { name: '未知', class_name: '-', seat_no: '-' };
                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 font-bold">${escapeHtml(g1.class_name)} 班</td>
                        <td class="p-3 font-mono text-slate-800">${g1.seat_no ? `${escapeHtml(g1.seat_no)}號` : '-'}</td>
                        <td class="p-3 font-black text-slate-900">${escapeHtml(g1.name)}</td>
                        <td class="p-3 font-mono text-slate-500">${escapeHtml(p.g1_student_no)}</td>
                        <td class="p-3">${escapeHtml(g1.gender || '-')}</td>
                        <td class="p-3 text-center text-blue-600 font-black">➔</td>
                        <td class="p-3 font-bold">${escapeHtml(g2.class_name)} 班</td>
                        <td class="p-3 font-mono text-slate-800">${g2.seat_no ? `${escapeHtml(g2.seat_no)}號` : '-'}</td>
                        <td class="p-3 font-black text-slate-900">${escapeHtml(g2.name)}</td>
                        <td class="p-3 font-mono text-slate-500">${escapeHtml(p.g2_student_no)}</td>
                        <td class="p-3">${escapeHtml(g2.gender || '-')}</td>
                    </tr>
                `;
            }).join('');
        }

        function exportFilteredPairings() {
            if (currentFilteredPairings.length === 0) {
                showToast("無配對名冊可供匯出！", true);
                return;
            }
            const studentMap = {};
            allStudents.forEach(s => { studentMap[s.student_no] = s; });

            const rows = currentFilteredPairings.map(p => {
                const g1 = studentMap[p.g1_student_no] || {};
                const g2 = studentMap[p.g2_student_no] || {};
                return {
                    "高一班級": g1.class_name || '',
                    "高一座號": g1.seat_no || '',
                    "高一姓名": g1.name || '',
                    "高一學號": p.g1_student_no,
                    "高一年級": g1.grade || '',
                    "高一性別": g1.gender || '',
                    "高二直屬姓名": g2.name || '',
                    "高二直屬班級": g2.class_name || '',
                    "高二直屬座號": g2.seat_no || '',
                    "高二直屬學號": p.g2_student_no,
                    "高二年級": g2.grade || '',
                    "高二性別": g2.gender || ''
                };
            });

            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "已配對清冊");
            XLSX.writeFile(wb, `直屬配對清冊_${new Date().toISOString().slice(0, 10)}.xlsx`);
        }

        function renderUnpairedTable() {
            const tbody = document.getElementById('unpairedTableBody');
            const countBadge = document.getElementById('unpairedCountBadge');
            const gradeFilter = document.getElementById('filterUnpairedGrade')?.value || 'ALL';
            const classFilter = document.getElementById('filterUnpairedClass')?.value || 'ALL';
            if (!tbody) return;

            const pairedG1Set = new Set(allPairings.map(p => p.g1_student_no));
            const pairedG2Set = new Set(allPairings.map(p => p.g2_student_no));

            let list = allStudents.filter(s => {
                if (s.grade === 'G1' && pairedG1Set.has(s.student_no)) return false;
                if (s.grade === 'G2' && pairedG2Set.has(s.student_no)) return false;
                return true;
            });

            if (gradeFilter !== 'ALL') list = list.filter(s => s.grade === gradeFilter);
            if (classFilter !== 'ALL') list = list.filter(s => s.class_name.includes(classFilter));

            list.sort((a, b) => {
                const seatA = parseInt(a.seat_no, 10) || 0;
                const seatB = parseInt(b.seat_no, 10) || 0;

                if (classFilter !== 'ALL') {
                    return seatA - seatB;
                } else {
                    const classCompare = String(a.class_name || '').localeCompare(String(b.class_name || ''), undefined, { numeric: true });
                    if (classCompare !== 0) return classCompare;
                    return seatA - seatB;
                }
            });

            currentFilteredUnpaired = list;
            if (countBadge) countBadge.innerText = `共 ${currentFilteredUnpaired.length} 人`;

            if (currentFilteredUnpaired.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">目前沒有尚未配對之學生！</td></tr>`;
                return;
            }

            tbody.innerHTML = currentFilteredUnpaired.map(s => {
                const isG1 = s.grade === 'G1';
                const statusTag = isG1 
                    ? '<span class="px-2 py-0.5 rounded text-[10px] font-black bg-blue-50 text-blue-700 border border-blue-200">高一 ｜ 尚無直屬</span>'
                    : '<span class="px-2 py-0.5 rounded text-[10px] font-black bg-amber-50 text-amber-700 border border-amber-200">高二 ｜ 待抽籤池</span>';

                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 font-bold text-slate-800">${escapeHtml(s.class_name)} 班</td>
                        <td class="p-3 font-mono text-slate-800">${s.seat_no ? `${escapeHtml(s.seat_no)}號` : '-'}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-black ${isG1 ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}">${isG1 ? '高一' : '高二'}</span></td>
                        <td class="p-3 font-black text-slate-900">${escapeHtml(s.name)}</td>
                        <td class="p-3 font-mono text-slate-500">${escapeHtml(s.student_no)}</td>
                        <td class="p-3">${escapeHtml(s.gender || '-')}</td>
                        <td class="p-3">${statusTag}</td>
                    </tr>
                `;
            }).join('');
        }

        function exportFilteredUnpaired() {
            if (currentFilteredUnpaired.length === 0) {
                showToast("無未配對名冊可供匯出！", true);
                return;
            }
            const rows = currentFilteredUnpaired.map(s => ({
                "班級": s.class_name,
                "座號": s.seat_no || '',
                "年級": s.grade === 'G1' ? '高一' : '高二',
                "姓名": s.name,
                "學號": s.student_no,
                "性別": s.gender || '',
                "狀態": s.grade === 'G1' ? '尚無直屬' : '待抽籤池'
            }));

            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "未被抽取名冊");
            XLSX.writeFile(wb, `未被抽取學生名冊_${new Date().toISOString().slice(0, 10)}.xlsx`);
        }

        async function loadAuditLogs() {
            try {
                const { data, error } = await client
                    .from('audit_logs')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(100);

                if (!error && data) {
                    allLogs = data;
                    renderAuditLogs(allLogs);
                } else {
                    showToast(`載入操作日誌失敗：${error?.message || '未知錯誤'}`, true);
                }
            } catch (e) {
                showToast(`載入操作日誌失敗：${e.message}`, true);
            }
        }

        function renderAuditLogs(logs) {
            const tbody = document.getElementById('auditLogTableBody');
            if (!tbody) return;

            if (logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">尚無操作日誌。</td></tr>`;
                return;
            }

            tbody.innerHTML = logs.map(l => {
                const details = l.details && typeof l.details === 'object' ? l.details : {};
                const recordedIp = l.ip_address || details.ip_address || '';
                const ipAddress = recordedIp === '未知' ? 'IP取得失敗' : (recordedIp || 'IP取得失敗');
                const actionType = String(l.action_type || '未命名操作');
                const actionClass = actionType.includes('刪除') || actionType.includes('清空') || actionType.includes('重置')
                    ? 'bg-rose-50 text-rose-700 border-rose-200'
                    : actionType.includes('匯入')
                        ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                        : 'bg-indigo-50 text-indigo-700 border-indigo-200';
                const detailLabels = {
                        g1: '高一學生',
                        g2: '高二直屬',
                        class: '班級',
                        count: '筆數',
                        name: '姓名',
                        student_no: '學號',
                        status: '狀態'
                };
                const detailEntries = Object.entries(details)
                        .filter(([key]) => key !== 'ip_address')
                        .map(([key, value]) => {
                            let displayValue = value;
                            if (value && typeof value === 'object') {
                                try {
                                    displayValue = JSON.stringify(value);
                                } catch (error) {
                                    displayValue = '-';
                                }
                            }
                            return `
                                <span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-lg bg-slate-50 border border-slate-200">
                                    <span class="text-[10px] font-black text-slate-400">${escapeHtml(detailLabels[key] || key)}</span>
                                    <span class="text-[11px] font-bold text-slate-700 break-all">${escapeHtml(displayValue)}</span>
                                </span>
                            `;
                        }).join('');
                const detailContent = detailEntries || '<span class="text-slate-400">無詳細內容</span>';

                return `
                        <tr class="hover:bg-blue-50/40 transition align-top">
                            <td class="p-3 border-b border-slate-100 font-mono text-[11px] text-slate-500 whitespace-nowrap">${escapeHtml(new Date(l.created_at).toLocaleString('zh-TW'))}</td>
                        <td class="p-3 border-b border-slate-100">
                            <span class="inline-flex px-2.5 py-1 rounded-lg font-extrabold text-[10px] ${actionClass} border">${escapeHtml(actionType)}</span>
                        </td>
                        <td class="p-3 border-b border-slate-100">
                            <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-slate-100 text-slate-600 font-mono text-[11px]">${escapeHtml(ipAddress)}</span>
                        </td>
                        <td class="p-3 border-b border-slate-100">
                            <div class="flex flex-wrap gap-1.5">${detailContent}</div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterAuditLogs() {
            const keyword = (document.getElementById('auditSearchInput')?.value || '').toLowerCase().trim();
            if (!keyword) {
                renderAuditLogs(allLogs);
                return;
            }
            const filtered = allLogs.filter(l => 
                (l.action_type && l.action_type.toLowerCase().includes(keyword)) ||
                (JSON.stringify(l.details || {}).toLowerCase().includes(keyword)) ||
                String(l.ip_address || l.details?.ip_address || '').toLowerCase().includes(keyword)
            );
            renderAuditLogs(filtered);
        }

        window.addEventListener('hashchange', handleAdminHashRouting);
        window.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</body>
