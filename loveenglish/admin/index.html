<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抽直屬系統 - 管理控制台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col font-sans">

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl text-white font-extrabold text-sm shadow-xl hidden transition-all duration-300"></div>

    <header class="bg-[#0f172a] text-white py-3.5 px-4 shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <span class="text-2xl">⚙️</span>
                <span class="text-lg font-black tracking-wide">抽直屬系統 ． 管理控制台</span>
            </div>
            <div class="flex items-center gap-3">
                <button type="button" onclick="exportPairingsToExcel()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-black transition shadow">📥 匯出配對名單 Excel</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">

        <!-- 匯入面板 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <div class="border-b border-slate-100 pb-3">
                    <h3 class="text-base font-black text-slate-800 flex items-center gap-2">
                        <span>🌱</span> 高一名單匯入 (402, 403, 404 等)
                    </h3>
                    <p class="text-xs text-slate-400 font-bold mt-1">欄位必須包含：學號、班級、座號、姓名、性別</p>
                </div>
                <input type="file" id="fileInputG1" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                <button type="button" onclick="importStudents('G1')" id="btnImportG1" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-black transition shadow">
                    確認解析並匯入高一
                </button>
            </div>

            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <div class="border-b border-slate-100 pb-3">
                    <h3 class="text-base font-black text-slate-800 flex items-center gap-2">
                        <span>🌿</span> 高二名單匯入 (502, 503, 504 等)
                    </h3>
                    <p class="text-xs text-slate-400 font-bold mt-1">欄位必須包含：學號、班級、座號、姓名、性別</p>
                </div>
                <input type="file" id="fileInputG2" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
                <button type="button" onclick="importStudents('G2')" id="btnImportG2" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-black transition shadow">
                    確認解析並匯入高二
                </button>
            </div>
        </div>

        <!-- 學生名冊管理 -->
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-sm font-black text-slate-800">👥 全體學生資料庫名冊</h3>
                <div class="flex gap-2">
                    <select id="filterStudentGrade" onchange="renderStudentsTable()" class="px-3 py-1 bg-slate-50 border border-slate-200 rounded-lg text-xs font-black outline-none">
                        <option value="ALL">全部年級</option>
                        <option value="G1">僅高一</option>
                        <option value="G2">僅高二</option>
                    </select>
                    <button type="button" onclick="resetAllPairings()" class="px-3 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 rounded-lg text-xs font-black transition">重置配對紀錄</button>
                    <button type="button" onclick="clearAllStudents()" class="px-3 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-lg text-xs font-black transition">清空學生資料庫</button>
                </div>
            </div>
            <div class="overflow-x-auto max-h-[60vh] custom-scrollbar border border-slate-100 rounded-xl">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-slate-50 text-slate-600 font-extrabold sticky top-0 border-b border-slate-200">
                        <tr>
                            <th class="p-3">年級</th>
                            <th class="p-3">班級</th>
                            <th class="p-3">座號</th>
                            <th class="p-3">學號</th>
                            <th class="p-3">姓名</th>
                            <th class="p-3">性別</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody" class="divide-y divide-slate-100 font-bold text-slate-700">
                        <tr><td colspan="7" class="p-4 text-center text-slate-400">目前尚無學生資料。</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = "https://qpqtiavufscdfwhabnod.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ehTz6hW_jpdiO7Ht3Xq-yw_UoRl7F6M";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allStudents = [];
        let allPairings = [];

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.innerText = msg;
            t.className = `fixed top-5 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl text-white font-extrabold text-sm shadow-xl transition-all duration-300 ${isError ? 'bg-rose-500' : 'bg-emerald-600'}`;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2600);
        }

        async function loadAdminData() {
            try {
                const { data: stData } = await client.from('students').select('*').order('class_name').order('seat_no');
                allStudents = stData || [];

                const { data: pairData } = await client.from('pairings').select('*');
                allPairings = pairData || [];

                renderStudentsTable();
            } catch (err) {
                showToast("讀取資料失敗：" + err.message, true);
            }
        }

        function renderStudentsTable() {
            const tbody = document.getElementById('studentsTableBody');
            const gradeFilter = document.getElementById('filterStudentGrade')?.value || 'ALL';
            if (!tbody) return;

            let list = allStudents;
            if (gradeFilter !== 'ALL') {
                list = list.filter(s => s.grade === gradeFilter);
            }

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">尚無符合之學生資料。</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(s => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-black ${s.grade === 'G1' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}">${s.grade === 'G1' ? '高一' : '高二'}</span></td>
                    <td class="p-3">${s.class_name} 班</td>
                    <td class="p-3 font-mono">${s.seat_no ? `${s.seat_no}號` : '-'}</td>
                    <td class="p-3 font-mono text-slate-500">${s.student_no}</td>
                    <td class="p-3 font-black text-slate-900">${s.name}</td>
                    <td class="p-3">${s.gender || '-'}</td>
                    <td class="p-3 text-center">
                        <button type="button" onclick="deleteSingleStudent('${s.student_no}', '${s.name}')" class="px-2 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded text-xs font-bold transition">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteSingleStudent(studentNo, name) {
            if (!confirm(`確定要刪除學生【${name} (${studentNo})】嗎？`)) return;
            try {
                const { error } = await client.from('students').delete().eq('student_no', studentNo);
                if (error) throw error;
                showToast(`已刪除 ${name}！`);
                await loadAdminData();
            } catch (e) {
                showToast("刪除失敗：" + e.message, true);
            }
        }

        async function importStudents(targetGrade) {
            const inputId = targetGrade === 'G1' ? 'fileInputG1' : 'fileInputG2';
            const btnId = targetGrade === 'G1' ? 'btnImportG1' : 'btnImportG2';
            const fileInput = document.getElementById(inputId);
            const btn = document.getElementById(btnId);

            if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
                showToast("請先選擇要匯入的檔案！", true);
                return;
            }

            btn.disabled = true;
            btn.innerText = "解析上傳中...";

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet);

                    const payload = rows.map(r => {
                        const student_no = String(r['學號'] || r['student_no'] || '').trim();
                        const class_name = String(r['班級'] || r['class_name'] || '').trim();
                        const seat_no = parseInt(r['座號'] || r['seat_no'] || 0, 10) || null;
                        const name = String(r['姓名'] || r['name'] || '').trim();
                        const gender = String(r['性別'] || r['gender'] || '').trim();

                        return {
                            student_no,
                            grade: targetGrade,
                            class_name,
                            seat_no,
                            name,
                            gender
                        };
                    }).filter(s => s.student_no && s.name && s.class_name);

                    if (payload.length === 0) {
                        throw new Error("檔案中找不到包含「學號」、「班級」、「姓名」的有效資料！");
                    }

                    const chunkSize = 300;
                    for (let i = 0; i < payload.length; i += chunkSize) {
                        const chunk = payload.slice(i, i + chunkSize);
                        const { error } = await client.from('students').upsert(chunk, { onConflict: 'student_no' });
                        if (error) throw error;
                    }

                    showToast(`✅ 成功匯入 ${payload.length} 筆${targetGrade === 'G1' ? '高一' : '高二'}名單！`);
                    fileInput.value = '';
                    await loadAdminData();
                } catch (err) {
                    showToast("匯入失敗：" + err.message, true);
                } finally {
                    btn.disabled = false;
                    btn.innerText = targetGrade === 'G1' ? "確認解析並匯入高一" : "確認解析並匯入高二";
                }
            };

            reader.readAsArrayBuffer(file);
        }

        async function clearAllStudents() {
            if (!confirm("⚠️ 確定要清空所有學生名單與配對紀錄嗎？此動作無法復原！")) return;
            try {
                await client.from('pairings').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                await client.from('students').delete().neq('student_no', '___');
                showToast("已清空學生資料庫！");
                await loadAdminData();
            } catch (err) {
                showToast("清除失敗：" + err.message, true);
            }
        }

        async function resetAllPairings() {
            if (!confirm("確定要重置所有現存的抽籤配對記錄嗎？")) return;
            try {
                const { error } = await client.from('pairings').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                if (error) throw error;
                showToast("已重置所有直屬配對記錄！");
                await loadAdminData();
            } catch (err) {
                showToast("重置失敗：" + err.message, true);
            }
        }

        function exportPairingsToExcel() {
            if (allPairings.length === 0) {
                showToast("目前尚無配對資料可供匯出！", true);
                return;
            }

            const studentMap = {};
            allStudents.forEach(s => { studentMap[s.student_no] = s; });

            const rows = allPairings.map(p => {
                const g1 = studentMap[p.g1_student_no] || {};
                const g2 = studentMap[p.g2_student_no] || {};

                return {
                    "高一班級": g1.class_name || '',
                    "高一座號": g1.seat_no || '',
                    "高一學號": p.g1_student_no,
                    "高一姓名": g1.name || '',
                    "高二直屬班級": g2.class_name || '',
                    "高二直屬座號": g2.seat_no || '',
                    "高二直屬學號": p.g2_student_no,
                    "高二直屬姓名": g2.name || '',
                    "配對時間": new Date(p.paired_at).toLocaleString('zh-TW')
                };
            });

            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "直屬配對名單");
            XLSX.writeFile(wb, `直屬配對總名冊_${new Date().toISOString().slice(0, 10)}.xlsx`);
        }

        loadAdminData();
    </script>
</body>
</html>
