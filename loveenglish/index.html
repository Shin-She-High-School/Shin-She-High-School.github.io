                                    <option value="ALL">全部</option>
                                    <optgroup label="高一班級">
                                        <option value="402">402 班</option>
                                        <option value="403">403 班</option>
                                        <option value="404">404 班</option>

                        </thead>

                        </tbody>
                    </table>
                </div>

                <div id="unpairedCardList" class="block sm:hidden max-h-[70vh] overflow-y-auto custom-scrollbar space-y-2 w-full">
                    <div class="p-6 text-center text-xs text-slate-400 font-bold">目前沒有尚未配對之學生！</div>

    </main>

    <footer class="py-3 text-center text-xs text-slate-400 font-semibold border-t border-slate-200/60 w-full">
        © 臺中市立新社高級中學學生會 ＆ 開發團隊 版權所有
    </footer>

    <script>
        const SUPABASE_URL = "https://qpqtiavufscdfwhabnod.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ehTz6hW_jpdiO7Ht3Xq-yw_UoRl7F6M";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let clientIpPromise;

        let allStudents = [];
        let allPairings = [];
        let currentFilteredPairings = [];
        let isShowingDrawResult = false;
        let currentFilteredUnpaired = [];

        function showToast(msg, isError) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.innerText = msg;
            t.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-white font-extrabold text-xs sm:text-sm shadow-xl transition-all duration-300 ' + (isError ? 'bg-rose-500' : 'bg-emerald-600');
            t.style.display = 'block';
            setTimeout(function() { t.style.display = 'none'; }, 2800);
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function(char) {
                if (char === '&') return '&amp;';
                if (char === '<') return '&lt;';
                if (char === '>') return '&gt;';
                if (char === '"') return '&quot;';
                if (char === "'") return '&#39;';
                return char;
            });
        }

        async function getClientIp() {
            if (!clientIpPromise) {
                clientIpPromise = (async function() {
                    const services = [
                        { url: 'https://api.ipify.org?format=json', json: true },
                        { url: 'https://api64.ipify.org?format=json', json: true },
                        { url: 'https://ifconfig.co/json', json: true },
                        { url: 'https://ipapi.co/json/', json: true },
                        { url: 'https://ipwho.is/', json: true },
                        { url: 'https://api.myip.com/', json: true },
                        { url: 'https://ipinfo.io/json', json: true },
                        { url: 'https://icanhazip.com/', json: false },
                        { url: 'https://checkip.amazonaws.com/', json: false },
                        { url: 'https://ifconfig.me/ip', json: false },
                        { url: 'https://ident.me/', json: false },
                        { url: 'https://cloudflare.com/cdn-cgi/trace', json: false, trace: true }
                    ];
                    for (let attempt = 0; attempt < 2; attempt++) {
                        for (let i = 0; i < services.length; i++) {
                            const service = services[i];
                            const controller = new AbortController();
                            const timeout = setTimeout(function() { controller.abort(); }, 2000);
                            try {
                                const response = await fetch(service.url, {
                                    headers: { Accept: 'application/json' },
                                    cache: 'no-store',
                                    signal: controller.signal
                                });
                                if (!response.ok) continue;
                                const body = service.json ? await response.json() : await response.text();
                                let value = '';
                                if (service.trace) {
                                    const match = String(body).match(/(?:^|\n)ip=([^\r\n]+)/);
                                    value = match ? match[1] : '';
                                } else if (service.json) {
                                    value = body.ip || body.ipAddress || '';
                                } else {
                                    value = String(body).trim();
                                }
                                if (value && /^(?:\d{1,3}\.){3}\d{1,3}$|^[0-9a-f:]+$/i.test(String(value))) {
                                    return String(value);
                                }
                            } catch (e) {
                            } finally {
                                clearTimeout(timeout);
                            }
                        }
                    }
                    return '未知';
                })();
            }
            return clientIpPromise;
        }

        async function logAudit(actionType, details) {
            try {
                const ipAddress = await getClientIp();
                await client.from('audit_logs').insert([{
                    action_type: actionType,
                    details: details || {},
                    ip_address: ipAddress
                }]);
            } catch (error) {
            }
        }

        function setRoute(r) {
            window.location.hash = '#' + r;
        }

        function handleHashRouting() {
            const rawHash = (window.location.hash || '').replace('#', '').replace('/', '');
            let current = 'draw';
            if (rawHash === 'paired') current = 'paired';
            if (rawHash === 'unpaired') current = 'unpaired';

            const panes = document.querySelectorAll('.route-pane');
            for (let i = 0; i < panes.length; i++) {
                panes[i].classList.add('hidden');
            }

            const tabs = ['draw', 'paired', 'unpaired'];
            for (let i = 0; i < tabs.length; i++) {
                const b = document.getElementById('tabBtn_' + tabs[i]);
                if (b) b.className = "px-2.5 py-1.5 rounded-xl text-xs font-black bg-slate-800 text-slate-300 hover:text-white transition text-center";
            }

            const targetPane = document.getElementById('pane_' + current);
            if (targetPane) targetPane.classList.remove('hidden');

            const activeBtn = document.getElementById('tabBtn_' + current);
            if (activeBtn) activeBtn.className = "px-2.5 py-1.5 rounded-xl text-xs font-black bg-blue-600 text-white shadow transition text-center";

            if (current === 'draw') {
                updateDrawDashboard();
            } else if (current === 'paired') {
                renderPairingsTable();
            } else if (current === 'unpaired') {
                renderUnpairedTable();
            }
        }

        async function loadData() {
            try {
                const resStudents = await client.from('students').select('*');
                if (resStudents.error) throw resStudents.error;
                allStudents = resStudents.data || [];

                const resPairings = await client.from('pairings').select('*').order('paired_at', { ascending: false });
                if (resPairings.error) throw resPairings.error;
                allPairings = resPairings.data || [];

                handleHashRouting();
            } catch (err) {
                showToast("連線讀取失敗：" + err.message, true);
            }
        }

        function checkPhaseOneCompletion() {
            const targetClasses = ['402', '403', '404'];
            const allTargetG1 = allStudents.filter(function(s) {
                return s.grade === 'G1' && targetClasses.some(function(c) {
                    return s.class_name && s.class_name.indexOf(c) !== -1;
                });
            });
            const pairedG1Set = new Set(allPairings.map(function(p) { return p.g1_student_no; }));
            const uncompletedG1 = allTargetG1.filter(function(s) {
                return !pairedG1Set.has(s.student_no);
            });
            return {
                isCompleted: uncompletedG1.length === 0,
                uncompletedCount: uncompletedG1.length,
                totalTargetG1: allTargetG1.length
            };
        }

        function updateDrawDashboard() {
            const targetClassesG1 = ['402', '403', '404'];
            const targetClassesG2 = ['502', '503', '504'];

            const g1Total = allStudents.filter(function(s) {
                return s.grade === 'G1' && targetClassesG1.some(function(c) {
                    return s.class_name && s.class_name.indexOf(c) !== -1;
                });
            }).length;

            const g2Total = allStudents.filter(function(s) {
                return s.grade === 'G2' && targetClassesG2.some(function(c) {
                    return s.class_name && s.class_name.indexOf(c) !== -1;
                });
            }).length;

            const pairedCount = allPairings.length;
            const pairedG2Set = new Set(allPairings.map(function(p) { return p.g2_student_no; }));
            const g2Remaining = allStudents.filter(function(s) {
                return s.grade === 'G2' && targetClassesG2.some(function(c) {
                    return s.class_name && s.class_name.indexOf(c) !== -1;
                }) && !pairedG2Set.has(s.student_no);
            }).length;

            const elG1 = document.getElementById('statG1Count');
            const elG2 = document.getElementById('statG2Count');
            const elPaired = document.getElementById('statPairedCount');
            const elG2Rem = document.getElementById('statG2Remaining');

            if (elG1) elG1.innerText = g1Total;
            if (elG2) elG2.innerText = g2Total;
            if (elPaired) elPaired.innerText = pairedCount;
            if (elG2Rem) elG2Rem.innerText = g2Remaining;

            const check = checkPhaseOneCompletion();
            const stageBox = document.getElementById('stageNoticeBox');
            const stageText = document.getElementById('stageNoticeText');
            const stageRemText = document.getElementById('stageG1RemainingText');

        function getEligibleG2Students() {
            const pairedG2Nos = new Set(allPairings.map(function(p) { return p.g2_student_no; }));
            const allG2 = allStudents.filter(function(s) {
                return s.grade === 'G2' && !pairedG2Nos.has(s.student_no);
            });
            return allG2.filter(function(s) {
                return s.class_name && (s.class_name.indexOf('502') !== -1 || s.class_name.indexOf('503') !== -1 || s.class_name.indexOf('504') !== -1);
            });
        }

        function getTargetG1Students() {
            const pairingCounts = {};
            for (let i = 0; i < allPairings.length; i++) {
                const sid = allPairings[i].g1_student_no;
                pairingCounts[sid] = (pairingCounts[sid] || 0) + 1;
            }
            const validG1 = allStudents.filter(function(s) {
                return s.grade === 'G1' && s.class_name && (
                    s.class_name.indexOf('402') !== -1 ||
                    s.class_name.indexOf('403') !== -1 ||
                    s.class_name.indexOf('404') !== -1
                );
            });
            if (validG1.length === 0) return [];
            let minCount = 999999;
            for (let i = 0; i < validG1.length; i++) {
                const count = pairingCounts[validG1[i].student_no] || 0;
                if (count < minCount) minCount = count;
            }
            return validG1.filter(function(s) {
                return (pairingCounts[s.student_no] || 0) === minCount;
            });
        }

        function shuffle(items) {
            const result = items.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = result[i];
                result[i] = result[j];
                result[j] = temp;
            }
            return result;
        }

        async function startBatchDraw() {
            const selectedClass = document.getElementById('drawClassSelect').value;
            const phaseOne = checkPhaseOneCompletion();
            const classG1 = allStudents.filter(function(s) {
                return s.grade === 'G1' && s.class_name && s.class_name.indexOf(selectedClass) !== -1;
            });

            if (!phaseOne.isCompleted && classG1.length === 0) {
                showToast("高一 " + selectedClass + " 班尚未匯入學生名冊！", true);
                return;
            }

            const availableG2 = getEligibleG2Students();
            if (availableG2.length === 0) {
                showToast("高二已配對完畢，無剩餘名額！", true);
                return;
            }

            const pairedG1Set = new Set(allPairings.map(function(p) { return p.g1_student_no; }));
            const unpairedInThisClass = classG1.filter(function(s) { return !pairedG1Set.has(s.student_no); });

            if (!phaseOne.isCompleted && unpairedInThisClass.length === 0) {
                showToast("【第一階段進行中】" + selectedClass + " 班高一已全數配對！請先至其他尚未抽完的班級進行抽籤！", true);
                return;
            }

            const shuffledG2 = shuffle(availableG2);
            let targetG1Students = [];

            if (phaseOne.isCompleted) {
                const candidates = shuffle(getTargetG1Students());
                if (candidates.length === 0) {
                    showToast("目前沒有可供抽籤的高一學生！", true);
                    return;
                }
                for (let i = 0; i < shuffledG2.length; i++) {
                    targetG1Students.push(candidates[i % candidates.length]);
                }
            } else {
                targetG1Students = unpairedInThisClass;
            }

            const drawCount = Math.min(targetG1Students.length, shuffledG2.length);
            if (drawCount === 0) {
                showToast("目前沒有可供抽籤的高一學生！", true);
                return;
            }

            const pairingsPayload = [];
            const resultList = [];
            for (let i = 0; i < drawCount; i++) {
                const g1 = targetG1Students[i];
                const g2 = shuffledG2[i];
                pairingsPayload.push({
                    g1_student_no: g1.student_no,
                    g2_student_no: g2.student_no
                });
                resultList.push({ g1: g1, g2: g2 });
            }

            const btn = document.getElementById('btnBatchDraw');
            if (btn) btn.disabled = true;

            try {
                const res = await client.from('pairings').insert(pairingsPayload);
                if (res.error) throw res.error;

                const isExtra = phaseOne.isCompleted;
                const msg = isExtra
                    ? "🎉 已從所有高一隨機完成加抽（共 " + pairingsPayload.length + " 組）！"
                    : "🎉 " + selectedClass + " 班完成批次第一輪抽配（共 " + pairingsPayload.length + " 組）！";

                showToast(msg);
                document.getElementById('drawStatusText').innerText = isExtra
                    ? "✨ 已從所有高一隨機完成超額加抽！本次共完成 " + pairingsPayload.length + " 組直屬："
                    : "✨ 已完成 " + selectedClass + " 班自動抽配！本次共完成 " + pairingsPayload.length + " 組直屬：";

                let html = '<div class="w-full max-h-96 overflow-y-auto custom-scrollbar p-1 space-y-2 text-left">';
                for (let i = 0; i < resultList.length; i++) {
                    const item = resultList[i];
                    html += '<div class="grid grid-cols-[1fr_auto_1fr] items-center gap-1 sm:gap-2 bg-white border border-slate-200 rounded-xl shadow-xs p-2 text-xs w-full">';
                    html += '<div class="p-2 rounded-md bg-blue-50 border border-blue-100 overflow-hidden">';
                    html += '<div class="font-black text-blue-800 text-xs sm:text-sm break-all">' + escapeHtml(item.g1.name) + '</div>';
                    html += '<div class="mt-0.5 text-[10px] text-slate-600 break-all">' + escapeHtml(item.g1.class_name) + ' ｜ ' + (item.g1.seat_no ? escapeHtml(item.g1.seat_no) + '號' : '-') + '</div>';
                    html += '<div class="text-[9px] text-slate-400 font-mono break-all">' + escapeHtml(item.g1.student_no) + '</div>';
                    html += '</div>';
                    html += '<div class="text-blue-400 text-sm font-black px-1 text-center">➔</div>';
                    html += '<div class="p-2 rounded-md bg-emerald-50 border border-emerald-100 overflow-hidden text-right">';
                    html += '<div class="font-black text-emerald-800 text-xs sm:text-sm break-all">' + escapeHtml(item.g2.name) + '</div>';
                    html += '<div class="mt-0.5 text-[10px] text-slate-600 break-all">' + escapeHtml(item.g2.class_name) + ' ｜ ' + (item.g2.seat_no ? escapeHtml(item.g2.seat_no) + '號' : '-') + '</div>';
                    html += '<div class="text-[9px] text-slate-400 font-mono break-all">' + escapeHtml(item.g2.student_no) + '</div>';
                    html += '</div></div>';
                }
                html += '</div>';

                document.getElementById('drawDisplayBox').innerHTML = html;
                isShowingDrawResult = true;

                const auditClassName = isExtra ? "所有目標高一" : selectedClass;
                await logAudit(isExtra ? "全體高一隨機超額加抽" : "班級批次抽直屬", {
                    class: auditClassName,
                    count: pairingsPayload.length
                });
                await loadData();
            } catch (err) {
                showToast("批次配對失敗：" + err.message, true);
            } finally {
                if (btn) btn.disabled = false;
            }
        }

                cardHtml += '</div>';
                cardHtml += '<div class="shrink-0 flex items-center gap-1.5">';
                cardHtml += '<span class="px-1.5 py-0.5 rounded text-[10px] font-black ' + (isG1 ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700') + '">' + (isG1 ? '高一' : '高二') + '</span>';
                cardHtml += statusTag;
                cardHtml += '</div></div>';
            }
            tbody.innerHTML = tableHtml;
            cardList.innerHTML = cardHtml;
        }

        function exportFilteredUnpaired() {
            if (currentFilteredUnpaired.length === 0) {
                showToast("無未配對名冊可供匯出！", true);
                return;
            }
            const rows = currentFilteredUnpaired.map(function(s) {
                return {
                    "班級": s.class_name,
                    "座號": s.seat_no || '',
                    "年級": s.grade === 'G1' ? '高一' : '高二',
                    "姓名": s.name,
                    "學號": s.student_no,
                    "性別": s.gender || '',
                    "狀態": s.grade === 'G1' ? '尚無直屬' : '待抽籤池'
                };
            });

            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "未被抽取名冊");
            XLSX.writeFile(wb, "未被抽取學生名冊_" + new Date().toISOString().slice(0, 10) + ".xlsx");
        }

        window.setRoute = setRoute;
        window.updateDrawSelection = updateDrawSelection;
        window.startBatchDraw = startBatchDraw;
        window.renderPairingsTable = renderPairingsTable;
        window.exportFilteredPairings = exportFilteredPairings;
        window.renderUnpairedTable = renderUnpairedTable;
        window.exportFilteredUnpaired = exportFilteredUnpaired;

        window.addEventListener('hashchange', handleHashRouting);
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
