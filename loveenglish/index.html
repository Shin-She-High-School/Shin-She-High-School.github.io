<!DOCTYPE html>

<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col justify-between font-sans w-full max-w-full overflow-x-hidden">

        <section id="pane_unpaired" class="route-pane hidden space-y-4 sm:space-y-6 w-full">
            <div class="bg-white p-3.5 sm:p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3 sm:space-y-4 w-full">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5 border-b border-slate-100 pb-3">
                    <h2 class="text-base sm:text-lg font-black text-slate-900 flex items-center gap-2">

                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 w-full sm:w-auto">

                                    <option value="ALL">全部</option>
                                    <optgroup label="高一班級">
                                        <option value="401">401 班</option>
                                        <option value="402">402 班</option>
                                        <option value="403">403 班</option>
                                        <option value="404">404 班</option>
                                    </optgroup>
                                    <optgroup label="高二班級">
                                        <option value="501">501 班</option>
                                        <option value="502">502 班</option>

                                        <option value="504">504 班</option>
                                    </optgroup>

                            <button type="button" onclick="exportFilteredUnpaired()" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-black transition shadow">📥 匯出 Excel</button>

                <div class="hidden sm:block max-h-[70vh] overflow-y-auto custom-scrollbar border border-slate-100 rounded-xl w-full">
                    <table class="w-full text-left text-xs border-collapse table-fixed">

                            <tr>
                                <th class="p-2.5 w-[14%]">班級</th>
                                <th class="p-2.5 w-[10%]">座號</th>
                                <th class="p-2.5 w-[12%]">年級</th>
                                <th class="p-2.5 w-[18%]">姓名</th>
                                <th class="p-2.5 w-[20%]">學號</th>
                                <th class="p-2.5 w-[10%]">性別</th>
                                <th class="p-2.5 w-[16%]">抽籤狀態</th>
                            </tr>
                        </thead>
                        <tbody id="unpairedTableBody" class="divide-y divide-slate-100 font-bold text-slate-700">

                    </table>
                </div>

                <div id="unpairedCardList" class="block sm:hidden max-h-[70vh] overflow-y-auto custom-scrollbar space-y-2 w-full">
                    <div class="p-6 text-center text-xs text-slate-400 font-bold">目前沒有尚未配對之學生！</div>

    </main>

    <footer class="py-3 text-center text-xs text-slate-400 font-semibold border-t border-slate-200/60 w-full">
        © 臺中市立新社高級中學學生會 ＆ 開發團隊 版權所有
    </footer>

    <script>
        const SUPABASE_URL = "https://qpqtiavufscdfwhabnod.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ehTz6hW_jpdiO7Ht3Xq-yw_UoRl7F6M";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allStudents = [];
        let allPairings = [];
        let currentFilteredPairings = [];
        let currentFilteredUnpaired = [];

        function showToast(msg, isError) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.innerText = msg;
            t.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-white font-extrabold text-xs sm:text-sm shadow-xl transition-all duration-300 ' + (isError ? 'bg-rose-500' : 'bg-emerald-600');
            t.style.display = 'block';
            setTimeout(function() { t.style.display = 'none'; }, 2800);
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function(char) {
                if (char === '&') return '&amp;';
                if (char === '<') return '&lt;';
                if (char === '>') return '&gt;';
                if (char === '"') return '&quot;';
                if (char === "'") return '&#39;';
                return char;
            });
        }

        function setRoute(r) {
            window.location.hash = '#' + r;
        }

        function handleHashRouting() {
            const rawHash = (window.location.hash || '').replace('#', '').replace('/', '');
            let current = 'draw';
            if (rawHash === 'paired') current = 'paired';
            if (rawHash === 'unpaired') current = 'unpaired';

            const panes = document.querySelectorAll('.route-pane');
            for (let i = 0; i < panes.length; i++) {
                panes[i].classList.add('hidden');
            }

            const tabs = ['draw', 'paired', 'unpaired'];
            for (let i = 0; i < tabs.length; i++) {
                const b = document.getElementById('tabBtn_' + tabs[i]);
                if (b) b.className = "px-2.5 py-1.5 rounded-xl text-xs font-black bg-slate-800 text-slate-300 hover:text-white transition text-center";
            }

            const targetPane = document.getElementById('pane_' + current);
            if (targetPane) targetPane.classList.remove('hidden');

            const activeBtn = document.getElementById('tabBtn_' + current);
            if (activeBtn) activeBtn.className = "px-2.5 py-1.5 rounded-xl text-xs font-black bg-blue-600 text-white shadow transition text-center";

            if (current === 'draw') {
                updateDrawDashboard();
            } else if (current === 'paired') {
                renderPairingsTable();
            } else if (current === 'unpaired') {
                renderUnpairedTable();
            }
        }

        async function loadData() {
            try {
                const resStudents = await client.from('students').select('*');
                if (resStudents.error) throw resStudents.error;
                allStudents = resStudents.data || [];

                const resPairings = await client.from('pairings').select('*').order('paired_at', { ascending: false });
                if (resPairings.error) throw resPairings.error;
                allPairings = resPairings.data || [];

                handleHashRouting();
            } catch (err) {
                showToast("連線讀取失敗：" + err.message, true);
            }
        }

        function updateDrawDashboard() {
            const g1Total = allStudents.filter(function(s) { return s.grade === 'G1'; }).length;
            const g2Total = allStudents.filter(function(s) { return s.grade === 'G2'; }).length;
            const pairedCount = allPairings.length;
            const pairedG2Set = new Set(allPairings.map(function(p) { return p.g2_student_no; }));
            const g2Remaining = allStudents.filter(function(s) {
                return s.grade === 'G2' && !pairedG2Set.has(s.student_no);
            }).length;

            const elG1 = document.getElementById('statG1Count');
            const elG2 = document.getElementById('statG2Count');
            const elPaired = document.getElementById('statPairedCount');
            const elG2Rem = document.getElementById('statG2Remaining');

            if (elG1) elG1.innerText = g1Total;
            if (elG2) elG2.innerText = g2Total;
            if (elPaired) elPaired.innerText = pairedCount;
            if (elG2Rem) elG2Rem.innerText = g2Remaining;

            updateDrawSelection();
        }

        function updateDrawSelection() {
            const selectEl = document.getElementById('drawClassSelect');
            const selectedClass = selectEl ? selectEl.value : '401';
            const displayEl = document.getElementById('drawDisplayBox');
            const statusEl = document.getElementById('drawStatusText');
            if (!selectedClass || !displayEl || !statusEl) return;

            const studentMap = {};
            for (let i = 0; i < allStudents.length; i++) {
                studentMap[allStudents[i].student_no] = allStudents[i];
            }

            const classPairings = allPairings.filter(function(pairing) {
                const g1 = studentMap[pairing.g1_student_no];
                return g1 && String(g1.class_name || '').indexOf(selectedClass) !== -1;
            }).sort(function(a, b) {
                const seatA = parseInt(studentMap[a.g1_student_no]?.seat_no, 10) || 0;
                const seatB = parseInt(studentMap[b.g1_student_no]?.seat_no, 10) || 0;
                return seatA - seatB;
            });

            statusEl.innerText = classPairings.length > 0 ? selectedClass + " 班配對結果（共 " + classPairings.length + " 組）" : selectedClass + " 班無配對資料";

            if (classPairings.length === 0) {
                displayEl.innerHTML = '<div class="text-sm font-bold text-slate-400">目前尚無此班級配對紀錄</div>';
                return;
            }

            let html = '<div class="w-full max-h-96 overflow-y-auto custom-scrollbar p-1 sm:p-2 space-y-2 text-left">';
            for (let i = 0; i < classPairings.length; i++) {
                const pairing = classPairings[i];
                const g1 = studentMap[pairing.g1_student_no] || {};
                const g2 = studentMap[pairing.g2_student_no] || {};
                html += '<div class="grid grid-cols-[1fr_auto_1fr] items-center gap-1 sm:gap-2 bg-white border border-slate-200 rounded-xl shadow-xs p-2 sm:p-3 text-xs w-full">';
                html += '<div class="p-2 sm:p-2.5 rounded-lg bg-blue-50 border border-blue-100 overflow-hidden">';
                html += '<div class="font-black text-blue-800 text-xs sm:text-sm break-all">' + escapeHtml(g1.name || '未知') + '</div>';
                html += '<div class="mt-0.5 text-[10px] text-slate-600 leading-tight break-all">' + escapeHtml(g1.class_name || '-') + ' ｜ ' + (g1.seat_no ? escapeHtml(g1.seat_no) + '號' : '-') + '</div>';
                html += '</div>';
                html += '<div class="text-blue-400 text-sm sm:text-base font-black px-1 text-center">➔</div>';
                html += '<div class="p-2 sm:p-2.5 rounded-lg bg-emerald-50 border border-emerald-100 overflow-hidden text-right">';
                html += '<div class="font-black text-emerald-800 text-xs sm:text-sm break-all">' + escapeHtml(g2.name || '未知') + '</div>';
                html += '<div class="mt-0.5 text-[10px] text-slate-600 leading-tight break-all">' + escapeHtml(g2.class_name || '-') + ' ｜ ' + (g2.seat_no ? escapeHtml(g2.seat_no) + '號' : '-') + '</div>';
                html += '</div></div>';
            }
            html += '</div>';
            displayEl.innerHTML = html;
        }

        function renderPairingsTable() {
            const tbody = document.getElementById('pairingsTableBody');
            const cardList = document.getElementById('pairingsCardList');
            const countBadge = document.getElementById('pairedCountBadge');
            const classFilter = document.getElementById('filterPairingClass')?.value || 'ALL';
            if (!tbody || !cardList) return;

            const studentMap = {};
            for (let i = 0; i < allStudents.length; i++) {
                studentMap[allStudents[i].student_no] = allStudents[i];
            }

            currentFilteredPairings = allPairings.filter(function(p) {
                const g1 = studentMap[p.g1_student_no] || {};
                const g2 = studentMap[p.g2_student_no] || {};
                if (classFilter !== 'ALL' &&
                    String(g1.class_name || '').indexOf(classFilter) === -1 &&
                    String(g2.class_name || '').indexOf(classFilter) === -1) return false;
                return true;
            });

            currentFilteredPairings.sort(function(a, b) {
                const g1A = studentMap[a.g1_student_no] || { class_name: '', seat_no: 0 };
                const g1B = studentMap[b.g1_student_no] || { class_name: '', seat_no: 0 };
                const g2A = studentMap[a.g2_student_no] || { class_name: '', seat_no: 0 };
                const g2B = studentMap[b.g2_student_no] || { class_name: '', seat_no: 0 };

                const selectedA = classFilter !== 'ALL' && String(g1A.class_name || '').indexOf(classFilter) !== -1 ? g1A : g2A;
                const selectedB = classFilter !== 'ALL' && String(g1B.class_name || '').indexOf(classFilter) !== -1 ? g1B : g2B;
                const classA = classFilter === 'ALL' ? g1A.class_name : selectedA.class_name;
                const classB = classFilter === 'ALL' ? g1B.class_name : selectedB.class_name;
                const classCompare = String(classA || '').localeCompare(String(classB || ''), undefined, { numeric: true });
                if (classCompare !== 0) return classCompare;
                const sortSeatA = parseInt((classFilter === 'ALL' ? g1A : selectedA).seat_no, 10) || 0;
                const sortSeatB = parseInt((classFilter === 'ALL' ? g1B : selectedB).seat_no, 10) || 0;
                return sortSeatA - sortSeatB;
            });

            if (countBadge) countBadge.innerText = "共 " + currentFilteredPairings.length + " 組";

            if (currentFilteredPairings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" class="p-6 text-center text-slate-400">目前無符合條件之配對記錄。</td></tr>';
                cardList.innerHTML = '<div class="p-6 text-center text-xs text-slate-400 font-bold">目前無符合條件之配對記錄。</div>';
                return;
            }

            let tableHtml = '';
            let cardHtml = '';
            for (let i = 0; i < currentFilteredPairings.length; i++) {
                const p = currentFilteredPairings[i];
                const g1 = studentMap[p.g1_student_no] || { name: '未知', class_name: '-', seat_no: '-' };
                const g2 = studentMap[p.g2_student_no] || { name: '未知', class_name: '-', seat_no: '-' };

                tableHtml += '<tr class="hover:bg-slate-50 transition">';
                tableHtml += '<td class="p-2.5 font-bold break-all">' + escapeHtml(g1.class_name) + '</td>';
                tableHtml += '<td class="p-2.5 font-mono text-slate-800">' + (g1.seat_no ? escapeHtml(g1.seat_no) : '-') + '</td>';
                tableHtml += '<td class="p-2.5 font-black text-slate-900 break-all">' + escapeHtml(g1.name) + '</td>';
                tableHtml += '<td class="p-2.5 font-mono text-slate-500 break-all">' + escapeHtml(p.g1_student_no) + '</td>';
                tableHtml += '<td class="p-2.5">' + escapeHtml(g1.gender || '-') + '</td>';
                tableHtml += '<td class="p-2.5 text-center text-blue-600 font-black">➔</td>';
                tableHtml += '<td class="p-2.5 font-bold break-all">' + escapeHtml(g2.class_name) + '</td>';
                tableHtml += '<td class="p-2.5 font-mono text-slate-800">' + (g2.seat_no ? escapeHtml(g2.seat_no) : '-') + '</td>';
                tableHtml += '<td class="p-2.5 font-black text-slate-900 break-all">' + escapeHtml(g2.name) + '</td>';
                tableHtml += '<td class="p-2.5 font-mono text-slate-500 break-all">' + escapeHtml(p.g2_student_no) + '</td>';
                tableHtml += '<td class="p-2.5">' + escapeHtml(g2.gender || '-') + '</td>';
                tableHtml += '</tr>';

                cardHtml += '<div class="p-2.5 rounded-xl border border-slate-200 bg-white shadow-xs w-full">';
                cardHtml += '<div class="grid grid-cols-[1fr_auto_1fr] items-center gap-1.5 text-xs w-full">';
                cardHtml += '<div class="p-2 rounded-lg bg-blue-50/70 border border-blue-100 overflow-hidden">';
                cardHtml += '<div class="font-black text-blue-900 text-xs break-all">' + escapeHtml(g1.name) + ' <span class="text-[10px] text-blue-600 font-normal">(' + escapeHtml(g1.gender || '-') + ')</span></div>';
                cardHtml += '<div class="text-[10px] text-slate-600 mt-0.5 break-all">' + escapeHtml(g1.class_name) + ' 班 ｜ ' + (g1.seat_no ? escapeHtml(g1.seat_no) + '號' : '-') + '</div>';
                cardHtml += '</div>';
                cardHtml += '<div class="text-blue-500 text-xs font-black text-center px-1">➔</div>';
                cardHtml += '<div class="p-2 rounded-lg bg-emerald-50/70 border border-emerald-100 overflow-hidden text-right">';
                cardHtml += '<div class="font-black text-emerald-900 text-xs break-all">' + escapeHtml(g2.name) + ' <span class="text-[10px] text-emerald-600 font-normal">(' + escapeHtml(g2.gender || '-') + ')</span></div>';
                cardHtml += '<div class="text-[10px] text-slate-600 mt-0.5 break-all">' + escapeHtml(g2.class_name) + ' 班 ｜ ' + (g2.seat_no ? escapeHtml(g2.seat_no) + '號' : '-') + '</div>';
                cardHtml += '</div></div></div>';
            }
            tbody.innerHTML = tableHtml;
            cardList.innerHTML = cardHtml;
        }

        function exportFilteredPairings() {
            if (currentFilteredPairings.length === 0) {
                showToast("無配對名冊可供匯出！", true);
                return;
            }
            const studentMap = {};
            for (let i = 0; i < allStudents.length; i++) {
                studentMap[allStudents[i].student_no] = allStudents[i];
            }

            const rows = currentFilteredPairings.map(function(p) {
                const g1 = studentMap[p.g1_student_no] || {};
                const g2 = studentMap[p.g2_student_no] || {};
                return {
                    "高一班級": g1.class_name || '',
                    "高一座號": g1.seat_no || '',
                    "高一姓名": g1.name || '',
                    "高一學號": p.g1_student_no,
                    "高一性別": g1.gender || '',
                    "關係": "➔",
                    "高二班級": g2.class_name || '',
                    "高二座號": g2.seat_no || '',
                    "高二直屬姓名": g2.name || '',
                    "高二學號": p.g2_student_no,
                    "高二性別": g2.gender || ''
                };
            });

            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "已配對清冊");
            XLSX.writeFile(wb, "直屬配對清冊_" + new Date().toISOString().slice(0, 10) + ".xlsx");
        }

        function renderUnpairedTable() {
            const tbody = document.getElementById('unpairedTableBody');
            const cardList = document.getElementById('unpairedCardList');
            const countBadge = document.getElementById('unpairedCountBadge');
            const gradeFilter = document.getElementById('filterUnpairedGrade')?.value || 'ALL';
            const classFilter = document.getElementById('filterUnpairedClass')?.value || 'ALL';
            if (!tbody || !cardList) return;

            const pairedG1Set = new Set(allPairings.map(function(p) { return p.g1_student_no; }));
            const pairedG2Set = new Set(allPairings.map(function(p) { return p.g2_student_no; }));

            let list = allStudents.filter(function(s) {
                if (s.grade === 'G1' && pairedG1Set.has(s.student_no)) return false;
                if (s.grade === 'G2' && pairedG2Set.has(s.student_no)) return false;
                return true;
            });

            if (gradeFilter !== 'ALL') {
                list = list.filter(function(s) { return s.grade === gradeFilter; });
            }
            if (classFilter !== 'ALL') {
                list = list.filter(function(s) { return s.class_name && s.class_name.indexOf(classFilter) !== -1; });
            }

            list.sort(function(a, b) {
                const seatA = parseInt(a.seat_no, 10) || 0;
                const seatB = parseInt(b.seat_no, 10) || 0;
                if (classFilter !== 'ALL') {
                    return seatA - seatB;
                } else {
                    const classCompare = String(a.class_name || '').localeCompare(String(b.class_name || ''), undefined, { numeric: true });
                    if (classCompare !== 0) return classCompare;
                    return seatA - seatB;
                }
            });

            currentFilteredUnpaired = list;
            if (countBadge) countBadge.innerText = "共 " + currentFilteredUnpaired.length + " 人";

            if (currentFilteredUnpaired.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-400">目前沒有尚未配對之學生！</td></tr>';
                cardList.innerHTML = '<div class="p-6 text-center text-xs text-slate-400 font-bold">目前沒有尚未配對之學生！</div>';
                return;
            }

            let tableHtml = '';
            let cardHtml = '';
            for (let i = 0; i < currentFilteredUnpaired.length; i++) {
                const s = currentFilteredUnpaired[i];
                const isG1 = s.grade === 'G1';
                const statusTag = isG1 
                    ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-black bg-blue-50 text-blue-700 border border-blue-200">未配對</span>'
                    : '<span class="px-1.5 py-0.5 rounded text-[10px] font-black bg-amber-50 text-amber-700 border border-amber-200">待抽籤</span>';

                tableHtml += '<tr class="hover:bg-slate-50 transition">';
                tableHtml += '<td class="p-2.5 font-bold text-slate-800 break-all">' + escapeHtml(s.class_name) + ' 班</td>';
                tableHtml += '<td class="p-2.5 font-mono text-slate-800">' + (s.seat_no ? escapeHtml(s.seat_no) : '-') + '</td>';
                tableHtml += '<td class="p-2.5"><span class="px-1.5 py-0.5 rounded text-[10px] font-black ' + (isG1 ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700') + '">' + (isG1 ? '高一' : '高二') + '</span></td>';
                tableHtml += '<td class="p-2.5 font-black text-slate-900 break-all">' + escapeHtml(s.name) + '</td>';
                tableHtml += '<td class="p-2.5 font-mono text-slate-500 break-all">' + escapeHtml(s.student_no) + '</td>';
                tableHtml += '<td class="p-2.5">' + escapeHtml(s.gender || '-') + '</td>';
                tableHtml += '<td class="p-2.5">' + statusTag + '</td>';
                tableHtml += '</tr>';

                cardHtml += '<div class="p-2.5 rounded-xl border border-slate-200 bg-white shadow-xs flex items-center justify-between text-xs gap-2 w-full">';
                cardHtml += '<div class="overflow-hidden">';
                cardHtml += '<div class="font-black text-slate-900 text-xs break-all">' + escapeHtml(s.name) + ' <span class="text-[10px] font-mono text-slate-400">(' + escapeHtml(s.student_no) + ')</span></div>';
                cardHtml += '<div class="text-[10px] text-slate-500 mt-0.5 break-all">' + escapeHtml(s.class_name) + ' 班 ｜ ' + (s.seat_no ? escapeHtml(s.seat_no) + '號' : '-') + ' ｜ 性別: ' + escapeHtml(s.gender || '-') + '</div>';
                cardHtml += '</div>';
                cardHtml += '<div class="shrink-0 flex items-center gap-1.5">';
                cardHtml += '<span class="px-1.5 py-0.5 rounded text-[10px] font-black ' + (isG1 ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700') + '">' + (isG1 ? '高一' : '高二') + '</span>';
                cardHtml += statusTag;
                cardHtml += '</div></div>';
            }
            tbody.innerHTML = tableHtml;
            cardList.innerHTML = cardHtml;
        }

        function exportFilteredUnpaired() {
            if (currentFilteredUnpaired.length === 0) {
                showToast("無未配對名冊可供匯出！", true);
                return;
            }
            const rows = currentFilteredUnpaired.map(function(s) {
                return {
                    "班級": s.class_name,
                    "座號": s.seat_no || '',
                    "年級": s.grade === 'G1' ? '高一' : '高二',
                    "姓名": s.name,
                    "學號": s.student_no,
                    "性別": s.gender || '',
                    "狀態": s.grade === 'G1' ? '尚無直屬' : '待抽籤池'
                };
            });

            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "未被抽取名冊");
            XLSX.writeFile(wb, "未被抽取學生名冊_" + new Date().toISOString().slice(0, 10) + ".xlsx");
        }

        window.setRoute = setRoute;
        window.updateDrawSelection = updateDrawSelection;
        window.renderPairingsTable = renderPairingsTable;
        window.exportFilteredPairings = exportFilteredPairings;
        window.renderUnpairedTable = renderUnpairedTable;
        window.exportFilteredUnpaired = exportFilteredUnpaired;

        window.addEventListener('hashchange', handleHashRouting);
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
