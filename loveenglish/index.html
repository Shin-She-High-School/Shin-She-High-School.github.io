<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新社高中直屬抽籤系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col justify-between font-sans">

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl text-white font-extrabold text-sm shadow-xl hidden transition-all duration-300"></div>

    <header class="bg-[#0f172a] text-white py-3.5 px-4 shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-2.5">
                <span class="text-2xl" id="headerIcon">🎯</span>
                <span class="text-lg font-black tracking-wide" id="headerTitle">新社高中直屬抽籤系統</span>
            </div>
            <nav class="flex gap-2">
                <button type="button" onclick="setRoute('draw')" id="tabBtn_draw" class="px-4 py-1.5 rounded-xl text-xs font-black bg-blue-600 text-white shadow transition">🎯 抽籤</button>
                <button type="button" onclick="setRoute('paired')" id="tabBtn_paired" class="px-4 py-1.5 rounded-xl text-xs font-black bg-slate-800 text-slate-300 hover:text-white transition">📋 已配對名單</button>
                <button type="button" onclick="setRoute('unpaired')" id="tabBtn_unpaired" class="px-4 py-1.5 rounded-xl text-xs font-black bg-slate-800 text-slate-300 hover:text-white transition">⏳ 未抽取名單</button>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6">

        <section id="pane_draw" class="route-pane hidden space-y-6">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm text-center">
                    <span class="text-xs text-slate-400 font-bold">高一總人數</span>
                    <div id="statG1Count" class="text-2xl font-black text-slate-800 mt-1">0</div>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm text-center">
                    <span class="text-xs text-slate-400 font-bold">高二總人數</span>
                    <div id="statG2Count" class="text-2xl font-black text-slate-800 mt-1">0</div>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm text-center">
                    <span class="text-xs text-slate-400 font-bold">高一已配對</span>
                    <div id="statPairedCount" class="text-2xl font-black text-emerald-600 mt-1">0</div>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm text-center">
                    <span class="text-xs text-slate-400 font-bold">高二未配對</span>
                    <div id="statG2Remaining" class="text-2xl font-black text-amber-600 mt-1">0</div>
                </div>
            </div>

            <div id="stageNoticeBox" class="p-4 rounded-2xl border bg-blue-50 border-blue-200 text-blue-900 text-xs font-bold flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-blue-600"></span>
                    <span id="stageNoticeText">目前階段：高一各班各抽一位高二直屬</span>
                </div>
                <span id="stageG1RemainingText" class="text-blue-700 font-black">高一尚有 0 人未抽到直屬</span>
            </div>

            <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                    <div>
                        <h2 class="text-xl font-black text-slate-900 flex items-center gap-2">
                            <span class="w-2.5 h-5 bg-blue-600 rounded-full"></span>
                            現場抽籤配對
                        </h2>
                    </div>
                    <div class="flex items-center gap-3">
                        <label class="text-xs font-black text-slate-600">請選擇高一班級：</label>
                        <select id="drawClassSelect" class="px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-black outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="402">402 班</option>
                            <option value="403">403 班</option>
                            <option value="404">404 班</option>
                        </select>
                    </div>
                </div>

                <div class="py-6 sm:py-8 px-4 bg-slate-50 rounded-2xl border border-dashed border-slate-200 text-center space-y-4">
                    <div id="drawStatusText" class="text-xs sm:text-sm font-black text-slate-500">請選取高一班級並開始進行抽籤</div>
                    <div id="drawDisplayBox" class="min-h-[140px] flex items-center justify-center">
                        <span class="text-4xl text-slate-300 font-black">-</span>
                    </div>
                </div>

                <div class="flex flex-wrap gap-3 justify-end pt-2">
                    <button type="button" onclick="startBatchDraw()" id="btnBatchDraw" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-black transition shadow-md shadow-indigo-600/20">
                        ⚡ 開始抽籤
                    </button>
                </div>
            </div>
        </section>

        <section id="pane_paired" class="route-pane hidden space-y-6">
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-4">
                    <div>
                        <h2 class="text-lg font-black text-slate-900 flex items-center gap-2">
                            <span class="w-2.5 h-5 bg-emerald-600 rounded-full"></span>
                            直屬配對名冊
                        </h2>
                    </div>

                    <div class="flex flex-wrap items-center gap-2.5">
                        <div class="flex items-center gap-1.5">
                            <label class="text-xs font-black text-slate-600">高一：</label>
                            <select id="filterG1Class" onchange="renderPairingsTable()" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-black outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="ALL">高一</option>
                                <option value="402">402 班</option>
                                <option value="403">403 班</option>
                                <option value="404">404 班</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <label class="text-xs font-black text-slate-600">高二：</label>
                            <select id="filterG2Class" onchange="renderPairingsTable()" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-black outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="ALL">高二</option>
                                <option value="502">502 班</option>
                                <option value="503">503 班</option>
                                <option value="504">504 班</option>
                            </select>
                        </div>
                        <span id="pairedCountBadge" class="text-xs font-black px-3 py-1.5 rounded-xl bg-blue-50 text-blue-700 border border-blue-200">共 0 組</span>
                        <button type="button" onclick="exportFilteredPairings()" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-black transition shadow">📥 匯出 Excel</button>
                    </div>
                </div>

                <div class="overflow-x-auto max-h-[70vh] custom-scrollbar border border-slate-100 rounded-xl">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead class="bg-slate-50 text-slate-600 font-extrabold sticky top-0 border-b border-slate-200">
                            <tr>
                                <th class="p-3">高一班級</th>
                                <th class="p-3 w-16">座號</th>
                                <th class="p-3">高一姓名</th>
                                <th class="p-3 text-center">關係</th>
                                <th class="p-3">高二直屬姓名</th>
                                <th class="p-3">高二班級</th>
                                <th class="p-3 w-16">座號</th>
                                <th class="p-3">配對時間</th>
                            </tr>
                        </thead>
                        <tbody id="pairingsTableBody" class="divide-y divide-slate-100 font-bold text-slate-700">
                            <tr><td colspan="8" class="p-6 text-center text-slate-400">目前尚無配對資料。</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="pane_unpaired" class="route-pane hidden space-y-6">
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-4">
                    <div>
                        <h2 class="text-lg font-black text-slate-900 flex items-center gap-2">
                            <span class="w-2.5 h-5 bg-amber-500 rounded-full"></span>
                            尚未分配學生名冊
                        </h2>
                    </div>

                    <div class="flex flex-wrap items-center gap-2.5">
                        <div class="flex items-center gap-1.5">
                            <label class="text-xs font-black text-slate-600">年級：</label>
                            <select id="filterUnpairedGrade" onchange="renderUnpairedTable()" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-black outline-none focus:ring-2 focus:ring-amber-500">
                                <option value="ALL">全部</option>
                                <option value="G1">高一</option>
                                <option value="G2">高二</option>
                            </select>
                        </div>

                        <div class="flex items-center gap-1.5">
                            <label class="text-xs font-black text-slate-600">班級：</label>
                            <select id="filterUnpairedClass" onchange="renderUnpairedTable()" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-black outline-none focus:ring-2 focus:ring-amber-500">
                                <option value="ALL">全部班級</option>
                                <optgroup label="高一班級">
                                    <option value="402">402 班</option>
                                    <option value="403">403 班</option>
                                    <option value="404">404 班</option>
                                </optgroup>
                                <optgroup label="高二班級">
                                    <option value="502">502 班</option>
                                    <option value="503">503 班</option>
                                    <option value="504">504 班</option>
                                </optgroup>
                            </select>
                        </div>

                        <span id="unpairedCountBadge" class="text-xs font-black px-3 py-1.5 rounded-xl bg-amber-50 text-amber-800 border border-amber-200">共 0 人</span>
                        <button type="button" onclick="exportFilteredUnpaired()" class="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-black transition shadow">📥 匯出剩餘名冊</button>
                    </div>
                </div>

                <div class="overflow-x-auto max-h-[70vh] custom-scrollbar border border-slate-100 rounded-xl">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead class="bg-slate-50 text-slate-600 font-extrabold sticky top-0 border-b border-slate-200">
                            <tr>
                                <th class="p-3">班級</th>
                                <th class="p-3 w-16">座號</th>
                                <th class="p-3 w-20">年級</th>
                                <th class="p-3">姓名</th>
                                <th class="p-3">學號</th>
                                <th class="p-3 w-20">性別</th>
                                <th class="p-3">抽籤狀態</th>
                            </tr>
                        </thead>
                        <tbody id="unpairedTableBody" class="divide-y divide-slate-100 font-bold text-slate-700">
                            <tr><td colspan="7" class="p-6 text-center text-slate-400">目前沒有尚未配對之學生！</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <footer class="py-4 text-center text-xs text-slate-400 font-semibold border-t border-slate-200/60">
        © 臺中市立新社高級中學學生會 ＆ 開發團隊 版權所有
    </footer>

    <script>
        const SUPABASE_URL = "https://qpqtiavufscdfwhabnod.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ehTz6hW_jpdiO7Ht3Xq-yw_UoRl7F6M";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allStudents = [];
        let allPairings = [];
        let currentFilteredPairings = [];
        let currentFilteredUnpaired = [];

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.innerText = msg;
            t.className = `fixed top-5 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl text-white font-extrabold text-sm shadow-xl transition-all duration-300 ${isError ? 'bg-rose-500' : 'bg-emerald-600'}`;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2800);
        }

        async function logAudit(actionType, details = {}) {
            try {
                await client.from('audit_logs').insert([{ action_type: actionType, details }]);
            } catch (e) {}
        }

        function setRoute(r) {
            window.location.hash = `#${r}`;
        }

        function handleHashRouting() {
            const rawHash = (window.location.hash || '').replace('#', '').replace('/', '');
            let current = 'draw';
            if (rawHash === 'paired') current = 'paired';
            if (rawHash === 'unpaired') current = 'unpaired';

            document.querySelectorAll('.route-pane').forEach(el => el.classList.add('hidden'));
            ['draw', 'paired', 'unpaired'].forEach(k => {
                const b = document.getElementById(`tabBtn_${k}`);
                if (b) b.className = "px-4 py-1.5 rounded-xl text-xs font-black bg-slate-800 text-slate-300 hover:text-white transition";
            });

            document.getElementById(`pane_${current}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tabBtn_${current}`);
            if (activeBtn) activeBtn.className = "px-4 py-1.5 rounded-xl text-xs font-black bg-blue-600 text-white shadow transition";

            if (current === 'draw') {
                updateDrawDashboard();
            } else if (current === 'paired') {
                renderPairingsTable();
            } else if (current === 'unpaired') {
                renderUnpairedTable();
            }
        }

        async function loadData() {
            try {
                const { data: stData } = await client.from('students').select('*');
                allStudents = stData || [];

                const { data: pairData } = await client.from('pairings').select('*').order('paired_at', { ascending: false });
                allPairings = pairData || [];

                handleHashRouting();
            } catch (err) {
                showToast("連線讀取失敗：" + err.message, true);
            }
        }

        function checkPhaseOneCompletion() {
            const targetClasses = ['402', '403', '404'];
            const allTargetG1 = allStudents.filter(s => s.grade === 'G1' && targetClasses.some(c => s.class_name.includes(c)));
            const pairedG1Set = new Set(allPairings.map(p => p.g1_student_no));

            const uncompletedG1 = allTargetG1.filter(s => !pairedG1Set.has(s.student_no));
            return {
                isCompleted: uncompletedG1.length === 0,
                uncompletedCount: uncompletedG1.length,
                totalTargetG1: allTargetG1.length
            };
        }

        function updateDrawDashboard() {
            const targetClassesG1 = ['402', '403', '404'];
            const targetClassesG2 = ['502', '503', '504'];

            const g1Total = allStudents.filter(s => s.grade === 'G1' && targetClassesG1.some(c => s.class_name.includes(c))).length;
            const g2Total = allStudents.filter(s => s.grade === 'G2' && targetClassesG2.some(c => s.class_name.includes(c))).length;
            const pairedCount = allPairings.length;
            const pairedG2Set = new Set(allPairings.map(p => p.g2_student_no));
            const g2Remaining = allStudents.filter(s => s.grade === 'G2' && targetClassesG2.some(c => s.class_name.includes(c)) && !pairedG2Set.has(s.student_no)).length;

            document.getElementById('statG1Count').innerText = g1Total;
            document.getElementById('statG2Count').innerText = g2Total;
            document.getElementById('statPairedCount').innerText = pairedCount;
            document.getElementById('statG2Remaining').innerText = g2Remaining;

            const check = checkPhaseOneCompletion();
            const stageBox = document.getElementById('stageNoticeBox');
            const stageText = document.getElementById('stageNoticeText');
            const stageRemText = document.getElementById('stageG1RemainingText');

            if (!check.isCompleted) {
                stageBox.className = "p-4 rounded-2xl border bg-blue-50 border-blue-200 text-blue-900 text-xs font-bold flex items-center justify-between";
                stageText.innerText = "目前階段：高一各班各抽一位直屬";
                stageRemText.innerText = `尚有 ${check.uncompletedCount} 人未抽到直屬`;
            } else {
                stageBox.className = "p-4 rounded-2xl border bg-purple-50 border-purple-200 text-purple-900 text-xs font-bold flex items-center justify-between";
                stageText.innerText = "目前階段：高一全數分配完成！高二超額多出學生加抽";
                stageRemText.innerText = `高二待抽剩餘 ${g2Remaining} 人，分派後部分高一將擁有兩位直屬`;
            }
        }

        function getEligibleG2Students() {
            const pairedG2Nos = new Set(allPairings.map(p => p.g2_student_no));
            const allG2 = allStudents.filter(s => s.grade === 'G2' && !pairedG2Nos.has(s.student_no));
            return allG2.filter(s => s.class_name.includes('502') || s.class_name.includes('503') || s.class_name.includes('504'));
        }

        async function startSingleDraw() {
            const selectedClass = document.getElementById('drawClassSelect').value;
            const classG1 = allStudents.filter(s => s.grade === 'G1' && s.class_name.includes(selectedClass));
            if (classG1.length === 0) {
                showToast(`高一 ${selectedClass} 班尚未匯入學生名單！`, true);
                return;
            }

            const availableG2 = getEligibleG2Students();
            if (availableG2.length === 0) {
                showToast(`高二已配對完畢，無剩餘名額！`, true);
                return;
            }

            const phaseOne = checkPhaseOneCompletion();
            const pairedG1Set = new Set(allPairings.map(p => p.g1_student_no));
            const unpairedInThisClass = classG1.filter(s => !pairedG1Set.has(s.student_no));

            if (!phaseOne.isCompleted && unpairedInThisClass.length === 0) {
                showToast(`【第一階段進行中】${selectedClass} 班已分配直屬！請先將其他班級抽完再進入加抽階段！`, true);
                return;
            }

            let targetG1 = null;
            let isSecondRound = false;

            if (unpairedInThisClass.length > 0) {
                targetG1 = unpairedInThisClass[0];
            } else {
                isSecondRound = true;
                targetG1 = classG1[Math.floor(Math.random() * classG1.length)];
            }

            const chosenG2 = availableG2[Math.floor(Math.random() * availableG2.length)];

            document.getElementById('btnSingleDraw').disabled = true;
            document.getElementById('btnBatchDraw').disabled = true;

            const displayEl = document.getElementById('drawDisplayBox');
            const statusEl = document.getElementById('drawStatusText');
            statusEl.innerText = isSecondRound
                ? `⚡ [超額加抽] 為 ${targetG1.class_name} 班 ${targetG1.name} 抽選第 2 位直屬學長姐...`
                : `正在為 ${targetG1.class_name} 班 ${targetG1.name} 抽選直屬學長姐...`;

            let counter = 0;
            const interval = setInterval(() => {
                const randCandidate = availableG2[Math.floor(Math.random() * availableG2.length)];
                displayEl.innerHTML = `
                    <div class="text-3xl sm:text-5xl font-black text-slate-800 tracking-wider">
                        ${randCandidate.class_name} ${randCandidate.name}
                    </div>
                `;
                counter++;
                if (counter > 16) {
                    clearInterval(interval);
                    saveSinglePairing(targetG1, chosenG2, isSecondRound);
                }
            }, 60);
        }

        async function saveSinglePairing(g1Student, g2Student, isSecondRound) {
            try {
                const { error } = await client.from('pairings').insert({
                    g1_student_no: g1Student.student_no,
                    g2_student_no: g2Student.student_no
                });
                if (error) throw error;

                document.getElementById('drawDisplayBox').innerHTML = `
                    <div class="flex flex-wrap items-center justify-center gap-3 text-2xl sm:text-4xl font-black py-4">
                        <span class="text-blue-600 bg-blue-50 px-4 py-2 rounded-2xl border border-blue-200">
                            ${g1Student.class_name} ${g1Student.seat_no ? `${g1Student.seat_no}號 ` : ''}${g1Student.name}
                        </span>
                        <span class="text-slate-400 text-lg sm:text-xl font-bold">
                            ${isSecondRound ? '喜獲第 2 位直屬 ➔' : '配對 ➔'}
                        </span>
                        <span class="text-emerald-600 bg-emerald-50 px-4 py-2 rounded-2xl border border-emerald-200">
                            ${g2Student.class_name} ${g2Student.seat_no ? `${g2Student.seat_no}號 ` : ''}${g2Student.name}
                        </span>
                    </div>
                `;
                document.getElementById('drawStatusText').innerText = isSecondRound ? `🎉 超額加抽成功！${g1Student.name} 獲得兩位直屬！` : "🎉 抽選配對成功！";
                showToast(`🎉 配對成功：${g1Student.name} ➔ ${g2Student.name}！`);
                await logAudit(isSecondRound ? "現場單人超額加抽" : "現場單人抽取直屬", {
                    g1: `${g1Student.class_name} ${g1Student.name} (${g1Student.student_no})`,
                    g2: `${g2Student.class_name} ${g2Student.name} (${g2Student.student_no})`
                });
                await loadData();
            } catch (err) {
                showToast("配對儲存失敗：" + err.message, true);
            } finally {
                document.getElementById('btnSingleDraw').disabled = false;
                document.getElementById('btnBatchDraw').disabled = false;
            }
        }

        async function startBatchDraw() {
            const selectedClass = document.getElementById('drawClassSelect').value;
            const classG1 = allStudents.filter(s => s.grade === 'G1' && s.class_name.includes(selectedClass));
            if (classG1.length === 0) {
                showToast(`高一 ${selectedClass} 班尚未匯入學生名冊！`, true);
                return;
            }

            const availableG2 = getEligibleG2Students();
            if (availableG2.length === 0) {
                showToast(`高二已配對完畢，無剩餘名額！`, true);
                return;
            }

            const pairedG1Set = new Set(allPairings.map(p => p.g1_student_no));
            const unpairedInThisClass = classG1.filter(s => !pairedG1Set.has(s.student_no));
            const phaseOne = checkPhaseOneCompletion();

            if (!phaseOne.isCompleted && unpairedInThisClass.length === 0) {
                showToast(`【第一階段進行中】${selectedClass} 班高一已全數配對！請先至其他尚未抽完的班級進行抽籤！`, true);
                return;
            }

            for (let i = availableG2.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [availableG2[i], availableG2[j]] = [availableG2[j], availableG2[i]];
            }

            const pairingsPayload = [];
            const resultList = [];
            let g2Idx = 0;

            if (unpairedInThisClass.length > 0) {
                const limit = Math.min(unpairedInThisClass.length, availableG2.length);
                for (let i = 0; i < limit; i++) {
                    const g1 = unpairedInThisClass[i];
                    const g2 = availableG2[g2Idx];
                    pairingsPayload.push({
                        g1_student_no: g1.student_no,
                        g2_student_no: g2.student_no
                    });
                    resultList.push({ g1, g2, isSecond: false });
                    g2Idx++;
                }
            } else {
                const shuffledG1 = [...classG1].sort(() => Math.random() - 0.5);
                let g1Idx = 0;
                while (g2Idx < availableG2.length) {
                    const g1 = shuffledG1[g1Idx % shuffledG1.length];
                    const g2 = availableG2[g2Idx];
                    pairingsPayload.push({
                        g1_student_no: g1.student_no,
                        g2_student_no: g2.student_no
                    });
                    resultList.push({ g1, g2, isSecond: true });
                    g2Idx++;
                    g1Idx++;
                }
            }

            document.getElementById('btnSingleDraw').disabled = true;
            document.getElementById('btnBatchDraw').disabled = true;

            try {
                const { error } = await client.from('pairings').insert(pairingsPayload);
                if (error) throw error;

                const isExtra = unpairedInThisClass.length === 0;
                const msg = isExtra 
                    ? `🎉 ${selectedClass} 班完成批次超額加抽（共 ${pairingsPayload.length} 位獲得第 2 位直屬）！`
                    : `🎉 ${selectedClass} 班完成批次第一輪抽配（共 ${pairingsPayload.length} 組）！`;

                showToast(msg);
                document.getElementById('drawStatusText').innerText = `✨ 已完成 ${selectedClass} 班自動抽配！本次共完成 ${pairingsPayload.length} 組直屬名單如下：`;

                const displayEl = document.getElementById('drawDisplayBox');
                displayEl.innerHTML = `
                    <div class="w-full max-h-96 overflow-y-auto custom-scrollbar p-2 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 text-left">
                        ${resultList.map((item) => `
                            <div class="p-3 bg-white border border-slate-200 rounded-xl shadow-xs flex items-center justify-between text-xs">
                                <div>
                                    <div class="font-black text-blue-700 text-sm">
                                        ${item.g1.seat_no ? `${item.g1.seat_no}號 ` : ''}${item.g1.name}${item.isSecond ? '<span class="ml-1 text-[10px] bg-purple-100 text-purple-700 px-1 py-0.5 rounded font-black">第2位</span>' : ''}
                                    </div>
                                    <div class="text-[10px] text-slate-400 font-mono">${item.g1.class_name} 班 ｜ ${item.g1.student_no}</div>
                                </div>
                                <div class="text-slate-300 font-black px-1">➔</div>
                                <div class="text-right">
                                    <div class="font-black text-emerald-700 text-sm">
                                        ${item.g2.seat_no ? `${item.g2.seat_no}號 ` : ''}${item.g2.name}
                                    </div>
                                    <div class="text-[10px] text-slate-400 font-mono">${item.g2.class_name} 班 ｜ ${item.g2.student_no}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                await logAudit(isExtra ? "批次超額加抽" : "班級批次抽直屬", { class: selectedClass, count: pairingsPayload.length });
                await loadData();
            } catch (err) {
                showToast("批次配對失敗：" + err.message, true);
            } finally {
                document.getElementById('btnSingleDraw').disabled = false;
                document.getElementById('btnBatchDraw').disabled = false;
            }
        }

        function renderPairingsTable() {
            const tbody = document.getElementById('pairingsTableBody');
            const countBadge = document.getElementById('pairedCountBadge');
            const g1Filter = document.getElementById('filterG1Class')?.value || 'ALL';
            const g2Filter = document.getElementById('filterG2Class')?.value || 'ALL';
            if (!tbody) return;

            const studentMap = {};
            allStudents.forEach(s => { studentMap[s.student_no] = s; });

            const g1Counts = {};
            allPairings.forEach(p => {
                g1Counts[p.g1_student_no] = (g1Counts[p.g1_student_no] || 0) + 1;
            });

            currentFilteredPairings = allPairings.filter(p => {
                const g1 = studentMap[p.g1_student_no] || {};
                const g2 = studentMap[p.g2_student_no] || {};
                if (g1Filter !== 'ALL' && !String(g1.class_name || '').includes(g1Filter)) return false;
                if (g2Filter !== 'ALL' && !String(g2.class_name || '').includes(g2Filter)) return false;
                return true;
            });

            currentFilteredPairings.sort((a, b) => {
                const g1A = studentMap[a.g1_student_no] || { class_name: '', seat_no: 0 };
                const g1B = studentMap[b.g1_student_no] || { class_name: '', seat_no: 0 };
                const seatA = parseInt(g1A.seat_no, 10) || 0;
                const seatB = parseInt(g1B.seat_no, 10) || 0;

                if (g1Filter !== 'ALL') {
                    return seatA - seatB;
                } else {
                    const classCompare = String(g1A.class_name || '').localeCompare(String(g1B.class_name || ''), undefined, { numeric: true });
                    if (classCompare !== 0) return classCompare;
                    return seatA - seatB;
                }
            });

            if (countBadge) countBadge.innerText = `共 ${currentFilteredPairings.length} 組關係`;

            if (currentFilteredPairings.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400">目前無符合條件之配對記錄。</td></tr>`;
                return;
            }

            tbody.innerHTML = currentFilteredPairings.map(p => {
                const g1 = studentMap[p.g1_student_no] || { name: '未知', class_name: '-', seat_no: '-' };
                const g2 = studentMap[p.g2_student_no] || { name: '未知', class_name: '-', seat_no: '-' };
                const hasTwoMentors = (g1Counts[p.g1_student_no] || 0) > 1;

                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 font-bold">${g1.class_name} 班</td>
                        <td class="p-3 font-mono text-slate-800">${g1.seat_no ? `${g1.seat_no}號` : '-'}</td>
                        <td class="p-3 font-black text-slate-900">
                            ${g1.name} 
                            <span class="text-slate-400 font-mono text-[11px]">(${p.g1_student_no})</span>
                            ${hasTwoMentors ? '<span class="ml-1 px-1.5 py-0.5 rounded text-[10px] bg-purple-100 text-purple-700 font-black">2位直屬</span>' : ''}
                        </td>
                        <td class="p-3 text-center text-blue-600 font-black">➔</td>
                        <td class="p-3 font-black text-slate-900">${g2.name} <span class="text-slate-400 font-mono text-[11px]">(${p.g2_student_no})</span></td>
                        <td class="p-3 font-bold">${g2.class_name} 班</td>
                        <td class="p-3 font-mono text-slate-800">${g2.seat_no ? `${g2.seat_no}號` : '-'}</td>
                        <td class="p-3 font-mono text-slate-400 text-[11px]">${new Date(p.paired_at).toLocaleString('zh-TW')}</td>
                    </tr>
                `;
            }).join('');
        }

        function exportFilteredPairings() {
            if (currentFilteredPairings.length === 0) {
                showToast("無配對名冊可供匯出！", true);
                return;
            }
            const studentMap = {};
            allStudents.forEach(s => { studentMap[s.student_no] = s; });

            const rows = currentFilteredPairings.map(p => {
                const g1 = studentMap[p.g1_student_no] || {};
                const g2 = studentMap[p.g2_student_no] || {};
                return {
                    "高一班級": g1.class_name || '',
                    "高一座號": g1.seat_no || '',
                    "高一姓名": g1.name || '',
                    "高一學號": p.g1_student_no,
                    "高二直屬姓名": g2.name || '',
                    "高二直屬班級": g2.class_name || '',
                    "高二直屬座號": g2.seat_no || '',
                    "高二直屬學號": p.g2_student_no,
                    "配對時間": new Date(p.paired_at).toLocaleString('zh-TW')
                };
            });

            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "已配對清冊");
            XLSX.writeFile(wb, `直屬配對清冊_${new Date().toISOString().slice(0, 10)}.xlsx`);
        }

        function renderUnpairedTable() {
            const tbody = document.getElementById('unpairedTableBody');
            const countBadge = document.getElementById('unpairedCountBadge');
            const gradeFilter = document.getElementById('filterUnpairedGrade')?.value || 'ALL';
            const classFilter = document.getElementById('filterUnpairedClass')?.value || 'ALL';
            if (!tbody) return;

            const pairedG1Set = new Set(allPairings.map(p => p.g1_student_no));
            const pairedG2Set = new Set(allPairings.map(p => p.g2_student_no));

            let list = allStudents.filter(s => {
                if (s.grade === 'G1' && pairedG1Set.has(s.student_no)) return false;
                if (s.grade === 'G2' && pairedG2Set.has(s.student_no)) return false;
                return true;
            });

            if (gradeFilter !== 'ALL') list = list.filter(s => s.grade === gradeFilter);
            if (classFilter !== 'ALL') list = list.filter(s => s.class_name.includes(classFilter));

            list.sort((a, b) => {
                const seatA = parseInt(a.seat_no, 10) || 0;
                const seatB = parseInt(b.seat_no, 10) || 0;

                if (classFilter !== 'ALL') {
                    return seatA - seatB;
                } else {
                    const classCompare = String(a.class_name || '').localeCompare(String(b.class_name || ''), undefined, { numeric: true });
                    if (classCompare !== 0) return classCompare;
                    return seatA - seatB;
                }
            });

            currentFilteredUnpaired = list;
            if (countBadge) countBadge.innerText = `共 ${currentFilteredUnpaired.length} 人`;

            if (currentFilteredUnpaired.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">目前沒有尚未配對之學生！</td></tr>`;
                return;
            }

            tbody.innerHTML = currentFilteredUnpaired.map(s => {
                const isG1 = s.grade === 'G1';
                const statusTag = isG1 
                    ? '<span class="px-2 py-0.5 rounded text-[10px] font-black bg-blue-50 text-blue-700 border border-blue-200">高一 ｜ 尚無直屬</span>'
                    : '<span class="px-2 py-0.5 rounded text-[10px] font-black bg-amber-50 text-amber-700 border border-amber-200">高二 ｜ 待抽籤池</span>';

                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 font-bold text-slate-800">${s.class_name} 班</td>
                        <td class="p-3 font-mono text-slate-800">${s.seat_no ? `${s.seat_no}號` : '-'}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-black ${isG1 ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}">${isG1 ? '高一' : '高二'}</span></td>
                        <td class="p-3 font-black text-slate-900">${s.name}</td>
                        <td class="p-3 font-mono text-slate-500">${s.student_no}</td>
                        <td class="p-3">${s.gender || '-'}</td>
                        <td class="p-3">${statusTag}</td>
                    </tr>
                `;
            }).join('');
        }

        function exportFilteredUnpaired() {
            if (currentFilteredUnpaired.length === 0) {
                showToast("無未配對名冊可供匯出！", true);
                return;
            }
            const rows = currentFilteredUnpaired.map(s => ({
                "班級": s.class_name,
                "座號": s.seat_no || '',
                "年級": s.grade === 'G1' ? '高一' : '高二',
                "姓名": s.name,
                "學號": s.student_no,
                "性別": s.gender || '',
                "狀態": s.grade === 'G1' ? '尚無直屬' : '待抽籤池'
            }));

            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "未被抽取名冊");
            XLSX.writeFile(wb, `未被抽取學生名冊_${new Date().toISOString().slice(0, 10)}.xlsx`);
        }

        window.addEventListener('hashchange', handleHashRouting);
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
