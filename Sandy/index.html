<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商城下單系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <header id="appHeader" class="hidden bg-slate-900/90 backdrop-blur-md border-b border-slate-800 text-white sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-lg shadow-lg shadow-indigo-500/30">
                    🛍️
                </div>
                <h1 class="text-base sm:text-lg font-black tracking-wide text-white">商城下單系統</h1>
            </div>
            <div id="navUserArea" class="flex items-center gap-3 text-sm"></div>
        </div>
    </header>

    <main class="flex-1 flex flex-col justify-center relative overflow-hidden">

        <section id="loginSection" class="relative z-10 w-full max-w-[430px] mx-auto px-4 py-10">
            <div class="absolute -top-32 -left-32 w-80 h-80 bg-indigo-600/30 rounded-full blur-[100px] pointer-events-none"></div>
            <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-violet-600/25 rounded-full blur-[100px] pointer-events-none"></div>

            <div class="bg-slate-800/85 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-8 sm:p-10 shadow-2xl shadow-black/50 text-white relative">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-violet-500 mb-3.5 shadow-xl shadow-indigo-500/25 text-2xl">
                        🔐
                    </div>
                    <h2 class="text-2xl font-black tracking-tight text-white">帳號登入</h2>
                </div>

                <form onsubmit="handleUnifiedLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5 tracking-wide">帳號</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                                👤
                            </span>
                            <input type="text" id="loginAccount" required placeholder="請輸入帳號" class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5 tracking-wide">密碼</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                                🔑
                            </span>
                            <input type="password" id="loginPassword" placeholder="請輸入密碼" class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                        </div>
                    </div>

                    <div id="loginErrorMsg" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-bold"></div>

                    <button type="submit" id="btnSubmitLogin" class="w-full py-3.5 mt-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-extrabold rounded-xl shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition flex items-center justify-center gap-2 text-sm tracking-wide">
                        <span>確認登入</span>
                        <span>→</span>
                    </button>
                </form>
            </div>
        </section>

        <section id="staffView" class="hidden max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">
            <div class="bg-indigo-950/60 border border-indigo-800/50 p-5 rounded-2xl flex flex-wrap items-center justify-between gap-4 text-white">
                <div>
                    <h2 class="text-xl font-black text-white" id="staffWelcomeTitle">選購專區</h2>
                    <p class="text-xs text-indigo-300 mt-0.5" id="staffInfoSubtitle"></p>
                </div>
                <div class="flex items-center gap-2.5 bg-slate-900/80 px-4 py-2.5 rounded-xl border border-indigo-500/30 shadow-inner">
                    <span class="text-xs font-bold text-slate-400">剩餘虛擬幣：</span>
                    <span id="staffBalanceDisplay" class="text-2xl font-black text-indigo-400">300</span>
                    <span class="text-xs font-bold text-indigo-400">幣</span>
                </div>
            </div>

            <div id="productListArea" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
        </section>

        <section id="studentView" class="hidden max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">
            <div class="bg-emerald-950/60 border border-emerald-800/50 p-5 rounded-2xl flex items-center justify-between text-white">
                <div>
                    <h2 class="text-xl font-black text-white" id="studentGroupNameHeader">商品管理後台</h2>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl text-white">
                <h3 class="text-sm font-black mb-4 pb-2 border-b border-slate-700/80 text-white">新增上架商品</h3>
                <form onsubmit="handleCreateProduct(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">商品名稱</label>
                        <input type="text" id="newProdName" required placeholder="請輸入商品名稱" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">單價 (虛擬幣)</label>
                        <input type="number" id="newProdPrice" min="1" required placeholder="請輸入單價" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">商品圖片連結 (URL)</label>
                        <input type="url" id="newProdImg" placeholder="https://..." class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div class="sm:col-span-3 text-right">
                        <button type="submit" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-xl text-sm transition shadow-lg shadow-emerald-600/30">確認發布上架</button>
                    </div>
                </form>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl text-white">
                <h3 class="text-sm font-black mb-4">目前已上架商品</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left border-collapse border border-slate-700">
                        <thead class="bg-slate-900/80 text-slate-300 font-extrabold">
                            <tr>
                                <th class="p-3 border border-slate-700 w-16">預覽</th>
                                <th class="p-3 border border-slate-700">商品名稱</th>
                                <th class="p-3 border border-slate-700 w-24">單價</th>
                                <th class="p-3 border border-slate-700 w-36">上架時間</th>
                                <th class="p-3 border border-slate-700 w-20 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="studentProductTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="teacherView" class="hidden max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">
            <div class="bg-amber-950/60 border border-amber-800/50 p-5 rounded-2xl text-white flex flex-wrap justify-between items-center gap-4">
                <div>
                    <h2 class="text-xl font-black text-white" id="monitorTitle">全覽儀表板</h2>
                </div>
                <div id="adminActionBtnArea" class="hidden">
                    <button type="button" onclick="resetAllBalances()" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 rounded-xl text-xs font-black transition shadow-lg shadow-rose-600/30">重置全體教職員額度 (300)</button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl text-white">
                    <h3 class="text-sm font-black mb-3 flex items-center gap-1.5 text-white">
                        <span>📦</span> 各組商品上架紀錄
                    </h3>
                    <div class="overflow-x-auto max-h-96">
                        <table class="w-full text-xs text-left border-collapse border border-slate-700">
                            <thead class="bg-slate-900/80 text-slate-300 font-extrabold sticky top-0">
                                <tr>
                                    <th class="p-2.5 border border-slate-700">組別</th>
                                    <th class="p-2.5 border border-slate-700">商品名稱</th>
                                    <th class="p-2.5 border border-slate-700">單價</th>
                                    <th class="p-2.5 border border-slate-700">上架時間</th>
                                </tr>
                            </thead>
                            <tbody id="teacherProductTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl text-white">
                    <h3 class="text-sm font-black mb-3 flex items-center gap-1.5 text-white">
                        <span>📋</span> 下單紀錄
                    </h3>
                    <div class="overflow-x-auto max-h-96">
                        <table class="w-full text-xs text-left border-collapse border border-slate-700">
                            <thead class="bg-slate-900/80 text-slate-300 font-extrabold sticky top-0">
                                <tr>
                                    <th class="p-2.5 border border-slate-700">訂購人</th>
                                    <th class="p-2.5 border border-slate-700">商品 (組別)</th>
                                    <th class="p-2.5 border border-slate-700 text-center">數量</th>
                                    <th class="p-2.5 border border-slate-700">總金額</th>
                                    <th class="p-2.5 border border-slate-700">下單時間</th>
                                </tr>
                            </thead>
                            <tbody id="teacherOrderTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        const SUPABASE_URL = "https://dhmbxkswwjzsflwcjpiz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_HUfSJgvMX0iYCoZ6AUlF1Q_VewS2O2p";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentAuth = null;

        function showLoginError(msg) {
            const errEl = document.getElementById('loginErrorMsg');
            errEl.innerText = msg;
            errEl.classList.remove('hidden');
        }

        function clearLoginError() {
            const errEl = document.getElementById('loginErrorMsg');
            errEl.innerText = '';
            errEl.classList.add('hidden');
        }

        async function handleUnifiedLogin(e) {
            e.preventDefault();
            clearLoginError();

            const account = document.getElementById('loginAccount').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!account) {
                showLoginError("請輸入帳號！");
                return;
            }

            const btn = document.getElementById('btnSubmitLogin');
            btn.disabled = true;
            btn.innerText = "驗證中...";

            try {
                const { data: user, error } = await client
                    .from('users')
                    .select('*')
                    .eq('account', account.toLowerCase())
                    .maybeSingle();

                if (error) {
                    showLoginError("系統錯誤：" + error.message);
                    return;
                }

                if (!user) {
                    showLoginError("查無此帳號，請重新輸入！");
                    return;
                }

                if (user.role !== 'staff') {
                    if (user.password !== password) {
                        showLoginError("密碼錯誤，請重新輸入！");
                        return;
                    }
                }

                currentAuth = user;
                renderAuthViews();

                if (user.role === 'student') {
                    currentAuth.group_no = parseInt(user.account, 10);
                    loadStudentProducts();
                } else if (user.role === 'staff') {
                    loadStaffMall();
                } else if (user.role === 'teacher' || user.role === 'admin') {
                    loadTeacherDashboard();
                }

            } catch (err) {
                showLoginError("登入系統發生異常：" + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>確認登入</span><span>→</span>`;
            }
        }

        function handleLogout() {
            currentAuth = null;
            document.getElementById('loginAccount').value = '';
            document.getElementById('loginPassword').value = '';
            clearLoginError();
            renderAuthViews();
        }

        function renderAuthViews() {
            const loginSec = document.getElementById('loginSection');
            const staffSec = document.getElementById('staffView');
            const studentSec = document.getElementById('studentView');
            const teacherSec = document.getElementById('teacherView');
            const header = document.getElementById('appHeader');
            const navUser = document.getElementById('navUserArea');
            const adminBtnArea = document.getElementById('adminActionBtnArea');
            const monitorTitle = document.getElementById('monitorTitle');

            [loginSec, staffSec, studentSec, teacherSec].forEach(el => el.classList.add('hidden'));

            if (!currentAuth) {
                loginSec.classList.remove('hidden');
                header.classList.add('hidden');
                document.body.className = "bg-slate-900 text-slate-800 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white";
                return;
            }

            header.classList.remove('hidden');
            document.body.className = "bg-slate-900 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white";

            let roleName = "";
            if (currentAuth.role === 'staff') {
                roleName = `${currentAuth.name} (${currentAuth.account})`;
                staffSec.classList.remove('hidden');
                document.getElementById('staffWelcomeTitle').innerText = `${currentAuth.name} 的選購專區`;
                document.getElementById('staffInfoSubtitle').innerText = `帳號：${currentAuth.account} ｜ 郵件：${currentAuth.email}`;
            } else if (currentAuth.role === 'student') {
                roleName = `第 ${currentAuth.group_no} 組`;
                studentSec.classList.remove('hidden');
                document.getElementById('studentGroupNameHeader').innerText = `第 ${currentAuth.group_no} 組 商品管理後台`;
            } else if (currentAuth.role === 'teacher') {
                roleName = `任課教師`;
                monitorTitle.innerText = "任課教師全覽儀表板";
                adminBtnArea.classList.add('hidden');
                teacherSec.classList.remove('hidden');
            } else if (currentAuth.role === 'admin') {
                roleName = `系統管理員`;
                monitorTitle.innerText = "全覽儀表板";
                adminBtnArea.classList.remove('hidden');
                teacherSec.classList.remove('hidden');
            }

            navUser.innerHTML = `
                <span class="font-bold text-indigo-300">${roleName}</span>
                <button type="button" onclick="handleLogout()" class="px-3 py-1.5 bg-rose-600/80 hover:bg-rose-500 rounded-lg text-xs font-bold transition shadow-sm">登出</button>
            `;
        }

        async function loadStaffMall() {
            const { data: staff } = await client.from('users').select('*').eq('account', currentAuth.account).single();
            if (staff) {
                currentAuth = staff;
                document.getElementById('staffBalanceDisplay').innerText = staff.balance;
            }

            const { data: products } = await client.from('products').select('*').order('created_at', { ascending: false });
            const listArea = document.getElementById('productListArea');

            if (!products || products.length === 0) {
                listArea.innerHTML = `<div class="col-span-full p-12 text-center text-slate-500 font-bold bg-slate-800/40 border border-slate-800 rounded-2xl">目前尚無上架商品。</div>`;
                return;
            }

            listArea.innerHTML = products.map(p => {
                const imgTag = p.image_url 
                    ? `<img src="${p.image_url}" alt="${p.name}" class="w-full h-40 object-cover rounded-t-xl" onerror="this.onerror=null;this.src='https://placehold.co/400x300/1e293b/94a3b8?text=無圖片';">`
                    : `<div class="w-full h-40 bg-slate-800/80 flex items-center justify-center text-slate-500 font-bold text-xs rounded-t-xl">無圖片</div>`;

                return `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl flex flex-col justify-between overflow-hidden hover:border-slate-600 transition">
                        ${imgTag}
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <span class="inline-block px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-[10px] font-black mb-1.5">第 ${p.group_no} 組</span>
                                <h3 class="font-black text-sm text-white">${p.name}</h3>
                            </div>
                            <div class="mt-4 flex items-center justify-between">
                                <span class="text-lg font-black text-rose-400">${p.price} <span class="text-xs">幣</span></span>
                                <div class="flex items-center gap-1.5">
                                    <input type="number" id="qty-${p.id}" min="1" value="1" class="w-12 px-1.5 py-1 bg-slate-900 border border-slate-700 text-white rounded-lg text-xs text-center focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                    <button type="button" onclick="purchaseProduct('${p.id}', '${p.name}', ${p.group_no}, ${p.price})" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition shadow-md shadow-indigo-600/30">下單</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function purchaseProduct(productId, prodName, groupNo, price) {
            const qty = parseInt(document.getElementById(`qty-${productId}`).value, 10);
            if (!qty || qty <= 0) {
                alert("請填寫正確的購買數量！");
                return;
            }

            const total = price * qty;
            if (currentAuth.balance < total) {
                alert(`虛擬幣不足！需花費 ${total} 幣，目前僅剩餘 ${currentAuth.balance} 幣。`);
                return;
            }

            if (!confirm(`確定要花費 ${total} 幣購買【${prodName}】共 ${qty} 件嗎？`)) return;

            const newBal = currentAuth.balance - total;
            const { error: balErr } = await client.from('users').update({ balance: newBal }).eq('account', currentAuth.account);
            if (balErr) {
                alert("扣款失敗：" + balErr.message);
                return;
            }

            const { error: orderErr } = await client.from('orders').insert({
                account: currentAuth.account,
                product_id: productId,
                product_name: prodName,
                group_no: groupNo,
                unit_price: price,
                quantity: qty,
                total_amount: total
            });

            if (orderErr) {
                alert("下單失敗：" + orderErr.message);
                return;
            }

            alert("🎉 下單成功！已扣除 " + total + " 個虛擬幣。");
            loadStaffMall();
        }

        async function loadStudentProducts() {
            const { data: prods } = await client.from('products').select('*').eq('group_no', currentAuth.group_no).order('created_at', { ascending: false });
            const tbody = document.getElementById('studentProductTableBody');

            if (!prods || prods.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">目前尚無上架商品。</td></tr>`;
                return;
            }

            tbody.innerHTML = prods.map(p => `
                <tr class="border-b border-slate-700/60">
                    <td class="p-2 border border-slate-700">
                        ${p.image_url ? `<img src="${p.image_url}" class="w-10 h-10 object-cover rounded-lg">` : `<span class="text-slate-500">無</span>`}
                    </td>
                    <td class="p-2 border border-slate-700 font-bold">${p.name}</td>
                    <td class="p-2 border border-slate-700 text-rose-400 font-extrabold">${p.price} 幣</td>
                    <td class="p-2 border border-slate-700 text-slate-400">${new Date(p.created_at).toLocaleString('zh-TW')}</td>
                    <td class="p-2 border border-slate-700 text-center">
                        <button type="button" onclick="deleteProduct('${p.id}')" class="px-2 py-1 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 rounded font-bold transition">下架</button>
                    </td>
                </tr>
            `).join('');
        }

        async function handleCreateProduct(e) {
            e.preventDefault();
            const name = document.getElementById('newProdName').value.trim();
            const price = parseInt(document.getElementById('newProdPrice').value, 10);
            const img = document.getElementById('newProdImg').value.trim();

            const { error } = await client.from('products').insert({
                group_no: currentAuth.group_no,
                name: name,
                price: price,
                image_url: img || null
            });

            if (error) {
                alert("商品上架失敗：" + error.message);
                return;
            }

            alert("✅ 商品上架成功！");
            document.getElementById('newProdName').value = '';
            document.getElementById('newProdPrice').value = '';
            document.getElementById('newProdImg').value = '';
            loadStudentProducts();
        }

        async function deleteProduct(productId) {
            if (!confirm("確定要下架此項商品嗎？")) return;
            const { error } = await client.from('products').delete().eq('id', productId);
            if (error) {
                alert("下架失敗：" + error.message);
                return;
            }
            loadStudentProducts();
        }

        async function loadTeacherDashboard() {
            const { data: prods } = await client.from('products').select('*').order('created_at', { ascending: false });
            const pTbody = document.getElementById('teacherProductTableBody');
            if (prods && prods.length > 0) {
                pTbody.innerHTML = prods.map(p => `
                    <tr class="border-b border-slate-700/60">
                        <td class="p-2 border border-slate-700 font-black text-indigo-400">第 ${p.group_no} 組</td>
                        <td class="p-2 border border-slate-700 font-bold">${p.name}</td>
                        <td class="p-2 border border-slate-700 text-rose-400 font-bold">${p.price} 幣</td>
                        <td class="p-2 border border-slate-700 text-slate-400">${new Date(p.created_at).toLocaleString('zh-TW')}</td>
                    </tr>
                `).join('');
            } else {
                pTbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-slate-400">目前尚無商品上架。</td></tr>`;
            }

            const { data: orders } = await client.from('orders').select('*').order('created_at', { ascending: false });
            const { data: staffList } = await client.from('users').select('account, name, email').eq('role', 'staff');
            const staffMap = {};
            if (staffList) {
                staffList.forEach(s => { staffMap[s.account] = s; });
            }

            const oTbody = document.getElementById('teacherOrderTableBody');
            if (orders && orders.length > 0) {
                oTbody.innerHTML = orders.map(o => {
                    const staff = staffMap[o.account] || { name: '教職員', email: '' };
                    return `
                        <tr class="border-b border-slate-700/60">
                            <td class="p-2 border border-slate-700">
                                <div class="font-bold text-white">${staff.name}</div>
                                <div class="text-[10px] text-slate-400">${o.account} ｜ ${staff.email}</div>
                            </td>
                            <td class="p-2 border border-slate-700 font-bold">${o.product_name} <span class="text-[10px] text-slate-400">(第${o.group_no}組)</span></td>
                            <td class="p-2 border border-slate-700 text-center font-bold">${o.quantity}</td>
                            <td class="p-2 border border-slate-700 text-rose-400 font-black">${o.total_amount} 幣</td>
                            <td class="p-2 border border-slate-700 text-slate-400">${new Date(o.created_at).toLocaleString('zh-TW')}</td>
                        </tr>
                    `;
                }).join('');
            } else {
                oTbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-slate-400">目前尚無下單紀錄。</td></tr>`;
            }
        }

        async function resetAllBalances() {
            if (!confirm("確定要將全體教職員的虛擬幣餘額重置為 300 點嗎？")) return;
            const { error } = await client.from('users').update({ balance: 300 }).eq('role', 'staff');
            if (error) {
                alert("重置失敗：" + error.message);
                return;
            }
            alert("✅ 全體教職員虛擬幣額度已重置為 300 點！");
            loadTeacherDashboard();
        }

        renderAuthViews();
    </script>
</body>
</html>
