<!DOCTYPE html>

<head>

            <h2 class="text-2xl font-black text-center text-slate-800 tracking-tight mb-1">帳號登入</h2>

                            </div>
                            <div>
                                <label class="block text-xs font-extrabold text-slate-600 mb-1">單價 (虛擬幣)</label>
                                <input type="number" id="newProdPrice" min="1" required placeholder="例如：35" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:bg-white outline-none focus:ring-2 focus:ring-emerald-500">
                            </div>
                            <div>
                                <label class="block text-xs font-extrabold text-slate-600 mb-1">上傳商品照片 (支援多選)</label>
                                <input type="file" id="newProdFiles" accept="image/*" multiple onchange="handleImageFilesSelected(this)" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-black file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">

                                </div>
                            </div>

                            <div class="sm:col-span-3 text-right pt-2 border-t border-slate-100">
                                <button type="submit" id="submitProductBtn" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-xs transition shadow-md shadow-emerald-600/20">
                                    確認發布上架

                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                        <h3 class="text-sm font-black text-slate-800 mb-4">本組目前已上架商品清單</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-xs text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-600 font-extrabold border-b border-slate-200">
                                        <th class="p-3 w-28">圖片預覽</th>

                <section id="teacherView" class="hidden space-y-6">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                            <h3 class="text-sm font-black text-slate-800 mb-3 flex items-center gap-1.5">
                                <span>📦</span> 各組實作商品上架紀錄
                            </h3>
                            <div class="overflow-x-auto max-h-96 custom-scrollbar">

                                        <tr>
                                            <th class="p-2.5">組別</th>
                                            <th class="p-2.5">商品名稱</th>

                                </table>

                        <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                            <h3 class="text-sm font-black text-slate-800 mb-3 flex items-center gap-1.5">
                                <span>📋</span> 教職員下單採購紀錄
                            </h3>
                            <div class="overflow-x-auto max-h-96 custom-scrollbar">
                                <table class="w-full text-xs text-left border-collapse">
                                    <thead class="bg-slate-50 text-slate-600 font-extrabold sticky top-0 border-b border-slate-200">
                                        <tr>
                                            <th class="p-2.5">訂購人</th>
                                            <th class="p-2.5">商品 (組別)</th>
                                            <th class="p-2.5 text-center">數量</th>
                                            <th class="p-2.5">總額</th>
                                            <th class="p-2.5">下單時間</th>
                                        </tr>
                                    </thead>
                                    <tbody id="teacherOrderTableBody" class="divide-y divide-slate-100 font-bold text-slate-700"></tbody>

                </section>

                <footer class="mt-12 text-center text-xs text-slate-400 font-semibold pt-6 border-t border-slate-200/80">
                    <div>© 臺中市立新社高級中學商業經營科 & 開發團隊 版權所有</div>
                </footer>

            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://dhmbxkswwjzsflwcjpiz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_HUfSJgvMX0iYCoZ6AUlF1Q_VewS2O2p";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const AUTH_STORAGE_KEY = 'sshs_mall_auth_user';

        let currentAuth = null;
        let selectedBase64Images = [];

        function showMsg(txt, isError = false) {
            const b = document.getElementById('msgBox');
            if (!b) return;
            b.innerText = txt;
            b.className = `fixed top-5 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl text-white font-extrabold text-sm shadow-xl transition-all duration-300 ${isError ? 'bg-rose-500' : 'bg-emerald-600'}`;
            b.style.display = 'block';
            setTimeout(() => { b.style.display = 'none'; }, 2600);
        }

        function showLoginError(msg) {
            const errEl = document.getElementById('loginErrorMsg');
            errEl.innerText = msg;
            errEl.classList.remove('hidden');
        }

        function clearLoginError() {
            const errEl = document.getElementById('loginErrorMsg');
            errEl.innerText = '';
            errEl.classList.add('hidden');
        }

        function parseImages(rawUrl) {
            if (!rawUrl) return [];
            return rawUrl.split(/[\n,]+/).map(u => u.trim()).filter(u => u.length > 0);
        }

        function switchMainImage(prodId, targetUrl) {
            const mainImg = document.getElementById(`main-img-${prodId}`);
            if (mainImg) mainImg.src = targetUrl;
        }

        function openLightbox(url) {
            const modal = document.getElementById('imageLightboxModal');
            const img = document.getElementById('lightboxImg');
            if (modal && img) {
                img.src = url;
                modal.classList.remove('hidden');
            }
        }

        function closeLightbox() {
            const modal = document.getElementById('imageLightboxModal');
            if (modal) modal.classList.add('hidden');
        }

        function compressImage(file, maxWidth = 800, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        async function handleImageFilesSelected(input) {
            if (!input.files || input.files.length === 0) return;
            const previewContainer = document.getElementById('selectedImagePreviews');
            previewContainer.innerHTML = '<span class="text-xs text-emerald-600 font-bold px-2">🔄 正在處理並壓縮圖片中...</span>';

            try {
                for (let i = 0; i < input.files.length; i++) {
                    const file = input.files[i];
                    if (file.type.startsWith('image/')) {
                        const b64 = await compressImage(file);
                        selectedBase64Images.push(b64);
                    }
                }
                renderSelectedImagePreviews();
            } catch (err) {
                showMsg("圖片讀取或壓縮失敗：" + err.message, true);
            }
        }

        function removeSelectedImage(index) {
            selectedBase64Images.splice(index, 1);
            renderSelectedImagePreviews();
        }

        function renderSelectedImagePreviews() {
            const previewContainer = document.getElementById('selectedImagePreviews');
            if (!previewContainer) return;

            if (selectedBase64Images.length === 0) {
                previewContainer.innerHTML = '<span class="text-xs text-slate-400 font-bold px-2">尚未選擇照片，可一次選取多張照片直接上傳。</span>';
                return;
            }

            previewContainer.innerHTML = selectedBase64Images.map((b64, idx) => `
                <div class="relative group">
                    <img src="${b64}" class="w-14 h-14 object-cover rounded-xl border border-slate-200 shadow-sm">
                    <button type="button" onclick="removeSelectedImage(${idx})" class="absolute -top-1.5 -right-1.5 bg-rose-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] font-black shadow hover:bg-rose-700 transition">✕</button>
                </div>
            `).join('') + `<span class="text-xs font-black text-emerald-700 ml-2">已選取 ${selectedBase64Images.length} 張照片</span>`;
        }

        function activateUserSession(user) {
            currentAuth = user;
            localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(user));
            renderAuthViews();

            if (user.role === 'student') {
                currentAuth.group_no = parseInt(user.account, 10);
                loadStudentProducts();
            } else if (user.role === 'staff') {
                loadStaffMall();
            } else if (user.role === 'teacher' || user.role === 'admin') {
                loadTeacherDashboard();
            }

            loadGlobalStats();
        }

        async function restoreSession() {
            const savedUserStr = localStorage.getItem(AUTH_STORAGE_KEY);
            if (!savedUserStr) return;

            try {
                const localUser = JSON.parse(savedUserStr);
                if (!localUser || !localUser.account) return;

                const { data: dbUser, error } = await client
                    .from('users')
                    .select('*')
                    .eq('account', localUser.account)
                    .maybeSingle();

                if (!error && dbUser) {
                    activateUserSession(dbUser);
                } else {
                    localStorage.removeItem(AUTH_STORAGE_KEY);
                }
            } catch (e) {
                localStorage.removeItem(AUTH_STORAGE_KEY);
            }
        }

        async function handleUnifiedLogin(e) {
            e.preventDefault();
            clearLoginError();

            const rawAccount = document.getElementById('loginAccount').value.trim();
            const rawPassword = document.getElementById('loginPassword').value.trim();

            if (!rawAccount) {
                showLoginError("請輸入帳號！");
                return;
            }

            const btn = document.getElementById('btnSubmitLogin');
            btn.disabled = true;
            btn.innerText = "驗證中...";

            try {
                const { data: usersList, error } = await client
                    .from('users')
                    .select('*')
                    .ilike('account', rawAccount);

                if (error) {
                    showLoginError("資料庫連線錯誤：" + error.message);
                    return;
                }

                if (!usersList || usersList.length === 0) {
                    showLoginError("查無此帳號，請確認輸入是否正確！");
                    return;
                }

                const user = usersList[0];

                if (user.role !== 'staff') {
                    if ((user.password || '').trim() !== rawPassword) {
                        showLoginError("密碼錯誤，請重新輸入！");
                        return;
                    }
                }

                activateUserSession(user);

            } catch (err) {
                showLoginError("系統發生未預期錯誤：" + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>確認登入</span>`;
            }
        }

        function handleLogout() {
            currentAuth = null;
            selectedBase64Images = [];
            localStorage.removeItem(AUTH_STORAGE_KEY);
            document.getElementById('loginAccount').value = '';
            document.getElementById('loginPassword').value = '';
            clearLoginError();
            renderAuthViews();
        }

        function renderAuthViews() {
            const authWorkspace = document.getElementById('authWorkspace');
            const appWorkspace = document.getElementById('appWorkspace');
            const staffSec = document.getElementById('staffView');
            const studentSec = document.getElementById('studentView');
            const teacherSec = document.getElementById('teacherView');
            const teacherActionGroup = document.getElementById('teacherActionGroup');
            const userStatusDisplay = document.getElementById('userStatusDisplay');

            [staffSec, studentSec, teacherSec].forEach(el => el.classList.add('hidden'));

            if (!currentAuth) {
                authWorkspace.style.display = 'flex';
                appWorkspace.classList.add('hidden');
                return;
            }

            authWorkspace.style.display = 'none';
            appWorkspace.classList.remove('hidden');

            let roleTitle = "使用者";
            if (currentAuth.role === 'staff') roleTitle = "教職員";
            else if (currentAuth.role === 'student') roleTitle = `第 ${currentAuth.group_no || currentAuth.account} 組`;
            else if (currentAuth.role === 'teacher') roleTitle = "任課教師";
            else if (currentAuth.role === 'admin') roleTitle = "系統管理員";

            userStatusDisplay.innerHTML = `您好，<b class="text-amber-300">${currentAuth.name}</b> ｜ ${roleTitle} <span class="text-slate-400 text-xs">(${currentAuth.account})</span>`;

            if (currentAuth.role === 'staff') {
                staffSec.classList.remove('hidden');
            } else if (currentAuth.role === 'student') {
                studentSec.classList.remove('hidden');
            } else if (currentAuth.role === 'teacher' || currentAuth.role === 'admin') {
                teacherSec.classList.remove('hidden');
                if (currentAuth.role === 'admin') {
                    teacherActionGroup.classList.remove('hidden');
                } else {
                    teacherActionGroup.classList.add('hidden');
                }
            }
        }

        async function loadGlobalStats() {
            const grid = document.getElementById('statCardsGrid');
            if (!grid) return;

            const { data: staffData } = await client.from('users').select('balance').eq('account', currentAuth.account).maybeSingle();
            const myBalance = staffData ? staffData.balance : (currentAuth.balance || 0);

            const { count: productCount } = await client.from('products').select('*', { count: 'exact', head: true });
            const { data: allOrders } = await client.from('orders').select('total_amount, quantity');

            const orderCount = allOrders ? allOrders.length : 0;
            const totalTurnover = allOrders ? allOrders.reduce((sum, o) => sum + (o.total_amount || 0), 0) : 0;

            grid.innerHTML = `
                <div class="bg-slate-50 border border-slate-200/80 p-3.5 rounded-xl flex flex-col justify-between">
                    <span class="text-[11px] font-bold text-slate-500">我的虛擬幣餘額</span>
                    <div class="text-xl font-black text-emerald-600 my-1">${myBalance} <span class="text-xs font-bold text-slate-400">幣</span></div>
                    <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-emerald-500 h-full" style="width: ${Math.min(100, Math.round((myBalance / 300) * 100))}%"></div>
                    </div>
                </div>
                <div class="bg-slate-50 border border-slate-200/80 p-3.5 rounded-xl flex flex-col justify-between">
                    <span class="text-[11px] font-bold text-slate-500">上架商品總數</span>
                    <div class="text-xl font-black text-indigo-600 my-1">${productCount || 0} <span class="text-xs font-bold text-slate-400">項</span></div>
                    <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-indigo-500 h-full" style="width: 100%"></div>
                    </div>
                </div>
                <div class="bg-slate-50 border border-slate-200/80 p-3.5 rounded-xl flex flex-col justify-between">
                    <span class="text-[11px] font-bold text-slate-500">全校下單成交筆數</span>
                    <div class="text-xl font-black text-amber-600 my-1">${orderCount} <span class="text-xs font-bold text-slate-400">筆</span></div>
                    <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-amber-500 h-full" style="width: 100%"></div>
                    </div>
                </div>
                <div class="bg-slate-50 border border-slate-200/80 p-3.5 rounded-xl flex flex-col justify-between">
                    <span class="text-[11px] font-bold text-slate-500">累積總交易虛擬幣</span>
                    <div class="text-xl font-black text-rose-600 my-1">${totalTurnover} <span class="text-xs font-bold text-slate-400">幣</span></div>
                    <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-rose-500 h-full" style="width: 100%"></div>
                    </div>
                </div>
            `;
        }

        async function loadStaffMall() {
            const { data: staff } = await client.from('users').select('*').eq('account', currentAuth.account).single();
            if (staff) currentAuth = staff;

            const { data: products } = await client.from('products').select('*').order('created_at', { ascending: false });
            const listArea = document.getElementById('productListArea');
            const countBadge = document.getElementById('productCountBadge');

            if (countBadge) countBadge.innerText = `共 ${products ? products.length : 0} 項商品`;

            if (!products || products.length === 0) {
                listArea.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 font-bold bg-white rounded-2xl border border-slate-200">目前尚無各組學生上架商品。</div>`;
                return;
            }

            listArea.innerHTML = products.map(p => {
                const images = parseImages(p.image_url);
                const firstImg = images.length > 0 ? images[0] : '';
                
                let imgHeaderHtml = '';
                if (images.length > 0) {
                    imgHeaderHtml = `
                        <div class="relative group bg-slate-100 flex items-center justify-center">
                            <img id="main-img-${p.id}" src="${firstImg}" alt="${p.name}" class="w-full h-44 object-cover rounded-t-2xl cursor-pointer" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://placehold.co/400x300?text=無圖片';">
                            ${images.length > 1 ? `<span class="absolute bottom-2 right-2 bg-slate-900/70 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full">共 ${images.length} 張圖</span>` : ''}
                        </div>
                    `;
                    if (images.length > 1) {
                        imgHeaderHtml += `
                            <div class="flex gap-1.5 p-2 bg-slate-50 border-b border-slate-100 overflow-x-auto custom-scrollbar">
                                ${images.map((img, idx) => `
                                    <img src="${img}" class="w-10 h-10 object-cover rounded-lg border border-slate-200 cursor-pointer hover:border-emerald-500 transition shrink-0" onclick="switchMainImage('${p.id}', '${img}')">
                                `).join('')}
                            </div>
                        `;
                    }
                } else {
                    imgHeaderHtml = `<div class="w-full h-44 bg-slate-100 flex items-center justify-center text-slate-400 font-bold text-xs rounded-t-2xl">暫無圖片</div>`;
                }

                return `
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm flex flex-col justify-between overflow-hidden hover:border-slate-300 transition">
                        ${imgHeaderHtml}
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <span class="inline-block px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 text-[10px] font-black border border-emerald-200 mb-1.5">第 ${p.group_no} 組</span>
                                <h4 class="font-black text-sm text-slate-800 leading-snug">${p.name}</h4>
                            </div>
                            <div class="mt-4 flex items-center justify-between pt-2 border-t border-slate-100">
                                <span class="text-base font-black text-rose-600">${p.price} <span class="text-xs">幣</span></span>
                                <div class="flex items-center gap-1.5">
                                    <input type="number" id="qty-${p.id}" min="1" value="1" class="w-12 px-1.5 py-1 bg-slate-50 border border-slate-200 text-slate-800 rounded-lg text-xs font-bold text-center focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                    <button type="button" onclick="purchaseProduct('${p.id}', '${p.name}', ${p.group_no}, ${p.price})" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-extrabold transition shadow-sm">下單</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function purchaseProduct(productId, prodName, groupNo, price) {
            const qty = parseInt(document.getElementById(`qty-${productId}`).value, 10);
            if (!qty || qty <= 0) {
                showMsg("請填寫正確的購買數量！", true);
                return;
            }

            const total = price * qty;
            if (currentAuth.balance < total) {
                showMsg(`虛擬幣不足！需花費 ${total} 幣，目前僅剩餘 ${currentAuth.balance} 幣。`, true);
                return;
            }

            if (!confirm(`確定要花費 ${total} 幣購買【${prodName}】共 ${qty} 件嗎？`)) return;

            const newBal = currentAuth.balance - total;
            const { error: balErr } = await client.from('users').update({ balance: newBal }).eq('account', currentAuth.account);
            if (balErr) {
                showMsg("扣款失敗：" + balErr.message, true);
                return;
            }

            const { error: orderErr } = await client.from('orders').insert({
                account: currentAuth.account,
                product_id: productId,
                product_name: prodName,
                group_no: groupNo,
                unit_price: price,
                quantity: qty,
                total_amount: total
            });

            if (orderErr) {
                showMsg("下單失敗：" + orderErr.message, true);
                return;
            }

            showMsg(`🎉 下單成功！已扣除 ${total} 個虛擬幣。`);
            loadStaffMall();
            loadGlobalStats();
        }

        async function loadStudentProducts() {
            const { data: prods } = await client.from('products').select('*').eq('group_no', currentAuth.group_no).order('created_at', { ascending: false });
            const tbody = document.getElementById('studentProductTableBody');

            if (!prods || prods.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">目前尚無上架商品。</td></tr>`;
                return;
            }

            tbody.innerHTML = prods.map(p => {
                const images = parseImages(p.image_url);
                const firstImg = images.length > 0 ? images[0] : '';
                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 border-b border-slate-100">
                            ${firstImg ? `<div class="relative inline-block"><img src="${firstImg}" class="w-12 h-12 object-cover rounded-lg cursor-pointer" onclick="openLightbox('${firstImg}')">${images.length > 1 ? `<span class="absolute -top-1 -right-1 bg-slate-800 text-white text-[9px] px-1 rounded-full">${images.length}</span>` : ''}</div>` : `<span class="text-slate-300 font-normal">無</span>`}
                        </td>
                        <td class="p-3 border-b border-slate-100 font-extrabold text-slate-800">${p.name}</td>
                        <td class="p-3 border-b border-slate-100 text-rose-600 font-black">${p.price} 幣</td>
                        <td class="p-3 border-b border-slate-100 text-slate-400 font-mono text-[11px]">${new Date(p.created_at).toLocaleString('zh-TW')}</td>
                        <td class="p-3 border-b border-slate-100 text-center">
                            <button type="button" onclick="deleteProduct('${p.id}')" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-bold transition">下架</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function handleCreateProduct(e) {
            e.preventDefault();
            const name = document.getElementById('newProdName').value.trim();
            const price = parseInt(document.getElementById('newProdPrice').value, 10);
            const submitBtn = document.getElementById('submitProductBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = "發布中...";

            try {
                const joinedImages = selectedBase64Images.join('\n');

                const { error } = await client.from('products').insert({
                    group_no: currentAuth.group_no,
                    name: name,
                    price: price,
                    image_url: joinedImages || null
                });

                if (error) throw error;

                showMsg("✅ 商品上架成功！");
                document.getElementById('newProdName').value = '';
                document.getElementById('newProdPrice').value = '';
                document.getElementById('newProdFiles').value = '';
                selectedBase64Images = [];
                renderSelectedImagePreviews();
                loadStudentProducts();
                loadGlobalStats();

            } catch (err) {
                showMsg("商品上架失敗：" + err.message, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "確認發布上架";
            }
        }

        async function deleteProduct(productId) {
            if (!confirm("確定要下架此項商品嗎？")) return;
            const { error } = await client.from('products').delete().eq('id', productId);
            if (error) {
                showMsg("下架失敗：" + error.message, true);
                return;
            }
            loadStudentProducts();
            loadGlobalStats();
        }

        async function loadTeacherDashboard() {
            const { data: prods } = await client.from('products').select('*').order('created_at', { ascending: false });
            const pTbody = document.getElementById('teacherProductTableBody');
            if (prods && prods.length > 0) {
                pTbody.innerHTML = prods.map(p => `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-2.5 border-b border-slate-100 font-black text-emerald-600">第 ${p.group_no} 組</td>
                        <td class="p-2.5 border-b border-slate-100 font-extrabold text-slate-800">${p.name}</td>
                        <td class="p-2.5 border-b border-slate-100 text-rose-600 font-bold">${p.price} 幣</td>
                        <td class="p-2.5 border-b border-slate-100 text-slate-400 font-mono text-[11px]">${new Date(p.created_at).toLocaleString('zh-TW')}</td>
                    </tr>
                `).join('');
            } else {
                pTbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">目前尚無商品上架。</td></tr>`;
            }

            const { data: orders } = await client.from('orders').select('*').order('created_at', { ascending: false });
            const { data: staffList } = await client.from('users').select('account, name, email').eq('role', 'staff');
            const staffMap = {};
            if (staffList) {
                staffList.forEach(s => { staffMap[s.account] = s; });
            }

            const oTbody = document.getElementById('teacherOrderTableBody');
            if (orders && orders.length > 0) {
                oTbody.innerHTML = orders.map(o => {
                    const staff = staffMap[o.account] || { name: '教職員', email: '' };
                    return `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-2.5 border-b border-slate-100">
                                <div class="font-extrabold text-slate-800">${staff.name}</div>
                                <div class="text-[10px] text-slate-400 font-mono">${o.account} ｜ ${staff.email}</div>
                            </td>
                            <td class="p-2.5 border-b border-slate-100 font-extrabold text-slate-800">${o.product_name} <span class="text-[10px] text-slate-400">(第${o.group_no}組)</span></td>
                            <td class="p-2.5 border-b border-slate-100 text-center font-bold">${o.quantity}</td>
                            <td class="p-2.5 border-b border-slate-100 text-rose-600 font-black">${o.total_amount} 幣</td>
                            <td class="p-2.5 border-b border-slate-100 text-slate-400 font-mono text-[11px]">${new Date(o.created_at).toLocaleString('zh-TW')}</td>
                        </tr>
                    `;
                }).join('');
            } else {
                oTbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">目前尚無下單紀錄。</td></tr>`;
            }
        }

        async function resetAllBalances() {
            if (!confirm("確定要將全體教職員的虛擬幣餘額重置為 300 點嗎？")) return;
            const { error } = await client.from('users').update({ balance: 300 }).eq('role', 'staff');
            if (error) {
                showMsg("重置失敗：" + error.message, true);
                return;
            }
            showMsg("✅ 全體教職員虛擬幣額度已重置為 300 點！");
            loadTeacherDashboard();
            loadGlobalStats();
        }

        restoreSession();
    </script>
</body>
</html>
